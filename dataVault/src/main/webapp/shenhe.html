<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>物料信息审核系统</title>
  <link rel="stylesheet" href="css/all.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      /*box-sizing: border-box;*/
      font-family: Arial, sans-serif;
    }

    :root {
      --bg: #eef5ff;
      --surface: #ffffff;
      --surface-alt: #f5faff;
      --primary: #0f4aa8;
      --primary-strong: #0b2f6b;
      --accent: #1d63d4;
      --border: #cfe3ff;
      --text: #1f2937;
      --text-muted: #5b6b7a;
      --shadow: rgba(15, 74, 168, 0.12);
      --shadow-strong: rgba(11, 47, 107, 0.18);
      --danger: #c62828;
      --danger-bg: #ffe8ea;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 22px 20px;
      color: white;
      margin-bottom: 20px;
      background: var(--primary);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow: 0 10px 22px var(--shadow-strong);
    }

    header h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }

    header p {
      font-size: 1.1rem;
      max-width: 800px;
      margin: 0 auto;
      opacity: 0.92;
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 25px;
    }

    .stats-card {
      background: var(--surface);
      border-radius: 12px;
      padding: 20px;
      border: 1px solid var(--border);
      box-shadow: 0 8px 16px var(--shadow);
      text-align: center;
      transition: transform 0.3s ease;
    }

    .stats-card:hover {
      transform: translateY(-5px);
    }

    .stats-card h3 {
      font-size: 1rem;
      margin-bottom: 12px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .stats-card .number {
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--primary);
    }

    .filters-container {
      background: var(--surface-alt);
      border-radius: 12px;
      padding: 25px;
      border: 1px solid var(--border);
      box-shadow: 0 8px 16px var(--shadow);
      margin-bottom: 25px;
    }

    .filters-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .filters-header h2 {
      color: var(--primary-strong);
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .filter-group {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }

    .filter-item {
      display: flex;
      flex-direction: column;
    }

    .filter-item label {
      margin-bottom: 8px;
      font-weight: 500;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .filter-item select,
    .filter-item input {
      padding: 7px;
      border: 1px solid #b9d6ff;
      border-radius: 6px;
      font-size: 1rem;
      background: #ffffff;
      color: var(--text);
    }

    .filter-item select:focus,
    .filter-item input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(29, 99, 212, 0.16);
    }

    .filter-actions {
      display: flex;
      gap: 15px;
      margin-top: 10px;
    }

    .btn {
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 1rem;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;

    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-secondary {
      background: #355c8c;
      color: white;
    }

    .btn-danger {
      background: var(--danger);
      color: white;
    }

    .btn:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }

    .review-section {
      background: var(--surface);
      border-radius: 12px;
      padding: 25px;
      border: 1px solid var(--border);
      box-shadow: 0 8px 16px var(--shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid #dde9ff;
    }

    .section-header h2 {
      color: var(--primary-strong);
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .stats-summary {
      display: flex;
      gap: 15px;
      font-size: 0.9rem;
    }

    .stat-item {
      background: #dcecff;
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: 500;
      color: var(--primary-strong);
    }

    .stat-item.pending {
      background: #eef6ff;
      color: var(--primary);
    }

    .stat-item.approved {
      background: #d9ecff;
      color: var(--primary-strong);
    }

    .stat-item.rejected {
      background: var(--danger-bg);
      color: var(--danger);
    }

    .table-container {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .sticky-h-scroll {
      display: none;
      height: 14px;
      overflow-x: auto;
      overflow-y: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      border-bottom: none;
      border-radius: 8px 8px 0 0;
      z-index: 999;
      box-shadow: 0 -6px 14px rgba(11, 47, 107, 0.08);
      box-sizing: border-box;
    }

    .sticky-h-scroll__inner {
      height: 1px;
    }

    .sticky-table-header {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 0;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      border-top: none;
      border-radius: 0 0 8px 8px;
      z-index: 1000;
      box-shadow: 0 8px 16px rgba(11, 47, 107, 0.12);
      box-sizing: border-box;
    }

    .review-table--sticky {
      table-layout: fixed;
    }

    .review-table--sticky th {
      position: static;
      top: auto;
      box-sizing: border-box;
    }

    .review-table {
      display: inline-table;
      width: 100%;
      min-width: max-content;
      border-collapse: collapse;
      table-layout: auto;
    }

    .review-table th {
      background: var(--primary-strong);
      color: white;
      text-align: left;
      padding: 10px 12px;
      font-weight: 600;
      position: sticky;
      top: 0;
    }

    .review-table td {
      padding: 10px 12px;
      border-bottom: 1px solid #e0ecff;
      font-size: 0.95rem;
    }

    .review-table th,
    .review-table td {
      border-right: 1px solid #e0ecff;
    }

    .review-table th:last-child,
    .review-table td:last-child {
      border-right: none;
    }

    .review-table tbody tr:nth-child(even) {
      background-color: #f6faff;
    }

    .review-table tbody tr:nth-child(odd) {
      background-color: #ffffff;
    }

    .review-table tbody tr:hover {
      background-color: #eaf3ff;
    }

    .review-table th,
    .review-table td {
      white-space: nowrap;
    }

    .review-table th.col-view,
    .review-table td.col-view {
      width: 64px;
      text-align: center;
      padding-left: 10px;
      padding-right: 10px;
    }

    .pagination {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      flex-wrap: wrap;
      gap: 6px;
      padding-top: 8px;
    }

    .pager-btn {
      min-width: 38px;
      height: 36px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      cursor: pointer;
      font-weight: 600;
      color: var(--primary-strong);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    .pager-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .pager-btn.is-active {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
      cursor: default;
    }

    .pager-btn.is-icon {
      width: 44px;
      padding: 0;
    }

    .pager-total {
      height: 36px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      font-weight: 700;
      color: var(--primary-strong);
      background: var(--surface);
      margin-left: 6px;
    }

    .pager-jump {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-left: 6px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .pager-jump input {
      width: 60px;
      height: 36px;
      padding: 0 8px;
      border: 1px solid #b9d6ff;
      border-radius: 10px;
      text-align: center;
    }

    .pager-jump input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(29, 99, 212, 0.16);
    }

    .status {
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 500;
      display: inline-block;
    }

    .status-pending {
      background: #fff4cc;
      color: #9a6700;
    }

    .status-approved {
      background: #dcfce7;
      color: #15803d;
    }

    .status-rejected {
      background: var(--danger-bg);
      color: var(--danger);
    }

    .actions-cell {
      display: flex;
      gap: 8px;
    }

    .action-btn {
      padding: 4px 10px;
      border: 1px solid currentColor;
      background: transparent;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      transition: all 0.2s ease;
      font-size: 0.85rem;
      line-height: 1.2;
    }

    .approve-btn {
      background: var(--primary);
      color: white;
    }

    .reject-btn {
      background: #c62828;
      color: white;
    }

    .view-btn {
      color: var(--primary);
    }

    .action-btn:hover {
      background: rgba(15, 74, 168, 0.10);
      transform: none;
      opacity: 1;
    }

    .material-number {
      min-width: auto;
      max-width: none;
      word-break: normal;
    }

    .applicant-name {
      min-width: auto;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(11, 47, 107, 0.55);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: var(--surface);
      border-radius: 12px;
      width: 90%;
      max-width: 1000px;
      padding: 30px;
      border: 1px solid var(--border);
      box-shadow: 0 18px 40px rgba(11, 47, 107, 0.22);
      position: relative;
      height: 80vh;
      overflow-y: auto;
    }

    .close-modal {
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--text-muted);
    }

    .modal-header {
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid #dde9ff;
    }

    .modal-header h2 {
      color: var(--primary-strong);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 12px;
      border: 1px solid #b9d6ff;
      border-radius: 6px;
      font-size: 1rem;
      background: #ffffff;
      color: var(--text);
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(29, 99, 212, 0.16);
    }

    .form-group textarea {
      min-height: 120px;
      resize: vertical;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 15px;
      margin-top: 20px;
    }

    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 500;
      margin-left: 10px;
    }

    @media (max-width: 1200px) {
      .filter-group {
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      }
    }

    @media (max-width: 992px) {
      .filter-group {
        grid-template-columns: repeat(2, 1fr);
      }

      .section-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
      }

      .stats-summary {
        width: 100%;
        justify-content: space-between;
      }
    }

    @media (max-width: 768px) {
      .dashboard {
        grid-template-columns: repeat(2, 1fr);
      }

      .stats-card {
        min-width: auto;
      }

      .filter-group {
        grid-template-columns: 1fr;
      }

      .filter-actions {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }
    }

    @media (max-width: 576px) {
      .dashboard {
        grid-template-columns: 1fr;
      }

      .actions-cell {
        flex-direction: column;
      }

      .action-btn {
        width: 100%;
        justify-content: center;
      }
    }
    .attribute-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
      margin-top: 5px;
    }
    .attribute-table th {
      background-color: #f1f7ff;
      font-weight: 600;
      padding: 8px 12px;
      border-bottom: 1px solid #dde9ff;
      color: var(--primary-strong);
    }
    .attribute-table td {
      padding: 8px 12px;
      border-bottom: 1px solid #dde9ff;
    }
    .attribute-table tr:last-child td {
      border-bottom: none;
    }

    .info-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 25px;
      box-shadow: 0 4px 12px rgba(11, 47, 107, 0.06);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .info-table th {
      background: #f7fbff;
      color: var(--primary-strong);
      font-weight: 600;
      padding: 16px 20px;
      text-align: left;
      width: 30%;
      border-bottom: 1px solid #dde9ff;
    }

    .info-table td {
      padding: 16px 20px;
      background: #f7fbff;
      border-bottom: 1px solid #dde9ff;
    }

    .info-table tr:last-child td {
      border-bottom: none;
    }

    .info-table tr:hover th,
    .info-table tr:hover td  {
      background-color: #f0f7ff;
    }

    .info-table .notes-cell {
      white-space: pre-line;
      line-height: 1.6;
    }

    .modal-body {
      display: grid;
      grid-template-columns: 1fr;
      gap: 30px;
    }

    .section-title {
      font-size: 1.3rem;
      font-weight: 600;
      color: var(--primary-strong);
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-title i {
      font-size: 1.2rem;
    }

    /* 审核人标签 跟随状态配色 */
    .assignee-label {
      color: var(--text);
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
    }
    .assignee-pending {
      background: #eef6ff;
      color: var(--primary);
    }
    .assignee-approved {
      background: #d9ecff;
      color: var(--primary-strong);
    }
    .assignee-rejected {
      background: var(--danger-bg);
      color: var(--danger);
    }

    /* 分类信息展示样式 - 和页面表格保持统一风格 */
    .sort-info-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 25px;
      box-shadow: 0 4px 12px rgba(11, 47, 107, 0.06);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .sort-info-table th {
      background: #f7fbff;
      color: var(--primary-strong);
      font-weight: 600;
      padding: 16px 20px;
      text-align: left;
      width: 30%;
      border-bottom: 1px solid #dde9ff;
    }
    .sort-info-table td {
      padding: 16px 20px;
      background: #f7fbff;
      border-bottom: 1px solid #dde9ff;
    }
    .sort-info-table tr:last-child td {
      border-bottom: none;
    }
    .sort-info-table tr:hover th,
    .sort-info-table tr:hover td  {
      background-color: #f0f7ff;
    }

    /* 分类名称展示 */
    .sort-path-text {
      font-size: 14px;
      color: var(--text);
      font-weight: 500;
    }
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1><i class="fas fa-clipboard-check"></i> 物料信息审核系统</h1>
    <p>高效管理物料提交信息，集中处理审核任务，提高审批效率</p>
  </header>

  <div class="filters-container">
    <div class="filters-header">
      <h2><i class="fas fa-filter"></i> 筛选条件</h2>
      <div class="stats-summary">
        <div class="stat-item pending"></div>
        <div class="stat-item approved"></div>
        <div class="stat-item rejected"></div>
      </div>
    </div>

    <div class="filter-group">
      <div class="filter-item">
        <label for="statusFilter">审核状态</label>
        <select id="statusFilter">
          <option value="all">全部状态</option>
          <option value="0">待审核</option>
          <option value="1">已通过</option>
          <option value="2">已拒绝</option>
        </select>
      </div>
      <div class="filter-item">
        <label for="vaultFilter">仓库</label>
        <select id="vaultFilter">
          <option value="all">全部仓库</option>
          <option value="0">零件仓库</option>
          <option value="1">成品仓库</option>
        </select>
      </div>
      <div class="filter-item">
        <label for="myAuditFilter">我的审核</label>
        <select id="myAuditFilter">
          <option value="all">全部</option>
          <option value="my" selected>只看需要我审核的</option>
        </select>
      </div>
      <div class="filter-item">
        <label for="applicantFilter">申请人</label>
        <input type="text" id="applicantFilter" placeholder="输入申请人姓名">
      </div>
    </div>

    <div class="filter-group">
      <div class="filter-item">
        <label for="materialFilter">物料号</label>
        <input type="text" id="materialFilter" placeholder="输入物料号">
      </div>
      <div class="filter-item">
        <label for="examinerFilter">审核人</label>
        <input type="text" id="examinerFilter" placeholder="输入审核人姓名">
      </div>
      <div class="filter-item">
        <label for="search">关键词搜索</label>
        <input type="text" id="search" placeholder="输入备注或物料名...">
      </div>
      <div class="filter-item">
        <label>&nbsp;</label>
        <div class="filter-actions">
          <button class="btn btn-secondary" id="resetFilters"><i class="fas fa-sync-alt"></i> 重置筛选</button>
          <button class="btn btn-primary" id="applyFilters"><i class="fas fa-search"></i> 应用筛选</button>
        </div>
      </div>
    </div>
  </div>

  <div class="review-section">
    <div class="section-header">
      <h2><i class="fas fa-tasks"></i> 审核队列</h2>
    </div>

    <div class="table-container">
      <table class="review-table">
        <thead>
        <tr>
          <th class="col-view">查看</th>
          <th>ID</th>
          <th>申请人</th>
          <th>物料名</th>
          <th>物料号</th>
          <th>仓库</th>
          <th>状态</th>
          <th>提交时间</th>
          <th>审核人</th>
        </tr>
        </thead>
        <tbody>

        </tbody>
      </table>
    </div>
    <div class="sticky-h-scroll" id="stickyHScroll" aria-hidden="true">
      <div class="sticky-h-scroll__inner" id="stickyHScrollInner"></div>
    </div>
    <div class="sticky-table-header" id="stickyTableHeader" aria-hidden="true"></div>
    <div class="pagination" id="pagination"></div>
  </div>
</div>

<!-- 审核详情模态框 -->
<div class="modal" id="detailModal">
  <div class="modal-content">
    <span class="close-modal" onclick="closeModal()">&times;</span>
    <div class="modal-header">
      <h2>物料审核详情 <span id="itemStatus" class="status-badge status-pending">待审核</span></h2>

    </div>
    <div class="modal-body">
      <div>
        <div class="section-title">
          <i class="fas fa-info-circle"></i> 基本信息
        </div>
        <table class="info-table">
          <tr>
            <th>申请人</th>
            <td id="detailApplicant"></td>
          </tr>
          <tr>
            <th>物料名</th>
            <td id="detailName"></td>
          </tr>
          <tr>
            <th>物料号</th>
            <td id="detailMaterialNumber"></td>
          </tr>
          <tr>
            <th>描述</th>
            <td id="detailDescription"></td>
          </tr>
          <tr>
            <th>仓库</th>
            <td id="detailVault"></td>
          </tr>
          <tr>
            <th>提交时间</th>
            <td id="detailAppTime"></td>
          </tr>
          <tr>
            <th>审核人</th>
            <td id="detailAssignee"></td>
          </tr>
          <tr>
            <th>备注</th>
            <td id="detailNotes" class="notes-cell"></td>
          </tr>
        </table>
      </div>

      <div>
        <div class="section-title">
          <i class="fas fa-list"></i> 物料分类
        </div>
        <table class="sort-info-table">
          <tr>
            <th>物料分类</th>
            <td id="sort" class="sort-path-text"></td>
          </tr>
        </table>
        <div class="section-title">
          <i class="fas fa-list"></i> 物料属性
        </div>
        <table class="attribute-table">
          <thead>
          <tr>
            <th>属性名称</th>
            <th>属性值</th>
            <th>单位</th>
          </tr>
          </thead>
          <tbody id="attributeBody"></tbody>
        </table>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-primary" id="modalApproveBtn" style="display: none;">
        <i class="fas fa-check"></i> 通过
      </button>
      <button class="btn btn-danger" id="modalRejectBtn" style="display: none;">
        <i class="fas fa-times"></i> 拒绝
      </button>
      <button class="btn btn-secondary" onclick="closeModal()">关闭</button>
    </div>
  </div>
</div>

<script src="js/axios-0.18.0.js"></script>
<script>
  let currentUserId;
  let assignMap = {};
  let userMap = {};

  function initStickyTableScrollbar() {
    let tableContainer = document.querySelector(".table-container");
    let table = document.querySelector(".review-table");
    let tbody = table ? table.querySelector("tbody") : null;
    let thead = table ? table.querySelector("thead") : null;
    let bar = document.getElementById("stickyHScroll");
    let inner = document.getElementById("stickyHScrollInner");
    let stickyHeader = document.getElementById("stickyTableHeader");
    if (!tableContainer || !table || !bar || !inner || !stickyHeader || !thead) return;

    let stickyHeaderTable = null;

    let rafId = 0;
    let syncing = null;

    let requestUpdate = function () {
      if (rafId) return;
      rafId = window.requestAnimationFrame(function () {
        rafId = 0;
        update();
      });
    };

    let hasRows = function () {
      return !!(tbody && tbody.children && tbody.children.length > 0);
    };

    let needsXScroll = function () {
      return table.scrollWidth > tableContainer.clientWidth + 1;
    };

    let isVisible = function () {
      let r = tableContainer.getBoundingClientRect();
      return r.bottom > 0 && r.top < window.innerHeight;
    };

    let syncWidths = function () {
      inner.style.width = table.scrollWidth + "px";
    };

    let ensureStickyHeader = function () {
      if (stickyHeaderTable) return;
      stickyHeaderTable = document.createElement("table");
      stickyHeaderTable.className = "review-table review-table--sticky";
      stickyHeaderTable.appendChild(thead.cloneNode(true));
      stickyHeader.appendChild(stickyHeaderTable);
    };

    let syncHeaderColumnWidths = function () {
      if (!stickyHeaderTable) return;
      let srcThs = thead.querySelectorAll("th");
      let dstThs = stickyHeaderTable.querySelectorAll("th");
      if (!srcThs.length || srcThs.length !== dstThs.length) return;
      for (let i = 0; i < srcThs.length; i++) {
        let w = srcThs[i].offsetWidth;
        dstThs[i].style.width = w + "px";
      }
    };

    let updateStickyHeader = function () {
      ensureStickyHeader();

      if (!hasRows() || !isVisible()) {
        stickyHeader.style.display = "none";
        return;
      }

      let r = tableContainer.getBoundingClientRect();
        let cs = window.getComputedStyle(tableContainer);
        let borderLeft = parseFloat(cs.borderLeftWidth) || 0;
        let borderRight = parseFloat(cs.borderRightWidth) || 0;
        let scrollbarWidth = Math.max(0, tableContainer.offsetWidth - tableContainer.clientWidth - borderLeft - borderRight);
      let headRect = thead.getBoundingClientRect();
      let headHeight = headRect.height || 0;
      let visibleTop = Math.max(0, r.top);
      let visibleBottom = Math.min(window.innerHeight, r.bottom);
      let containerHasVisibleArea = visibleBottom > visibleTop + 1;
      let headerNotVisible = headRect.bottom <= visibleTop + 0.5;
      let stillHasContentBelowHeader = r.bottom > visibleTop + headHeight + 0.5;
      let shouldShow = containerHasVisibleArea && headerNotVisible && stillHasContentBelowHeader;

      if (!shouldShow) {
        stickyHeader.style.display = "none";
        return;
      }

      stickyHeader.style.display = "block";
      stickyHeader.style.left = r.left + "px";
      stickyHeader.style.top = visibleTop + "px";
      stickyHeader.style.width = r.width + "px";
        stickyHeader.style.paddingRight = scrollbarWidth + "px";

      stickyHeaderTable.style.width = table.scrollWidth + "px";
      stickyHeaderTable.style.transform = "translateX(" + (-tableContainer.scrollLeft) + "px)";
      syncHeaderColumnWidths();
    };

    let update = function () {
      syncWidths();

      if (!hasRows() || !needsXScroll() || !isVisible()) {
        bar.style.display = "none";
        updateStickyHeader();
        return;
      }

      bar.style.display = "block";

      let r = tableContainer.getBoundingClientRect();

      bar.style.width = r.width + "px";
      bar.style.position = "fixed";
      bar.style.left = r.left + "px";
      bar.style.top = "auto";
      bar.style.bottom = Math.max(0, window.innerHeight - r.bottom) + "px";

      if (syncing !== "bar") {
        bar.scrollLeft = tableContainer.scrollLeft;
      }

      updateStickyHeader();
    };

    tableContainer.addEventListener("scroll", function () {
      if (syncing === "bar") return;
      syncing = "container";
      bar.scrollLeft = tableContainer.scrollLeft;
      syncing = null;
      requestUpdate();
    }, { passive: true });

    bar.addEventListener("scroll", function () {
      if (syncing === "container") return;
      syncing = "bar";
      tableContainer.scrollLeft = bar.scrollLeft;
      syncing = null;
    }, { passive: true });

    window.addEventListener("scroll", requestUpdate, { passive: true });
    window.addEventListener("resize", requestUpdate);

    if (window.ResizeObserver) {
      let ro = new ResizeObserver(requestUpdate);
      ro.observe(tableContainer);
      ro.observe(table);
    }

    if (tbody && window.MutationObserver) {
      let mo = new MutationObserver(requestUpdate);
      mo.observe(tbody, { childList: true });
    }

    requestUpdate();
  }

  async function loadAllAssignMap() {
    const res = await axios.get("materialCategoryAssign/getAllAssignMap");
    assignMap = res.data || {};
  }

  async function loadAllUsers() {
    const res = await axios.get("user/selectAllUser");
    res.data.forEach(u => userMap[u.id] = u.name);
  }

  async function loadCurrentUser() {
    const res = await axios.post("user/selectLoginId");
    currentUserId = res.data;
  }

  function getAssigneeNames(sortId) {
    let userIds = assignMap[sortId] || [];
    return userIds.map(uid => userMap[uid] || uid).join("、");
  }

  function canAudit(sortId) {
    // 超级管理员：用户ID=1 拥有所有审核权限
    if (currentUserId === 1) {
      return true;
    }
    // 普通用户：按分类权限判断
    let userIds = assignMap[sortId] || [];
    return userIds.includes(currentUserId);
  }

  window.onload = async function () {
    await loadCurrentUser();
    await loadAllAssignMap();
    await loadAllUsers();
    selectAppForm();
  };

  window.addEventListener("load", function () {
    initStickyTableScrollbar();
  });

  function selectAppForm() {
    axios.post("productExamine/selectAllData").then(resp => {
      let items = resp.data;

      window.openModals = async function (item) {
        // 🔥 这里直接能拿到当前行的 item！所有信息都在！
        let isPending = Number(item.status) === 0;
        let allow = isPending && canAudit(item.parentId);

        document.getElementById("detailApplicant").innerText = item.appName;
        document.getElementById("detailName").innerText = item.name;
        document.getElementById("detailMaterialNumber").innerText = item.material_number;
        document.getElementById("detailDescription").innerText = item.description || "";
        document.getElementById("detailVault").innerText = item.vault === 0 ? "零件仓库" : "成品仓库";
        document.getElementById("detailAppTime").innerText = item.app_time.replace("T", " ");

        let showName = isPending ? getAssigneeNames(item.parentId) : (item.examineName || "无");
        document.getElementById("detailAssignee").innerText = showName;
        document.getElementById("detailNotes").innerText = item.note || "";

        let st = document.getElementById("itemStatus");
        st.className = "status-badge";

        if (Number(item.status) === 0) {
          st.classList.add("status-pending");
          st.innerText = "待审核";
        } else if (Number(item.status) === 1) {
          st.classList.add("status-approved");
          st.innerText = "已通过";
        } else {
          st.classList.add("status-rejected");
          st.innerText = "已拒绝";
        }

        document.getElementById("modalApproveBtn").style.display = allow ? "inline-block" : "none";
        document.getElementById("modalRejectBtn").style.display = allow ? "inline-block" : "none";
        document.getElementById("detailModal").style.display = "flex";
        //查询分类信息
        axios.post("productExamine/selectAllSort?vault=" + item.vault, item.product_id).then(r => {
          // 拼接分类名称
          let fullName = r.data.map(item => item.name).join(' / ');
          document.getElementById("sort").innerHTML=fullName;
        });

//查询属性信息
        axios.post("productExamine/selectAttribute?vault=" + item.vault, item.product_id).then(r => {
          let html = "";
          r.data.forEach(a => {
            html += `<tr><td>${a.name}</td><td>${a.content}</td><td>${a.unit || ""}</td></tr>`;
          });
          document.getElementById("attributeBody").innerHTML = html;
        });

        // ==============================================
        // 🔥🔥🔥 直接在这里绑定按钮！直接用 item.id！
        // ==============================================
        document.getElementById("modalApproveBtn").onclick = function () {
          axios.post("productExamine/updateStatus", {
            id: item.id,  // ✅ 直接用！绝对正确！
            status: 1
          }).then(r => {
            if (r.data === "success") {
              alert("审核通过");
              closeModal();
              location.reload();
            }
          });
        };

        document.getElementById("modalRejectBtn").onclick = function () {
          let note = prompt("请输入拒绝原因");
          if (!note) return;

          axios.post("productExamine/updateStatus", {
            id: item.id,  // ✅ 直接用！绝对正确！
            status: 2,
            note: note
          }).then(r => {
            if (r.data === "success") {
              alert("已拒绝");
              closeModal();
              location.reload();
            }
          });
        };
      };

      window.closeModal = function () {
        document.getElementById("detailModal").style.display = "none";
      };



      const pageSize = 15;
      let currentPage = 1;
      let currentList = [];

      function renderRows(list) {
        let tbody = document.querySelector(".review-table tbody");
        tbody.innerHTML = "";
        list.forEach(item => {
          let allow = canAudit(item.parentId);
          let isPending = Number(item.status) === 0;

          let showName = isPending ? getAssigneeNames(item.parentId) : (item.examineName || "无");
          let assigneeClass = "";
          if(Number(item.status) === 0){
            assigneeClass = "assignee-pending";
          }else if(Number(item.status) === 1){
            assigneeClass = "assignee-approved";
          }else{
            assigneeClass = "assignee-rejected";
          }

          let statusClass = Number(item.status) === 0 ? "status-pending" :
                  Number(item.status) === 1 ? "status-approved" : "status-rejected";
          let statusText = Number(item.status) === 0 ? "待审核" :
                  Number(item.status) === 1 ? "已通过" : "已拒绝";

          let tr = document.createElement("tr");
          tr.innerHTML = `
            <td class="col-view">
              <button class="action-btn view-btn" onclick="openModals(${JSON.stringify(item).replace(/"/g, '&quot;')})">查看</button>
            </td>
            <td>${item.id}</td>
            <td>${item.appName}</td>
            <td>${item.name}</td>
            <td>${item.material_number}</td>
            <td>${item.vault === 0 ? '零件仓库' : '成品仓库'}</td>
            <td><span class="status ${statusClass}">${statusText}</span></td>
            <td>${item.app_time.replace('T', ' ')}</td>
            <td><span class="assignee-label ${assigneeClass}">${showName || '未设置'}</span></td>
          `;
          tbody.appendChild(tr);
        });
      }

      function renderPagination(totalPages) {
        let el = document.getElementById("pagination");
        if (!el) return;

        let empty = totalPages === 0;

        let makeBtn = function (label, page, disabled, className) {
          let safeLabel = String(label);
          let safePage = Number(page);
          let cls = className ? ` ${className}` : "";
          return `<button type="button" class="pager-btn${cls}" data-page="${safePage}" ${disabled ? "disabled" : ""}>${safeLabel}</button>`;
        };

        let html = [];

        html.push(makeBtn("«", 1, empty || currentPage <= 1, "is-icon"));
        html.push(makeBtn("←", Math.max(1, currentPage - 1), empty || currentPage <= 1, "is-icon"));

        let maxNumeric = 10;
        let start = 1;
        let end = totalPages;
        if (!empty && totalPages > maxNumeric) {
          if (currentPage <= maxNumeric) {
            start = 1;
            end = maxNumeric;
          } else if (currentPage > totalPages - maxNumeric) {
            start = totalPages - maxNumeric + 1;
            end = totalPages;
          } else {
            start = currentPage - Math.floor(maxNumeric / 2);
            end = start + maxNumeric - 1;
          }
        }

        if (!empty && start > 1) {
          html.push(makeBtn("1", 1, false, currentPage === 1 ? "is-active" : ""));
          if (start > 2) {
            html.push(`<button type="button" class="pager-btn" disabled>…</button>`);
          }
        }

        for (let p = start; !empty && p <= end; p++) {
          html.push(makeBtn(String(p), p, false, p === currentPage ? "is-active" : ""));
        }

        if (!empty && end < totalPages) {
          if (end < totalPages - 1) {
            html.push(`<button type="button" class="pager-btn" disabled>…</button>`);
          }
          html.push(makeBtn(String(totalPages), totalPages, false, currentPage === totalPages ? "is-active" : ""));
        }

        html.push(makeBtn("→", Math.min(totalPages, currentPage + 1), empty || currentPage >= totalPages, "is-icon"));
        html.push(makeBtn("»", totalPages, empty || currentPage >= totalPages, "is-icon"));

        html.push(`<span class="pager-total">共${totalPages}页</span>`);
        html.push(`<span class="pager-jump">跳转 <input id="pagerInput" type="number" min="1" max="${totalPages}" value="${empty ? "" : currentPage}" ${empty ? "disabled" : ""}> 页</span>`);

        el.innerHTML = html.join("");

        el.onclick = function (e) {
          let btn = e.target.closest("button[data-page]");
          if (!btn || btn.disabled) return;
          let page = Number(btn.dataset.page);
          if (!Number.isFinite(page) || page < 1 || page > totalPages) return;
          if (page === currentPage) return;
          currentPage = page;
          renderPage();
        };

        let input = document.getElementById("pagerInput");
        input.onkeydown = function (e) {
          if (e.key === "Enter") {
            input.blur();
          }
        };
        input.onchange = function () {
          if (totalPages === 0) return;
          let value = Number(input.value);
          if (!Number.isFinite(value) || value < 1) value = 1;
          if (value > totalPages) value = totalPages;
          currentPage = value;
          renderPage();
        };
      }

      function renderPage() {
        let totalPages = Math.ceil(currentList.length / pageSize);
        if (totalPages === 0) {
          renderRows([]);
          renderPagination(totalPages);
          return;
        }

        if (currentPage < 1) currentPage = 1;
        if (currentPage > totalPages) currentPage = totalPages;

        let start = (currentPage - 1) * pageSize;
        let pageItems = currentList.slice(start, start + pageSize);
        renderRows(pageItems);
        renderPagination(totalPages);
      }

      function setList(list) {
        currentList = Array.isArray(list) ? list : [];
        currentPage = 1;
        renderPage();
      }

      function applyFilters() {
        let status = document.getElementById("statusFilter").value;
        let vault = document.getElementById("vaultFilter").value;
        let myAudit = document.getElementById("myAuditFilter").value;
        let applicant = document.getElementById("applicantFilter").value.toLowerCase();
        let material = document.getElementById("materialFilter").value.toLowerCase();
        let examiner = document.getElementById("examinerFilter").value.toLowerCase();
        let search = document.getElementById("search").value.toLowerCase();

        let filtered = items.filter(item => {
          if (status !== "all" && item.status !== status) return false;
          if (vault !== "all" && item.vault !== vault) return false;
          if (applicant && !item.appName.toLowerCase().includes(applicant)) return false;
          if (material && !item.material_number.toLowerCase().includes(material)) return false;
          if (search) {
            let s = search.toLowerCase();
            let matchName = (item.name || "").toLowerCase().includes(s);
            let matchNote = (item.note || "").toLowerCase().includes(s);
            if (!matchName && !matchNote) return false;
          }
          if (myAudit === "my") {
            let status = Number(item.status);
            let isMyAudit = false;

            // 未审核：我有权限审核 → 显示
            if (status === 0) {

              isMyAudit = canAudit(item.parentId);
            }
            // 已审核：我是实际审核人 → 显示
            else {

              isMyAudit = (item.examine_id === currentUserId);
            }

            if (!isMyAudit) return false;
          }
          // ======================
          // ✅ 新增：审核人筛选
          // ======================
          if (examiner) {
            console.log(item)
            let examineName = (item.examineName || "").toLowerCase();
            if (!examineName.includes(examiner)) return false;
          }


          return true;
        });
        setList(filtered);
      }

      function resetFilters() {
        document.getElementById("statusFilter").value = "all";
        document.getElementById("vaultFilter").value = "all";
        document.getElementById("myAuditFilter").value = "all";
        document.getElementById("applicantFilter").value = "";
        document.getElementById("materialFilter").value = "";
        document.getElementById("examinerFilter").value = "";
        document.getElementById("search").value = "";
        setList(items);
      }

      document.getElementById("applyFilters").onclick = applyFilters;
      document.getElementById("resetFilters").onclick = resetFilters;
      applyFilters(); // 👈 替换成这个！


    });
  }
</script>
</body>
</html>
