<script>


  // 展开范围项的函数
  function expandRangesInString(input) {
    const rangePattern = /([A-Za-z]+)(\d+)-([A-Za-z]+)(\d+)/g;

    return input.replace(rangePattern, (match, prefix1, startStr, prefix2, endStr) => {
      // 检查前缀是否相同（不区分大小写）
      if (prefix1.toLowerCase() !== prefix2.toLowerCase()) {
        return match;
      }

      const prefix = prefix1;
      const start = parseInt(startStr, 10);
      const end = parseInt(endStr, 10);

      // 处理起始大于结束的情况
      if (start > end) {
        return match;
      }

      // 生成展开的序列
      const items = [];
      for (let i = start; i <= end; i++) {
        // 保持数字的位数与起始数字一致（如01, 02, ...）
        const numStr = i.toString().padStart(startStr.length, '0');
        items.push(prefix + numStr);
      }

      return items.join(' ');
    });
  }

  // 简化乘法项的函数
  function simplifyMultipliersInString(input) {
    const multiplierPattern = /([A-Za-z]+\d+)\s*\*\s*\d+/g;

    return input.replace(multiplierPattern, (match, item) => {
      return item;
    });
  }

  // 去除逗号并用空格分隔的函数
  function removeCommasAndNormalizeSpaces(input) {
    // 先替换逗号为空格
    let result = input.replace(/,/g, ' ');
    // 然后将多个连续空格替换为一个空格
    result = result.replace(/\s+/g, ' ').trim();
    return result;
  }

  // 分割为数据项的函数，返回数组
  function splitIntoDataItems(input) {
    // 使用空格分割字符串
    const items = input.split(/\s+/);

    // 过滤空字符串
    const filteredItems = items.filter(item => item.length > 0);

    return filteredItems; // 返回数组
  }

  // 主处理函数，返回数组
  function processAllItems(input, options = {}) {
    const { expandRanges = false, removeMultipliers = false } = options;

    let result = input;

    if (expandRanges) {
      result = expandRangesInString(result);
    }

    if (removeMultipliers) {
      result = simplifyMultipliersInString(result);
    }

    // 无论是否进行其他处理，都去除逗号并用空格分隔
    result = removeCommasAndNormalizeSpaces(result);

    // 最后将结果分割为数据项并返回数组
    result = splitIntoDataItems(result);

    return result; // 返回数组
  }

  // }



  // 全部处理
  function processAll(str) {


    const resultArray = processAllItems(str, { expandRanges: true, removeMultipliers: true });
    // 控制台输出数组，便于调试
    console.log('全部处理结果:', resultArray);
    return resultArray;


  }

  function getHref(){
    var url = decodeURI(location.search);
    var theRequest = {};
    if (url.indexOf("?") !== -1) {
      var str = url.substr(1);
      strs = str.split("&");
      for(var i = 0; i < strs.length; i ++) {
        theRequest[strs[i].split("=")[0]] = unescape(strs[i].split("=")[1]);
      }
    }
    return theRequest;
  }

  function move(){
    // 表头拖动功能
    const headerRow = document.querySelector('.header-row');
    const headerCols = Array.from(headerRow.children);
    const dataRows = Array.from(document.querySelectorAll('.data-row'));
    const rowContents = Array.from(document.querySelectorAll('.row-content'));

    let draggedHeader = null;
    let draggedRow = null;

    // 初始化表头拖动事件
    headerCols.forEach(col => {
      col.draggable = true;
      col.addEventListener('dragstart', handleHeaderDragStart);
      col.addEventListener('dragover', handleHeaderDragOver);
      col.addEventListener('dragenter', handleHeaderDragEnter);
      col.addEventListener('dragleave', handleHeaderDragLeave);
      col.addEventListener('drop', handleHeaderDrop);
      col.addEventListener('dragend', handleHeaderDragEnd);
    });

    // 初始化数据行拖动事件
    dataRows.forEach(row => {
      row.addEventListener('dragstart', handleRowDragStart);
      row.addEventListener('dragover', handleRowDragOver);
      row.addEventListener('dragenter', handleRowDragEnter);
      row.addEventListener('dragleave', handleRowDragLeave);
      row.addEventListener('drop', handleRowDrop);
      row.addEventListener('dragend', handleRowDragEnd);
    });


    // 表头拖动处理函数
    function handleHeaderDragStart(e) {
      draggedHeader = this;
      e.dataTransfer.effectAllowed = 'move';
      this.classList.add('dragging');
      setTimeout(() => this.style.opacity = '0.6', 0);
    }

    function handleHeaderDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      return false;
    }

    function handleHeaderDragEnter(e) {
      this.classList.add('over');
    }

    function handleHeaderDragLeave() {
      this.classList.remove('over');
    }

    function handleHeaderDrop(e) {
      e.preventDefault();
      e.stopPropagation();

      if (draggedHeader !== this) {
        const allHeaders = Array.from(headerRow.children);
        const draggedIdx = allHeaders.indexOf(draggedHeader);
        const targetIdx = allHeaders.indexOf(this);

        // 移动表头列
        if (draggedIdx < targetIdx) {
          headerRow.insertBefore(draggedHeader, this.nextSibling);
        } else {
          headerRow.insertBefore(draggedHeader, this);
        }

        // 同步移动所有数据行的对应列
        rowContents.forEach(content => {
          const contentChildren = Array.from(content.children);
          if (contentChildren.length > Math.max(draggedIdx, targetIdx)) {
            const draggedCol = contentChildren[draggedIdx];
            const targetCol = contentChildren[targetIdx];

            if (draggedIdx < targetIdx) {
              content.insertBefore(draggedCol, targetCol.nextSibling);
            } else {
              content.insertBefore(draggedCol, targetCol);
            }
          }
        });
      }

      this.classList.remove('over');
      return false;
    }

    function handleHeaderDragEnd() {
      this.classList.remove('dragging');
      this.style.opacity = '1';
      headerCols.forEach(col => col.classList.remove('over'));
      saveLocation();
    }

    // 数据行拖动处理函数
    function handleRowDragStart(e) {
      draggedRow = this;
      e.dataTransfer.effectAllowed = 'move';
      this.classList.add('dragging');
      setTimeout(() => this.style.opacity = '0.6', 0);
    }

    function handleRowDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      return false;
    }

    function handleRowDragEnter(e) {
      if (this !== draggedRow) {
        this.classList.add('over');
      }
    }

    function handleRowDragLeave() {
      this.classList.remove('over');
    }

    function handleRowDrop(e) {
      e.preventDefault();
      e.stopPropagation();

      if (this !== draggedRow) {
        const bomContent = document.getElementById('bomContent');
        const allRows = Array.from(bomContent.children);
        const draggedIndex = allRows.indexOf(draggedRow);
        const targetIndex = allRows.indexOf(this);

        if (draggedIndex < targetIndex) {
          bomContent.insertBefore(draggedRow, this.nextSibling);
        } else {
          bomContent.insertBefore(draggedRow, this);
        }
      }

      this.classList.remove('over');
      return false;
    }

    function handleRowDragEnd() {
      this.classList.remove('dragging');
      this.style.opacity = '1';
      dataRows.forEach(row => row.classList.remove('over'));

    }

    // ===== 新增：列拖动功能 =====
    // 初始化列拖动事件
    const rowCols = Array.from(document.querySelectorAll('.row-col'));
    rowCols.forEach(col => {
      col.draggable = true;
      col.addEventListener('dragstart', handleColDragStart);
      col.addEventListener('dragover', handleColDragOver);
      col.addEventListener('dragenter', handleColDragEnter);
      col.addEventListener('dragleave', handleColDragLeave);
      col.addEventListener('drop', handleColDrop);
      col.addEventListener('dragend', handleColDragEnd);
    });

    let draggedCol = null;
    let placeholder = null;

    // 列拖动处理函数
    function handleColDragStart(e) {
      draggedCol = this;
      e.dataTransfer.effectAllowed = 'move';
      this.classList.add('dragging');
      setTimeout(() => this.style.opacity = '0.6', 0);
    }

    function handleColDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';

      // 创建占位符
      if (!placeholder) {
        placeholder = document.createElement('div');
        placeholder.className = 'placeholder-col';
        placeholder.style.width = `${draggedCol.offsetWidth}px`;
        placeholder.style.height = `${draggedCol.offsetHeight}px`;

        // 插入占位符
        if (this !== draggedCol) {
          const rect = this.getBoundingClientRect();
          const isAfter = e.clientX > rect.left + rect.width / 2;

          if (isAfter) {
            this.parentNode.insertBefore(placeholder, this.nextSibling);
          } else {
            this.parentNode.insertBefore(placeholder, this);
          }
        }
      }

      return false;
    }

    function handleColDragEnter(e) {
      if (this !== draggedCol) {
        this.classList.add('over');
      }
    }

    function handleColDragLeave() {
      this.classList.remove('over');

      // 移除占位符
      if (placeholder && placeholder.parentNode) {
        placeholder.parentNode.removeChild(placeholder);
        placeholder = null;
      }
    }

    function handleColDrop(e) {
      e.preventDefault();
      e.stopPropagation();

      if (this !== draggedCol && placeholder) {
        // 移除占位符
        placeholder.parentNode.removeChild(placeholder);
        placeholder = null;

        // 移动列
        this.parentNode.insertBefore(draggedCol, this);

        // 更新表头列顺序
        updateHeaderOrder();


      }


      this.classList.remove('over');
      return false;
    }

    function handleColDragEnd() {
      this.classList.remove('dragging');
      this.style.opacity = '1';
      rowCols.forEach(col => col.classList.remove('over'));

      // 移除占位符
      if (placeholder && placeholder.parentNode) {
        placeholder.parentNode.removeChild(placeholder);
        placeholder = null;
      }


    }

    // 更新表头列顺序
    function updateHeaderOrder() {
      const firstRow = document.querySelector('.row-content');
      if (!firstRow) return;

      const rowCols = Array.from(firstRow.children);
      const headerCols = Array.from(headerRow.children);

      // 移除表头列
      headerCols.forEach(col => headerRow.removeChild(col));

      // 重新添加表头列（按数据列顺序）
      rowCols.forEach((col, index) => {
        if (index < headerCols.length) {
          headerRow.appendChild(headerCols[index]);
        }
      });

    }


  }

    // 渲染页面
    function renderPage(num,str) {
      pageRendering = true;

      pdfDoc.getPage(num).then(page => {
        const viewport = page.getViewport({ scale: scale });
        pdfCanvas.height = viewport.height;
        pdfCanvas.width = viewport.width;

        const renderContext = {
          canvasContext: pdfCanvas.getContext('2d'),
          viewport: viewport
        };

        const renderTask = page.render(renderContext);

        renderTask.promise.then(() => {
          pageRendering = false;

          if (pageNumPending !== null) {
            renderPage(pageNumPending);
            pageNumPending = null;
          }

          // ========== 新增：坐标系和高亮点功能 ==========
          // 坐标系状态
          // 修改坐标系状态对象
          const coordinateState = {
            scale: 1.0695,

            rotation: 0,
            offsetX: 0,
            offsetY: 0,
            isFlippedX: false,
            isFlippedY: false,
            // 原点相关状态
            originSet: true, // 是否设置了原点
            originCanvasX: 171, // 原点在画布上的X坐标
            originCanvasY: 959.594, // 原点在画布上的Y坐标
            originPdfX:171,   // 原点在PDF上的X坐标（毫米）
            originPdfY: 959.594,    // 原点在PDF上的Y坐标（毫米）
            // 新增：记录原始原点位置，用于计算相对移动
            originalOriginX: 0,
            originalOriginY: 0
          };

          const originalViewport = page.getViewport({ scale: 1.5 });

          // 计算缩放因子
          const scaleX =  viewport.width / originalViewport.width;
          const scaleY =  viewport.height / originalViewport.height;

          //坐标转换方法
          function toScaledCoordinates() {




            coordinateState.originCanvasX=  coordinateState.originCanvasX * scaleX; // PDF X坐标 × X轴缩放因子
            coordinateState.originCanvasY = (coordinateState.originCanvasY) * scaleY;


          }

          if (str==="suoFang"){
            toScaledCoordinates();
          }






          // 初始化坐标系
          function initCoordinateSystem() {
            const overlay = document.getElementById('coordinate-overlay');
            overlay.innerHTML = '';

            // 创建坐标系元素
            const coordinateSystem = document.createElement('div');
            coordinateSystem.className = 'coordinate-system';
            coordinateSystem.innerHTML = '坐标系 (0,0)';
            overlay.appendChild(coordinateSystem);

            // 创建原点标记
            const originMarker = document.createElement('div');
            originMarker.className = 'origin-marker';
            originMarker.style.left = '50%';
            originMarker.style.top = '50%';
            overlay.appendChild(originMarker);

            // 创建控制面板
            const controls = document.createElement('div');
            controls.className = 'coordinate-controls';
            controls.innerHTML = `
                <div class="control-group">
                    <label>缩放:</label>
                    <input type="range" id="scale-slider" min="1.0695" max="2" step="0.0713" value="1.0695">
                    <div class="value-display" id="zoom-value">1.0695x</div>
                </div>
                <div class="control-group">
                    <label>旋转:</label>
                    <input type="range" id="rotation-slider" min="0" max="360" value="0">
                </div>
                <div class="control-group">
                    <button class="control-btn" id="flip-x">水平翻转</button>
                    <button class="control-btn" id="flip-y">垂直翻转</button>
                </div>
        <div class="movement-controls">
        <div class="movement-row">
        <button class="movement-btn" id="move-up">↑</button>
        </div>
        <div class="movement-row">
        <button class="movement-btn" id="move-left">←</button>
        <button class="movement-btn" id="move-center">⊙</button>
        <button class="movement-btn" id="move-right">→</button>
        </div>
        <div class="movement-row">
        <button class="movement-btn" id="move-down">↓</button>
        </div>
        </div>

        <div class="control-group">
        <button class="control-btn" id="reset-coords">重置坐标系</button>
        </div>
        `;
            overlay.appendChild(controls);

            // 添加事件监听
            document.getElementById('scale-slider').addEventListener('input', handleScaleChange);
            document.getElementById('rotation-slider').addEventListener('input', handleRotationChange);
            document.getElementById('flip-x').addEventListener('click', handleFlipX);
            document.getElementById('flip-y').addEventListener('click', handleFlipY);
            document.getElementById('reset-coords').addEventListener('click', resetCoordinateSystem);

            // 添加平移按钮事件监听
            document.getElementById('move-up').addEventListener('click', () => moveCoordinateSystem(0, -1));
            document.getElementById('move-down').addEventListener('click', () => moveCoordinateSystem(0, 1));
            document.getElementById('move-left').addEventListener('click', () => moveCoordinateSystem(-1, 0));
            document.getElementById('move-right').addEventListener('click', () => moveCoordinateSystem(1, 0));
            document.getElementById('move-center').addEventListener('click', resetOffset);

            // 初始渲染高亮点
            renderHighlightPoints();
          }




          // 新增：移动坐标系
          function moveCoordinateSystem(deltaX, deltaY) {
            coordinateState.offsetX += deltaX;
            coordinateState.offsetY += deltaY;

            // 如果已经设置了原点，更新原点的位置
            if (coordinateState.originSet) {
              coordinateState.originCanvasX += deltaX;
              coordinateState.originCanvasY += deltaY;

              // 更新原点在PDF坐标系中的坐标
              updateOriginPdfCoordinates();
            }

            renderHighlightPoints();
          }

          // 新增：更新原点PDF坐标函数
          function updateOriginPdfCoordinates() {
            const pdfCanvas = document.getElementById('pdf-canvas');
            if (!pdfCanvas) return;

            const canvasWidth = pdfCanvas.width;
            const canvasHeight = pdfCanvas.height;
            const centerX = canvasWidth / 2;
            const centerY = canvasHeight / 2;

            // 计算相对于画布中心的偏移量
            const offsetFromCenterX = coordinateState.originCanvasX - centerX;
            const offsetFromCenterY = coordinateState.originCanvasY - centerY;

            // 转换为PDF坐标（毫米）
            coordinateState.originPdfX = (offsetFromCenterX - coordinateState.offsetX) / (3.78 * coordinateState.scale);
            coordinateState.originPdfY = -(offsetFromCenterY - coordinateState.offsetY) / (3.78 * coordinateState.scale);

            // 应用翻转
            if (coordinateState.isFlippedX) {
              coordinateState.originPdfX = -coordinateState.originPdfX;
            }
            if (coordinateState.isFlippedY) {
              coordinateState.originPdfY = -coordinateState.originPdfY;
            }

            // 应用旋转
            const rad = -coordinateState.rotation * Math.PI / 180;
            const rotatedX = coordinateState.originPdfX * Math.cos(rad) - coordinateState.originPdfY * Math.sin(rad);
            const rotatedY = coordinateState.originPdfX * Math.sin(rad) + coordinateState.originPdfY * Math.cos(rad);

            coordinateState.originPdfX = rotatedX;
            coordinateState.originPdfY = rotatedY;
          }

          // 新增：重置平移偏移量
          function resetOffset() {
            coordinateState.offsetX = 0;
            coordinateState.offsetY = 0;
            renderHighlightPoints();
          }


          // 修复缩放处理函数
          function handleScaleChange(e) {
            const oldScale = coordinateState.scale;
            const newScale = parseFloat(e.target.value);

            // 如果设置了原点，调整偏移量以保持原点位置
            if (coordinateState.originSet) {
              // 计算原点在新旧缩放下的位置差异
              const scaleRatio = newScale / oldScale;

              // 调整偏移量，使原点保持在画布上的同一位置
              coordinateState.offsetX = coordinateState.offsetX * scaleRatio;
              coordinateState.offsetY = coordinateState.offsetY * scaleRatio;
            }

            coordinateState.scale = newScale;
            document.getElementById('zoom-value').textContent = newScale.toFixed(2) + 'x';
            renderHighlightPoints();
          }

          // 处理旋转变化
          function handleRotationChange(e) {
            coordinateState.rotation = parseInt(e.target.value);
            renderHighlightPoints();
          }

          // 处理水平翻转
          function handleFlipX() {
            coordinateState.isFlippedX = !coordinateState.isFlippedX;
            renderHighlightPoints();
          }

          // 处理垂直翻转
          function handleFlipY() {
            coordinateState.isFlippedY = !coordinateState.isFlippedY;
            renderHighlightPoints();
          }




          // 修复高亮点渲染函数
          // 高亮点渲染函数（修改后）
          function renderHighlightPoints() {
            const overlay = document.getElementById('coordinate-overlay');
            const pdfCanvas = document.getElementById('pdf-canvas');

            if (!pdfCanvas) return;

            const canvasWidth = pdfCanvas.width;
            const canvasHeight = pdfCanvas.height;

            // 计算画布中心
            const centerX = canvasWidth / 2;
            const centerY = canvasHeight / 2;

            // 计算原点位置（应用偏移量）
            let originX, originY;

            if (coordinateState.originSet) {
              // 如果设置了原点，使用设置的原点位置 + 偏移量
              originX = coordinateState.originCanvasX + coordinateState.offsetX;
              originY = coordinateState.originCanvasY + coordinateState.offsetY;
            } else {
              // 如果没有设置原点，使用画布中心 + 偏移量
              originX = centerX + coordinateState.offsetX;
              originY = centerY + coordinateState.offsetY;
            }

            // 清除旧的高亮点和标签
            const oldPoints = overlay.querySelectorAll('.highlight-point, .highlight-label, .origin-marker, .coordinate-system');
            oldPoints.forEach(point => point.remove());

            // 创建原点标记
            const originMarker = document.createElement('div');
            originMarker.className = 'origin-marker';
            originMarker.style.left = `${originX}px`;
            originMarker.style.top = `${originY}px`;
            overlay.appendChild(originMarker);

            // 创建坐标系显示
            const coordinateSystem = document.createElement('div');
            coordinateSystem.className = 'coordinate-system';
            coordinateSystem.style.left = `${originX + 10}px`;
            coordinateSystem.style.top = `${originY - 30}px`;
            coordinateSystem.innerHTML = `原点 (${coordinateState.originPdfX.toFixed(1)}mm, ${coordinateState.originPdfY.toFixed(1)}mm)`;
            overlay.appendChild(coordinateSystem);

            // 渲染每个高亮点
            highlightPoints.forEach(point => {
              // 转换毫米坐标为像素坐标
              let x = parseFloat(point['x']) * 3.78;
              let y = -parseFloat(point['y']) * 3.78;

              // 应用旋转
              const rad = coordinateState.rotation * Math.PI / 180;
              const rotatedX = x * Math.cos(rad) - y * Math.sin(rad);
              const rotatedY = x * Math.sin(rad) + y * Math.cos(rad);

              // 应用翻转
              const finalX = coordinateState.isFlippedX ? -rotatedX : rotatedX;
              const finalY = coordinateState.isFlippedY ? -rotatedY : rotatedY;

              // 应用缩放
              let scaledX = finalX * coordinateState.scale;
              let scaledY = finalY * coordinateState.scale;

              if (str==="suoFang"){
                scaledX = scaleX * scaledX;
                scaledY = scaleY * scaledY;
              }

              // 计算最终位置（相对于原点 + 偏移量）
              const pointX = originX + scaledX;
              const pointY = originY + scaledY;

              // 创建高亮点
              const highlight = document.createElement('div');
              highlight.className = 'highlight-point';
              highlight.style.left = `${pointX}px`;
              highlight.style.top = `${pointY}px`;
              highlight.setAttribute('data-designator', point.Designator);
              overlay.appendChild(highlight);

              // 创建标签
              const label = document.createElement('div');
              label.className = 'highlight-label';
              label.textContent = point.Designator;
              label.style.left = `${pointX + 15}px`;
              label.style.top = `${pointY - 15}px`;
              overlay.appendChild(label);
            });
          }

          // 修复重置坐标系函数
          function resetCoordinateSystem() {
            coordinateState.scale = 1;
            coordinateState.rotation = 0;
            coordinateState.offsetX = 0;
            coordinateState.offsetY = 0;
            coordinateState.isFlippedX = false;
            coordinateState.isFlippedY = false;
            coordinateState.originSet = false;
            coordinateState.originCanvasX = 0;
            coordinateState.originCanvasY = 0;
            coordinateState.originPdfX = 0;
            coordinateState.originPdfY = 0;

            document.getElementById('scale-slider').value = 1.0695;
            document.getElementById('rotation-slider').value = 0;
            document.getElementById('zoom-value').textContent = '1.0695x';

            renderHighlightPoints();
          }

          // 在PDF渲染完成后初始化坐标系
          function onPdfRenderComplete() {
            initCoordinateSystem();


          }


          //加载完成后执行
            onPdfRenderComplete();

        });
      });
    }

    // 排队渲染页面
    function queueRenderPage(num,str) {
      if (pageRendering) {
        pageNumPending = num;
      } else {
        renderPage(num,str);
      }
    }

    // 显示上一页
    function showPrevPage() {
      if (pageNum <= 1) return;
      pageNum--;
      queueRenderPage(pageNum);
    }

    // 显示下一页
    function showNextPage() {
      if (pageNum >= pdfDoc.numPages) return;
      pageNum++;
      queueRenderPage(pageNum);
    }

    function zoomIn() {

    // 获取物料对应的坐标数据
    async function getCoordinatesForMaterial(material) {

      //获取excel中的数据
      // 替换为您的Excel文件路径
      const excelPath = 'upload/Pick Place for Qa3TEvHeadPwr15C_T.csv';

      // 转换为JSON,获取excel表的所有数据
      const jsonData = await parseExcelToJson(excelPath);

      // 查询数据函数
      function queryExcelData(queryArray, excelData) {
        const results = [];
        const notFoundItems = [];

        queryArray.forEach(queryItem => {
          // 查找匹配项（不区分大小写）
          const foundItems = excelData.filter(item => {
            const designator = String(item.Designator).toUpperCase();
            return designator === String(queryItem).toUpperCase();

          });

          if (foundItems.length > 0) {
            foundItems.forEach(item => {
              results.push({
                query: queryItem,
                ...item,
                status: 'found'
              });
            });
          } else {
            notFoundItems.push(queryItem);
            results.push({
              query: queryItem,
              Designator: queryItem,
              ' X': 'not found',
              ' Y': 'not found',
              Layer: 'not found',
              status: 'not found'
            });
          }
        });

        return {
          results: results,
          stats: {
            totalQueries: queryArray.length,
            foundCount: results.filter(item => item.status === 'found').length,
            notFoundCount: notFoundItems.length,
            notFoundItems: notFoundItems,
            matchRate: ((results.filter(item => item.status === 'found').length / queryArray.length) * 100).toFixed(2) + '%'
          }
        };
      }


      // 测试数据()获取处理后的数据
      const queryData = processAll(material);



      //查询数据
      // 执行查询
      const queryResult = queryExcelData(queryData, jsonData.Sheet1);

// 输出结果
      console.log("查询结果:", queryResult.results);
      // 零件数据


      let currentSelectedIndex = -1;

      // 初始化函数
      function initializeComponentList() {
        const componentList = document.getElementById('coordinate-list');
        componentList.innerHTML = '';

       queryResult.results.forEach((component, index) => {
          const item = document.createElement('div');
          item.className = 'component-item';
          item.setAttribute('data-index', index);

          item.innerHTML = `
                    <div class="component-info">
                        <div class="designator">${component.Designator}<span class="layer">${component.Layer}</span></div>
                        <div class="coordinates">
                            <div>X: ${component.x} </div>
                            <div>Y: ${component.y} </div>

                        </div>
                    </div>
                    <div class="status-indicator ${component.status === 'found' ? 'status-found' : 'status-not-found'}"></div>
                `;

          item.addEventListener('click', () => selectComponent(index,component));
          componentList.appendChild(item);
        });


      }

      // 选择零件函数
      function selectComponent(index,component) {
        // 移除之前的高亮
        if (currentSelectedIndex !== -1) {
          const previousItem = document.querySelector(`[data-index="${currentSelectedIndex}"]`);
          if (previousItem) {
            previousItem.classList.remove('active');
          }
        }

        // 添加新的高亮
        const currentItem = document.querySelector(`[data-index="${index}"]`);
        if (currentItem) {
          currentItem.classList.add('active');
          currentSelectedIndex = index;
        }
        console.log(component)
        highlightPoints = [component];
        queueRenderPage(pageNum,"suoFang");
      }

      initializeComponentList();



    }







    // 滚动到坐标位置
    function scrollToCoordinate(coord) {
      const container = document.querySelector('.pdf-canvas-container');
      const highlight = document.querySelector(`.highlight[style*="left: ${coord.x}px; top: ${coord.y}px"]`);

      if (highlight) {
        const rect = highlight.getBoundingClientRect();
        const containerRect = container.getBoundingClientRect();

        container.scrollTop = rect.top - containerRect.top - (containerRect.height / 2) + (rect.height / 2);
      }
    }

    // 清除高亮
    function clearHighlights() {

    }


    // ========== 新增：设置原点功能 ==========
    function setupSetOriginFeature() {
      const setOriginBtn = document.createElement('button');
      setOriginBtn.id = 'set-origin';
      setOriginBtn.className = 'set-origin-btn';
      setOriginBtn.textContent = '设置原点';

      const saveOriginBtn = document.createElement('button');
            saveOriginBtn.id = 'save-origin';
            saveOriginBtn.className = 'save-origin-btn';
            saveOriginBtn.textContent="保存配置"

      // 将按钮添加到工具栏
      const pdfToolbar = document.querySelector('.pdf-toolbar');
      if (pdfToolbar) {
        pdfToolbar.appendChild(setOriginBtn);
        pdfToolbar.appendChild(saveOriginBtn)
      }

      setOriginBtn.addEventListener('click', function() {
        // 切换设置原点模式
        const isActive = this.classList.toggle('active');
        const pdfCanvas = document.getElementById('pdf-canvas');

        if (isActive) {
          // 进入设置原点模式
          pdfCanvas.classList.add('set-origin-cursor');

          // 添加点击事件监听
          pdfCanvas.addEventListener('click', handleSetOriginClick);
        } else {
          // 退出设置原点模式
          pdfCanvas.classList.remove('set-origin-cursor');

          // 移除点击事件监听
          pdfCanvas.removeEventListener('click', handleSetOriginClick);
        }
      });
    }

    // 修复设置原点点击处理函数
    function handleSetOriginClick(e) {
      const pdfCanvas = document.getElementById('pdf-canvas');
      const rect = pdfCanvas.getBoundingClientRect();

      // 获取点击位置相对于画布的位置
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;

      // 获取画布尺寸
      const canvasWidth = pdfCanvas.width;
      const canvasHeight = pdfCanvas.height;

      // 计算相对于画布中心的坐标
      const centerX = canvasWidth / 2;
      const centerY = canvasHeight / 2;

      // 计算相对于中心的偏移量
      const offsetFromCenterX = clickX - centerX;
      const offsetFromCenterY = clickY - centerY;

      // 设置原点状态
      coordinateState.originSet = true;
      coordinateState.originCanvasX = clickX;
      coordinateState.originCanvasY = clickY;

      // 计算原点在PDF坐标系中的坐标（毫米）
      // 需要考虑当前的缩放、偏移和旋转状态
      coordinateState.originPdfX = (offsetFromCenterX - coordinateState.offsetX) / (3.78 * coordinateState.scale);
      coordinateState.originPdfY = -(offsetFromCenterY - coordinateState.offsetY) / (3.78 * coordinateState.scale);

      // 应用翻转
      if (coordinateState.isFlippedX) {
        coordinateState.originPdfX = -coordinateState.originPdfX;
      }
      if (coordinateState.isFlippedY) {
        coordinateState.originPdfY = -coordinateState.originPdfY;
      }

      // 应用旋转
      const rad = -coordinateState.rotation * Math.PI / 180; // 反向旋转
      const rotatedX = coordinateState.originPdfX * Math.cos(rad) - coordinateState.originPdfY * Math.sin(rad);
      const rotatedY = coordinateState.originPdfX * Math.sin(rad) + coordinateState.originPdfY * Math.cos(rad);

      coordinateState.originPdfX = rotatedX;
      coordinateState.originPdfY = rotatedY;

      console.log('设置原点:', {
        canvas: {x: clickX, y: clickY},
        pdf: {x: coordinateState.originPdfX, y: coordinateState.originPdfY}
      });

      // 退出设置原点模式
      const setOriginBtn = document.getElementById('set-origin');
      setOriginBtn.classList.remove('active');
      pdfCanvas.classList.remove('set-origin-cursor');
      pdfCanvas.removeEventListener('click', handleSetOriginClick);

      // 重新渲染
      renderHighlightPoints();
    }


    setupSetOriginFeature();
