<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>退货信息管理</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Microsoft YaHei", sans-serif;
      background-color: #f5f7fa;
      padding: 40px 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .card {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
      padding: 30px;
    }

    .title {
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      color: #333;
      margin-bottom: 20px;
    }

    .line {
      height: 1px;
      background-color: #eee;
      margin: 10px 0 25px 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead tr {
      background-color: #4a90e2;
      color: #fff;
    }

    th, td {
      padding: 12px 8px;
      text-align: center;
      border: 1px solid #eee;
    }

    tbody tr:hover {
      background-color: #f9f9f9;
    }

    .btn {
      padding: 6px 14px;
      border: none;
      border-radius: 4px;
      background-color: #4a90e2;
      color: #fff;
      cursor: pointer;
      font-size: 12px;
      margin: 2px;
    }

    .btn:hover {
      background-color: #3579c6;
    }

    .btn:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }

    .btn-info {
      background-color: #17a2b8;
    }

    .status-yes {
      color: #28a745;
      font-weight: bold;
    }

    .status-no {
      color: #dc3545;
      font-weight: bold;
    }

    .status-default {
      color: #999;
    }

    /* 分页 */
    .pagination {
      margin-top: 25px;
      text-align: center;
    }

    .pagination button {
      padding: 6px 12px;
      margin: 0 4px;
      border: 1px solid #ddd;
      background: #fff;
      cursor: pointer;
      border-radius: 4px;
    }

    .pagination button.active {
      background: #4a90e2;
      color: #fff;
      border-color: #4a90e2;
    }

    .pagination button:disabled {
      background: #f5f5f5;
      cursor: not-allowed;
      color: #999;
    }

    /* 弹窗 */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 999;
    }

    .modal-content {
      width: 400px;
      background: #fff;
      border-radius: 10px;
      padding: 30px;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }

    .modal-title {
      font-size: 18px;
      margin-bottom: 25px;
      color: #333;
    }

    .modal-btns {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .btn-yes {
      background: #28a745;
      padding: 8px 20px;
      border: none;
      border-radius: 5px;
      color: #fff;
      cursor: pointer;
    }

    .btn-no {
      background: #dc3545;
      padding: 8px 20px;
      border: none;
      border-radius: 5px;
      color: #fff;
      cursor: pointer;
    }

    .btn-close {
      background: #6c757d;
      padding: 8px 20px;
      border: none;
      border-radius: 5px;
      color: #fff;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    <div class="title">退货信息管理</div>
    <div class="line"></div>

    <table>
      <thead>
      <tr>
        <th>物料名称</th>
        <th>物料编号</th>
        <th>退货数量</th>
        <th>处理备注</th>
        <th>是否继续采购</th>
        <th>处理时间</th>
        <th>操作</th>
      </tr>
      </thead>
      <tbody id="dataList"></tbody>
    </table>

    <div class="pagination" id="pagination"></div>
  </div>
</div>

<!-- 设置弹窗 -->
<div class="modal" id="modal">
  <div class="modal-content">
    <div class="modal-title">请选择是否继续采购</div>
    <div class="modal-btns">
      <button class="btn-yes" id="btnYes">继续采购</button>
      <button class="btn-no" id="btnNo">不继续采购</button>
      <button class="btn-close" id="btnClose">关闭</button>
    </div>
  </div>
</div>

<!-- 查看申请人弹窗 -->
<div class="modal" id="userModal">
  <div class="modal-content">
    <div class="modal-title">申请人信息</div>
    <div id="userInfo" style="margin-bottom:25px; font-size:16px;"></div>
    <button class="btn-close" onclick="closeUserModal()">关闭</button>
  </div>
</div>

<script>
  // 获取元素
  const modal = document.getElementById("modal");
  const userModal = document.getElementById("userModal");
  const btnYes = document.getElementById("btnYes");
  const btnNo = document.getElementById("btnNo");
  const btnClose = document.getElementById("btnClose");
  const userInfo = document.getElementById("userInfo");

  let currentId = null;
  let pageNum = 1;
  let pageSize = 20;
  let totalPage = 1;
  let totalCount = 0;

  function height(){

    let iframe = window.parent.document.getElementById("iframepage");
    if (iframe){
      let num= window.parent.innerHeight;
      if (Number(num)>Number(60)){
        let s = Number(num)-Number(60)
        iframe.style.height=s+"px";
      }

    }


  }
  height();
  window.onload = function () {
    loadData(pageNum);
  };

  // 加载列表
  function loadData(page) {
    pageNum = page;
    fetch("returnReceive/selectTh?pageNum=" + pageNum, {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" }
    })
            .then(res => res.json())
            .then(result => {
              totalCount = result.totalCount || 0;
              totalPage = Math.ceil(totalCount / pageSize);
              renderList(result.rows);
              renderPagination();
            })
            .catch(err => console.error("请求失败：", err));
  }

  // 渲染表格
  function renderList(list) {
    const dataList = document.getElementById("dataList");
    dataList.innerHTML = "";

    const filterData = list.filter(item => item.handle_type === 1);

    filterData.forEach(item => {
      // 状态显示
      let statusText = "";
      if (item.continue_purchase === 1) {
        statusText = '<span class="status-yes">是</span>';
      } else if (item.continue_purchase === 0) {
        statusText = '<span class="status-no">否</span>';
      } else {
        statusText = '<span class="status-default">未设置</span>';
      }

      // 已设置 → 按钮禁用；未设置 → 可点击
      let isDisabled = item.continue_purchase !== 3 ? "disabled" : "";

      let tr = document.createElement("tr");
      tr.innerHTML = `
                <td>${item.name}</td>
                <td>${item.material_number}</td>
                <td>${item.return_qty}</td>
                <td>${item.handle_remark}</td>
                <td>${statusText}</td>
                <td>${item.handle_time}</td>
                <td>
                    <button class="btn" ${isDisabled} onclick="openModal(${item.id})">设置</button>
                    <button class="btn btn-info" onclick="viewUser(${item.application_content_id}, ${item.product_id}, ${item.vault})">查看申请人</button>
                </td>
            `;
      dataList.appendChild(tr);
    });
    height();
  }

  // 分页
  function renderPagination() {
    const pagination = document.getElementById("pagination");
    pagination.innerHTML = "";

    const prevBtn = document.createElement("button");
    prevBtn.innerText = "上一页";
    prevBtn.disabled = pageNum <= 1;
    prevBtn.onclick = () => loadData(pageNum - 1);
    pagination.appendChild(prevBtn);

    for (let i = 1; i <= totalPage; i++) {
      const btn = document.createElement("button");
      btn.innerText = i;
      if (i === pageNum) btn.className = "active";
      btn.onclick = () => loadData(i);
      pagination.appendChild(btn);
    }

    const nextBtn = document.createElement("button");
    nextBtn.innerText = "下一页";
    nextBtn.disabled = pageNum >= totalPage;
    nextBtn.onclick = () => loadData(pageNum + 1);
    pagination.appendChild(nextBtn);
  }

  // ================== 设置弹窗 ==================
  function openModal(id) {
    currentId = id;
    modal.style.display = "block";
  }

  function closeModal() {
    modal.style.display = "none";
    currentId = null;
  }

  btnYes.onclick = () => saveStatus(1);
  btnNo.onclick = () => saveStatus(0);
  btnClose.onclick = closeModal;

  // ================== 保存（100%匹配你的后端） ==================
  function saveStatus(continuePurchase) {
    fetch("returnReceive/updateContinue", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: "id=" + currentId + "&continuePurchase=" + continuePurchase
    })
            .then(res => res.text()) // 后端返回字符串，用text()接收
            .then(msg => {
              if (msg === "success") {
                alert("设置成功！");
                closeModal();
                loadData(pageNum);
              } else {
                alert("设置失败");
              }
            })
            .catch(() => alert("网络异常"));
  }

  // ================== 查看申请人（传入3个参数） ==================
  function viewUser(applicationContentId, productId, vault) {
    fetch("returnReceive/selectAppUser", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: "contentId=" + applicationContentId +
              "&productId=" + productId +
              "&vault=" + vault
    })
            .then(res => res.json())
            .then(data => {
              if (!data || data.length === 0) {
                userInfo.innerHTML = "暂无申请人信息";
              } else {
                let html = "";
                data.forEach((item, index) => {
                  html += "申请人 " + (index + 1) + "：" + item.name + "<br>";
                });
                userInfo.innerHTML = html;
              }
              userModal.style.display = "block";
            })
            .catch(() => {
              userInfo.innerHTML = "获取申请人信息失败";
              userModal.style.display = "block";
            });
  }

  function closeUserModal() {
    userModal.style.display = "none";
  }
</script>
</body>
</html>
