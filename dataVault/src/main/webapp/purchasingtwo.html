    return new Promise(function (resolve, reject) {
      const reader = new FileReader()
      let imgResult = ''
      reader.readAsDataURL(file)
      reader.onload = function () {
        imgResult = reader.result
      }
      reader.onerror = function (error) {
        reject(error)
      }
      reader.onloadend = function () {
        resolve(imgResult)
      }
    })
  }

  function selectIfEnough(data,sort){
    if (Number(sort)===Number(1)){
      //出库
      let contentData =[];
      for (let i = 0; i < data.length; i++) {
        contentData.push(data[i]);
      }

      for (let i = 0; i < contentData.length; i++) {
        bo=true;

        if (sjNumber.length===0){
          sjNumber=0;
        }
        for (let j = 0; j < contentData.length; j++) {
          let productId1 = contentData[j].product_id;
          let vault1 = contentData[j].vault;
          let appNumber1 = contentData[j].app_number;

          if (i!==j && Number(productId)===Number(productId1) && Number(vault)===Number(vault1)){

            //判断是同一个物料信息
            // let sjNumber1 = Number(appNumber1)-Number(actualNumber1);
            console.log(sjNumber,value1)
            sjNumber=Number(sjNumber)+Number(value1);
            // contentData.splice(j,1)

          }
        }

        if (Number(number)<Number(sjNumber)){
          bo = false;

        }
        if (!bo){
          break;
        }

      }
      return bo;
    }
    else {
      //入库
      return  true;
    }

  }

    // 确认入库按钮
    document.getElementById('confirmStorage').addEventListener('click', function() {

        //2.已经登录，去查询申请的数量是否为空
        let number = document.querySelectorAll(".cfWaitNumber");

        if (number.length > 0) {
          let numberBoolean = true;
          for (let i = 0; i < number.length; i++) {

            if (number[i].value.length === 0) {
              numberBoolean = false;
              break;
            }
          }

          if (numberBoolean === true) {
            //3.获取申请单数据
            //生成申请单号
            let all = [];
            let appFormData = [{
              id: "",
              orderNumber: "",
              date: "",
              sort: 0,
              userId: userId,
              completeStatus: "3",
              sortTwo: 9,//采购入库
              reason:"",
              circulation:"",
              notes:document.getElementById("checkNotes").value,
              robot:""
            }]


            let rk = true;

            if (rk===false){
              alert("您暂未获得申请入库的权限！")
            }
            else {
              //查看类型

              let type=true;



              //获取申请物料信息
              let applicationContent=[];



              let rkP = document.querySelectorAll(".cfRkPrice");
              let wait = document.querySelectorAll(".cfWaitNumber");
              for (let i = 0; i < hbData.length; i++) {
                document.getElementById(""+hbData[i].product_id+hbData[i].vault+"").nextElementSibling

                let formdata={
                  id:hbData[i].id,
                  applicationId:hbData[i].application_id,
                  productId:hbData[i].product_id,
                  appNumber:wait[i].value,
                  actualNumber:Number(document.getElementById(""+hbData[i].product_id+hbData[i].vault+"").value) + Number(hbData[i].actual_number),//实际出/入库数量
                  // actualNumber:document.getElementById(""+hbData[i].product_id+hbData[i].vault+"").value,
                  vault:hbData[i].vault,
                  appPrice:rkP[i].value,
                  finProductId:hbData[i].fin_product_id,
                  finProductNumber:document.getElementById(""+hbData[i].product_id+hbData[i].vault+"").nextElementSibling.value,
                  lastLevel:hbData[i].last_level,
                  bomTitleId:hbData[i].bom_title_id
                }


                //&& document.getElementById("invoice").checked === true

                //采购入库
                let rkPrice = document.querySelectorAll(".cfRkPrice");
                let value3 = rkPrice[i].value;
                if (value3.trim().length>0){
                  formdata.appPrice=value3;
                }
                else {
                  type=false;
                  alert("请将入库价格填写完整！");
                }
                if (type===false){
                  break;
                }



                applicationContent[i]=formdata;
                formdata={
                  id:"",
                  applicationId:"",
                  productId:"",
                  appNumber:"",
                  actual:"",
                  vault:"",
                  appPrice:"",
                  finProductId:"",
                  finProductNumber:"",
                  lastLevel:"",
                  bomTitleId:""
                }
                if (type===false){
                  break;
                }
              }
              all[0]=appFormData;
              all[1]=applicationContent;

              // }

              // //查看发票


              //查看是否有发票
              let invoice  = document.getElementById("invoice");
              let ylPc = document.querySelectorAll(".ylPic");

              if (invoice.checked===true){
                //已选择发票按钮，查询是否有发票

                if (ylPc.length===0){
                  type=false;
                  alert("请上传发票！")
                }
                else {
                  //存在发票
                  let invoiceData=[];
                  for (let i = 0; i < ylPc.length; i++) {
                    let formdata={
                      id:"",
                      appId:"",
                      invoiceStr:ylPc[i].querySelector("img").src
                    }
                    invoiceData[i] = formdata;
                    formdata={
                      id:"",
                      appId:"",
                      invoiceStr:""
                    }

                  }
                  all[2]=invoiceData;

                }
              }




              if (type===true){
                //数量不为空
                if (window.confirm("您确定要提交申请信息吗？")) {

                  //提交申请单信息
                  axios({
                    method: "post",
                    url: "applicationContent/addAllCf",
                    data: all
                  }).then(function (resp) {
                    if (resp.data === "success") {
                      alert("申请单信息转换成功！");
                      // localStorage.removeItem("my");
                      location.reload();
                    } else {
                      alert("申请单信息提交失败，请联系相关人员！")
                    }

                  })

                  return true;
                }
                else {
                  return false;
                }
              }
            }



          }
          else {
            alert("检测到存在申请数量未填写！")
          }
        } else {
          alert("未检测到需要提交的内容！")

        }








    });

    // 清空列表按钮
    document.getElementById('clearStorage').addEventListener('click', function() {
      if (hbData.length === 0) {
        alert('入库列表已经是空的！');
        return;
      }

      if (confirm('确定要清空入库列表吗？')) {
       hbData=[];
       document.getElementById("materialList").innerHTML="";
       document.getElementById("insertNumber").innerHTML=0;
        alert('入库列表已清空！');
      }
    });
