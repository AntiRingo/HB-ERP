    //这个是我封装后的代码
    //这个封装的函数并没有树状的结构，它只是把后台的数据重新理整了下
    //整理后的就是父级的下一位就是子级
    //当然，在调用的时候，pid参数可传，也可以不传，
    //如果不传，默认是根级 0
    //如果传，可随意是哪个，比如说传 3  那么，它就是从pid 为 3 的数据会列出来
   //当前位置数据格式转换代码
    function main(arr,pid = 0){
        var tep = [];
        function fn(arr,pid,lev = 1, path = ''){

            arr.forEach((item,index)=>{
                if (index === 0){
                    if(item.parentId === pid){
                        item.level = lev;
                        item.name = path + '&nbsp;'+  '<a href="sort.html?locationId='+item.id+'">'+item.name+'</a>'
                        tep.push(item)
                        fn(arr,item.id , lev + 1 , item.name)
                    }
                }else {
                    if(item.parentId === pid){
                        item.level = lev;
                        item.name = path +'&nbsp;' +'/'+'&nbsp;' +'<a href="sort.html?locationId='+item.id+'">'+item.name+'</a>'
                        tep.push(item)
                        fn(arr,item.id , lev + 1 , item.name)
                    }
                }

            })
        }
        fn(arr, pid);
        return tep;
    }

  function deleteSort(id,parentId){
      //查询权限
      let userId = parent.document.getElementById("userId").value;
      async function userFunction(userId){
          let data;
          await axios({
              method:"post",
              url:"userFunction/selectUserFunctionTwoByUserId",
              data:userId
          }).then(function (resp){
              data= resp.data;
          })
          return data;
      }
      let promise = userFunction(userId);
      let promiseBoolean=false;
      promise.then(function (resp){
          for (let j = 0; j < resp.length; j++) {
              if (resp[j].function_two_id === 6 && resp[j].open_status === 1) {
                  promiseBoolean = true;

                  break;
              }
          }
          if (promiseBoolean===true){
              if(window.confirm("您确定要删除这项分类吗？")){
                  axios({
                      method: "post",
                      url: "sort/selectOtherLevel",
                      data:id,
                  }).then(function (resp){
                      let datas=resp.data;
                      //判断是否要删除的分类里面还有分类
                      if (datas.length>0){
                          //有
                          alert("删除失败，该分类中还有其他分类!")
                      }else {
                          //没有就判断该分类下是否有物料，sort表中的id是product表中的productId
                          axios({
                              method:"post",
                              url:"product/selectByParentId",
                              data:id
                          }).then(function (resp){
                              let datas=resp.data;
                              if (datas===true){
                                  //分分类中有物料存在
                                  alert("删除失败，该分类中还有物料存在！")
                              }else if (datas===false){
                                  //该分类中没有物料存在
                                  axios({
                                      method:"post",
                                      url:"sort/deleteById",
                                      data:id
                                  }).then(function (resp){
                                      if (resp.data==="success"){
                                          alert("删除成功!")
                                          location.href="sort.html?nextId="+parentId+""
                                      }else {
                                          alert("删除失败，请联系相关人员！")
                                      }
                                  })

                              }
                          })
                      }
                  })


                  return true;
              }else {
                  return false;
              }
          }
          else {
              alert("您暂未获得删除权限！")
          }
      })



    }

    //得到当前位置数据格式的代码
    var datass=[];
    function belong(parentId,n){

       if (n>0){

           axios({
               method:"post",
               url:"sort/selectOfSort",
               data:parentId
           }).then(function (resp){
               var datas = resp.data;
               datass=datas.concat(datass);
                n--;
               belong(datas[0].parentId,n)
           })



       }else if (n===0) {

          let path = main(datass);
           for (let i = 0; i < path.length; i++) {
               if (i===path.length-1){

                   document.getElementById("location").innerHTML=""+path[i].name+""
               }

           }

       }


    }

        promise.then(function (resp){
            for (let i = 0; i < resp.length; i++) {
                if (resp[i].function_two_id===4 && resp[i].open_status===1){
