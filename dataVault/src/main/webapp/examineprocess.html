    //单位换算
    function power(str){
        let number= str.replace(/[fpnum%KMGT]/,'');
        let power = str.replace(/([-]?[0-9]+[.][0-9]+)|([-]?[0-9]*)/,'');




        if (power.length>0){
            let num;
            if (power==="f"){
                num=0.000000000000001;
            }else if (power==="p"){
                num=0.000000000001;
            }else if (power==="n"){
                num=0.000000001;
            }else if (power==="u"){
                num=0.000001;
            }else if (power==="m"){
                num=0.001;
            }else if (power==="%"){
                num=0.01;
            }else if (power==="K"){
                num=1000;
            }else if (power==="M"){
                num=1000000;
            }else if (power==="G"){
                num=1000000000;
            }else if (power==="T"){
                num=1000000000000;
            }

            return Number(num)*Number(number);
        }else {
            return number
        }

    }

    //在符合pattern后，判断范围规定是否符合规定，例如<100~80]就不符合规定

            var patterns= /^\<.*\]$/;

            var patterns1= /^\[.*\>$/;
            // var patternss=/^\<.*\>$/;

                value=value.split("[").join("");
                value=value.split("]").join("");
                // str=str.replace(/[a-zA-Z]/g, '');
                let strings = value.split("~");
                // console.log(strings[0])
                // console.log(strings[1])





                //判断两个数是否正常，第一个数应该小于第二个数
                if (strings[0]==="∞"||strings[1]==="∞" ){
                   return true;
                }
                else {
                    //将两个数解析是否含有power
                    let power1 = power(strings[0]);
                    let power2 = power(strings[1]);

                    if (Number(power1)<Number(power2)){
                        return true;
                    }else {
                        return false;
                    }
                }

            }
            else if (patterns.test(value)===true){

                value=value.split("<").join("");
                value=value.split("]").join("");
                // str=str.replace(/[a-zA-Z]/g, '');
                let strings = value.split("~");



                //判断两个数是否正常，第一个数应该小于第二个数
                if (strings[0]==="∞"||strings[1]==="∞"){
                    return true;
                }
                else {

                    let power1 = power(strings[0]);
                    let power2 = power(strings[1]);
                    if (Number(power1)<Number(power2)){
                        return true;
                    }else {
                        return false;
                    }
                }

            }
            else if (pattern1.test(value)===true){
                value=value.split("<").join("");
                value=value.split(">").join("");
                // str=str.replace(/[a-zA-Z]/g, '');
                let strings = value.split("~");


                //判断两个数是否正常，第一个数应该小于第二个数
                if (strings[0]==="∞"||strings[1]==="∞"){
                    return true;
                }
                else {
                    //将两个数解析是否含有power
                    let power1 = power(strings[0]);
                    let power2 = power(strings[1]);
                    if (Number(power1)<Number(power2)){
                        return true;
                    }else {
                        return false;
                    }
                }

            }
            else if (patterns1.test(value)===true){
                value=value.split("[").join("");
                value=value.split(">").join("");
                // str=str.replace(/[a-zA-Z]/g, '');
                let strings = value.split("~");


                //判断两个数是否正常，第一个数应该小于第二个数
                if (strings[0]==="∞"||strings[1]==="∞"){
                    return true;
                }
                else {
                    //将两个数解析是否含有power
                    let power1 = power(strings[0]);
                    let power2 = power(strings[1]);
                    if (Number(power1)<Number(power2)){
                        return true;
                    }else {
                        return false;
                    }
                }

            }
            else {
                return false;
            }

        }
        else {
            return false;
        }
    }

    function ifRange(value,e){
        var pattern = /^(<|\[)([-]?[0-9]+[.]?[0-9]*[fpnum%KMGT]?|[∞])[~]([-]?[0-9]+[.]?[0-9]*[fpnum%KMGT]?|[∞])(>|])$/;
        if (pattern.test(value)){

    function submitIfRange(){
        let have = document.getElementById("haveCondition");
        let haveButton = have.querySelectorAll(".examineCondition");
        let bb = true;

        for (let i = 0; i < haveButton.length; i++) {
            let haveValue = haveButton[i].value;
            let haveInput = document.querySelectorAll(".content"+haveValue+"");
            // var pattern = /^(<|\[)[-]?[0-9]+[.]?[0-9]*[fpnum%KMGT]?[~][-]?[0-9]+[.]?[0-9]*[fpnum%KMGT]?(>|])$/;
            var pattern = /^(<|\[)([-]?[0-9]+[.]?[0-9]*[fpnum%KMGT]?|[∞])[~]([-]?[0-9]+[.]?[0-9]*[fpnum%KMGT]?|[∞])(>|])$/;
            for (let j = 0; j < haveInput.length; j++) {
                let value = haveInput[j].value;
                if (pattern.test(value)){
                    let b = compare(value);
                    if (b===false){
                        haveInput[j].blur();
                        bb = false;

                    }
                }
                else {
                    haveInput[j].blur();
                    bb = false;
                }
                if (bb===false){
                    break;
                }
            }
            if (bb===false){
                break;
            }

        }

        return bb;
    }



//查询现在拥有的的审核条件是什么
    function existCondition(){

        for (let i = 0; i < allCondition.length; i++) {
            //获取按钮的id
              let id = allCondition[i].id;
              exist=false;
                let value;
            for (let j = 0; j < condition.length; j++) {
                if (condition[j].id===id){

                    exist=true;
                    value=condition[j].value;
                }
            }
            if (exist===true){
                function deletes(){

                                    if (window.confirm("您确定要删除一个条件的内容吗？")){
                                        //删除该元素以及父级元素

                                    }

                                    }

                                }
                            }
                        }

                // console.log("aaaa")
                document.getElementById(""+id+"contentDisplay").style.display="";

                    method:"post",

    function move(){
        /* 拖动时触发 */
        document.addEventListener("dragstart", function(event) {
            event.dataTransfer.setData("Text", event.target.id);

        });
        document.addEventListener("dragend", function(event) {

        });
        /* 拖动完成后触发*/
        document.addEventListener("dragover", function(event) {
            event.preventDefault();
        });
        document.addEventListener("drop", function(event) {
            event.preventDefault();
            if ( event.target.className === "canMove" ) {
                var data = event.dataTransfer.getData("Text");
                event.target.appendChild(document.getElementById(data));
                existCondition();

            }
        });

    }

// 加载复选框状态的函数
                function loadCheckboxStatus() {
                    let modifyPriceCheckboxes = document.querySelectorAll(".modifyPrice");
                    let modifyQuantityCheckboxes = document.querySelectorAll(".modifyQuantity");

                    modifyPriceCheckboxes.forEach(checkbox => {
                        let stepId = checkbox.getAttribute("data-id");
                        let savedState = localStorage.getItem(`modifyPrice_${stepId}`);
                        if (savedState !== null) {
                            checkbox.checked = savedState === "true";
                        }
                    });

                    modifyQuantityCheckboxes.forEach(checkbox => {
                        let stepId = checkbox.getAttribute("data-id");
                        let savedState = localStorage.getItem(`modifyQuantity_${stepId}`);
                        if (savedState !== null) {
                            checkbox.checked = savedState === "true";
                        }
                    });
                }

// 保存复选框状态的函数
                function saveCheckboxStatus() {
                    let modifyPriceCheckboxes = document.querySelectorAll(".modifyPrice");
                    let modifyQuantityCheckboxes = document.querySelectorAll(".modifyQuantity");

                    modifyPriceCheckboxes.forEach(checkbox => {
                        let stepId = checkbox.getAttribute("data-id");
                        localStorage.setItem(`modifyPrice_${stepId}`, checkbox.checked);
                    });

                    modifyQuantityCheckboxes.forEach(checkbox => {
                        let stepId = checkbox.getAttribute("data-id");
                        localStorage.setItem(`modifyQuantity_${stepId}`, checkbox.checked);
                    });
                }

// 更新步骤权限到后端
                function updateStepPermissions(stepId) {
                    // 获取当前行的两个复选框状态
                    const row = document.querySelector(`[data-id="${stepId}"]`).closest('tr');
                    const priceChecked = row.querySelector('.modifyPrice').checked;
                    const quantityChecked = row.querySelector('.modifyQuantity').checked;

                    let formdata = {
                        id: "",  // 如果是新增，这个为空
                        examineId: stepId,  // 步骤ID
                        canPrice: priceChecked ? 1 : 0,  // 1=可以修改，0=不可以修改
                        canNumber: quantityChecked ? 1 : 0  // 1=可以修改，0=不可以修改
                    };

                    axios({
                        method: "post",
                        url: "examineTypeCan/updatePermissions",
                        data: formdata
                    }).then(function (resp) {
                        if (resp.data === "success") {
                           alert(`权限已更新: 价格${priceChecked ? "可以" : "不可以"}修改, 数量${quantityChecked ? "可以" : "不可以"}修改`);
                        } else {
                            alert("更新权限失败");
                        }
                    }).catch(function (error) {

                    });
