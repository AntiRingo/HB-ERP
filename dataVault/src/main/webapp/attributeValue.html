<script>



    //接收上个页面传来的订单id
    function getHref(){
        var url = decodeURI(location.search);
        var theRequest = new Object();
        var strs;
        if (url.indexOf("?") !== -1) {
            var str = url.substr(1);
            strs = str.split("&");
            for (var i = 0; i < strs.length; i++) {
                theRequest[strs[i].split("=")[0]] = unescape(strs[i].split("=")[1]);
            }
        }
        return theRequest;
    }
    //用法  var 自己变量名字 = getHref().要获取的参数名字
    var attNameId=getHref().attNameId;
    var userIdd=getHref().userId;

    var pattern = /^(<|\[)[-]?[0-9]+[.]?[0-9]*[fpnum%KMGT]?[~][-]?[0-9]+[.]?[0-9]*[fpnum%KMGT]?(>|])$/;
    //单位换算
    function power(str){
        let number= str.replace(/[fpnum%KMGT]/,'');
        let power = str.replace(/([-]?[0-9]+[.][0-9]+)|([-]?[0-9]*)/,'');




        if (power.length>0){
            let num;
            if (power==="f"){
                num=0.000000000000001;
            }else if (power==="p"){
                num=0.000000000001;
            }else if (power==="n"){
                num=0.000000001;
            }else if (power==="u"){
                num=0.000001;
            }else if (power==="m"){
                num=0.001;
            }else if (power==="%"){
                num=0.01;
            }else if (power==="K"){
                num=1000;
            }else if (power==="M"){
                num=1000000;
            }else if (power==="G"){
                num=1000000000;
            }else if (power==="T"){
                num=1000000000000;
            }

            return Number(num)*Number(number);
        }else {
            return number
        }

    }
