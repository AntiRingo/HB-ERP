    /* 为手风琴面板设计样式。 默认隐藏 */
    .panel {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.2s ease-out;

    /* 设置 +、- 标志 */
    .accordion:after {
        content: '\002B';  /* Unicode 字符 + 号 */

        float: right;
        margin-left: 5px;
    }
    /* 设置 +、- 标志 */

    input[type="checkbox"] {
        display: none; /* 隐藏原生复选框 */
    }

    label.checkbox {
        position: relative;
        display: inline-block;
        width: 20px;
        height: 20px;
        margin-right: 10px;
        border: 1px solid #ccc;
        border-radius: 3px;
        cursor: pointer;
    }

    label.checkbox::before {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 16px;
        height: 16px;
        background-color: #fff;
        border-radius: 2px;
        box-shadow: inset 0 1px 3px rgba(0, 0, 0, .1);
        transition: all .2s;
    }

    input[type="checkbox"]:checked + label.checkbox::before {
        background-color: #007bff;
        margin-top: -1px;
        margin-left: -1px;
    }
    /* 全选 */
    input[type="checkbox"]:checked + label.checkbox::after {
        content: "\2713";
        position: absolute;
        top: 1px;
        left: 4px;
        font-size: 14px;
        color: #fff;
        line-height: normal;
    }

    /* 未全选 */
    input[type="checkbox"]:indeterminate + label.checkbox::before {
        background-color: #007bff;
        margin-top: -1px;
        margin-left: -1px;
    }

    input[type="checkbox"]:indeterminate + label.checkbox::after {
        content: "\2212";
        position: absolute;
        top: 1px;
        left: 5px;
        font-size: 14px;
        color: #fff;
        line-height: normal;
    }

</style>
