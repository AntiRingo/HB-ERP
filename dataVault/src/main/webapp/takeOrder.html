      function fDate( t1, format = "YYYY-MM-DD HH:II "){
          let minutes = t1.getMinutes();
          if (minutes<10){
              const config = {
                  YYYY:t1.getFullYear(),
                  MM:t1.getMonth()+1,
                  DD:t1.getDate(),
                  HH:t1.getHours(),
                  II:"0"+t1.getMinutes(),
                  // SS:t1.getSeconds(),
              };
              for( const key in config){

                  format = format.replace(key,config[key])


              }
              return format;
          }
          else {
              const config = {
                  YYYY:t1.getFullYear(),
                  MM:t1.getMonth()+1,
                  DD:t1.getDate(),
                  HH:t1.getHours(),
                  II:t1.getMinutes(),
                  // SS:t1.getSeconds(),
              };
              for( const key in config){

                  format = format.replace(key,config[key])


              }
              return format;
          }



      }

              HH:t1.getHours(),

                                '                                <div  style="width: 10%;margin: 0 auto;  ;display: flex" ><b> '+data[i].jd+'</b></div>\n' +
                                '                                <div  style="width: 10%;margin: 0 auto;  ;display: flex" ><b> '+userName+'</b></div>\n' +
                                '                                <div  style="width: 10%;margin: 0 auto;  ;display: flex" > <a style="pointer-events: none; color: gray; text-decoration: none;" class="jiedan" href="javascript:void(0)">'+canJd(data[i].jd)+'</a></div>\n' +
                                '                            </div>'
                      }
                      else if (Number(data[i].sort)===4){
                        formdata += ' <div style="width: 100%;height: auto;display: flex;">\n' +
                                '                                <div class="pailie" style="width: 20%;margin: 0 auto;  " ><b >' + data[i].order_number + '</b></div>\n' +
                                '                                <div class="pailie" style="width: 20%;margin: 0 auto;  " ><b>' + fDate(new Date(data[i].date)) + '</b></div>\n' +
                                '                                <div class="pailie" style="width: 10%;margin: 0 auto;  " ><b class="which"></b></div>\n' +
                                '                                <div class="pailie" style="width: 10%;margin: 0 auto;  " ><b class="bm"></b></div>\n' +
                                '                                <div class="pailie" style="width: 10%;margin: 0 auto;  " ><b class="name"></b></div>\n' +
                                '                                <div  style="width: 10%;margin: 0 auto;  ;display: flex" ><b> '+data[i].jd+'</b></div>\n' +
                                '                                <div  style="width: 10%;margin: 0 auto;  ;display: flex" ><b> '+userName+'</b></div>\n' +
                                '                                <div  style="width: 10%;margin: 0 auto;  ;display: flex" > <a class="jiedan" href="javascript:void(0)">'+canJd(data[i].jd)+'</a></div>\n' +
                                '                            </div>'
                      }


                    }
                    document.getElementById("content").innerHTML = formdata;

                    //种类填写
                    whichSort(data);
                    bm(data);


                    //点击接单
                    let jds = document.querySelectorAll(".jiedan");
                    for (let i = 0; i < jds.length; i++) {
                      jds[i].onclick=async function () {
                        //1.检查是否该申请单已经被接单了
                        let newVar = await ifJd(data[i].id);
                        if (newVar===true){
                          //未接单,修改当前申请单为指定人接单
                          let formdata = {
                            id:"",
                            appFormId:data[i].id,
                            user:userId,
                            takeOrderStatus:1
                          }
                          axios({
                            method:"post",
                            url:"takeOrder/updateTakeOrder",
                            data:formdata,
                          }).then(function (resp){
                            if (resp.data==="success"){
                              alert("接单成功！");
                              window.parent.document.getElementById("iframepage").contentWindow.location.reload();

                            }
                            else {
                              alert("接单失败，请联系相关人员！")
                            }
                          })

                        }
                        else {
                          //已经被接单
                          alert("不好意思您来晚了，该申请单被领走了！")
                          location.reload();
                        }
                      }
                    }








                  } else {
                    document.getElementById("content").innerHTML = '<div style="width: 100%;height: auto;text-align: center;color: red;">暂未收到申请！</div>';
                  }
                })
              }

              //首页
              bzPages(1);
              //首页
              document.getElementById("firstPage1").onclick = function () {
                //获取当前页
                let innerHTML = document.getElementById("currentPage1").innerHTML;
                if (Number(innerHTML) === Number(1)) {
                  alert("这已经是第一页了！")
                } else if (Number(innerHTML) === Number(0)) {
                  alert("还未添加任何信息！")
                } else {
                  bzPages(1);

                }

              }
              //尾页
              document.getElementById("endPage1").onclick = function () {
                //获取共有几页
                let innerHTML = document.getElementById("pageSum1").innerHTML;
                //获取当前页
                let innerHTML1 = document.getElementById("currentPage1").innerHTML;
                if (Number(innerHTML1) === Number(innerHTML) && Number(innerHTML) !== Number(0)) {
                  alert("这已经是最后一页了！")
                } else if (Number(innerHTML1) === Number(0)) {
                  alert("还未添加任何信息！")
                } else {
                  bzPages(innerHTML);

                }

              }
              //上一页
              document.getElementById("lastPage1").onclick = function () {
                //获取当前页
                let innerHTML = document.getElementById("currentPage1").innerHTML;
                if (Number(innerHTML) > 0 && Number(innerHTML) !== 1) {
                  bzPages(Number(innerHTML) - 1);
                } else if (Number(innerHTML) === Number(1)) {
                  alert("这已经是首页了!")
                } else if (Number(innerHTML) === Number(0)) {
                  alert("还未添加任何信息！")
                } else {
                  alert("系统错误，请寻找相关人员！")
                }


              }
              //下一页
              document.getElementById("nextPage1").onclick = function () {
                //获取总页数和当前页
                let innerHTML = document.getElementById("currentPage1").innerHTML;
                let innerHTML2 = document.getElementById("pageSum1").innerHTML;
                if (Number(innerHTML) > 0 && Number(innerHTML) < Number(innerHTML2)) {
                  bzPages(Number(innerHTML) + Number(1))
                } else if (Number(innerHTML) === Number(innerHTML2) && Number(innerHTML2) !== Number(0)) {
                  alert("这已经是最后一页了！")
                } else if (Number(innerHTML) === Number(0)) {
                  alert("还未添加任何信息！")
                } else {
                  alert("系统错误，请联系相关人员！")
                }
              }

              //输入的页码
              document.getElementById("jump1").onclick = function () {
                //获取输入的页码
                let value = document.getElementById("jumpValue1").value;
                //获取当前页码
                let innerHTML = document.getElementById("currentPage1").innerHTML;
                //获取总页码
                let innerHTML1 = document.getElementById("pageSum1").innerHTML;
                //判断value是否为正整数
                var pattern = /^[1-9]\d*$/;

                let b = pattern.test(value);
                if (b) {
                  //如果是真的，那就符合正整数，然后再比较是否与当前页相同，是否大于总页数
                  if (Number(value) > Number(innerHTML1)) {
                    alert("您输入的数据不符合规则！")
                  } else if (Number(value) === Number(innerHTML)) {
                    alert("您已经处在当前页面了！")
                  } else if (Number(innerHTML) === Number(0)) {
                    alert("还未添加任何信息！")
                  } else {
                    bzPages(value);
                  }

                } else {
                  alert("您输入的数据不符合页码规则！")
                }


              }

            }
          }
          else {
            alert("请重新登陆！")
          }

    })





  </script>
