<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>个人密码管理</title>
    <link href="css/product.css" rel="stylesheet" />
    <script src="js/axios-0.18.0.js"></script>
    <script type="text/javascript" src="js/jquery-1.11.1.min.js"></script>

  </head>
  <style>

html{
    height: 100%;
    font-family: 宋体,serif;
}
      input{
          height:30px;
          border-radius: 15px;
          border: #003366 solid 1px;
          padding-left: 10px;
          padding-right: 10px;
          background-color: aliceblue;
      }
      button{
          cursor: pointer;

      }


  </style>
  <body>

  <div style="width: 100%;height: auto;">

      <div style="width:90%;margin: 10px auto auto auto">
          <div style="width: fit-content;margin: auto ">密码修改</div>
      </div>
      <div style="height:auto;width: 90%;margin: auto;padding:  2px">

          <!--   密码-->
          <div style="width: 99%;height: auto;display: flex;margin:auto">
              <div style="width: 20%;height: 50px;display: flex"><div style="width: fit-content;height:fit-content;margin: auto;align-self: center">原密码:</div></div>
              <div style="width: 80%;height: 50px;display: flex">
                  <div style="width: 100%;height: fit-content;margin: auto;align-self: center">
                      <input id="password" class="length" type="text" placeholder="由6~20位字母、数字组成"  style="width: 90%;" >
                  </div>
              </div>
          </div>
          <div style="width: 99%;height: auto;display: flex;margin:auto">
              <div style="width: 20%;height: 50px;display: flex"><div style="width: fit-content;height:fit-content;margin: auto;align-self: center">修改后的密码:</div></div>
              <div style="width: 80%;height: 50px;display: flex">
                  <div style="width: 100%;height: fit-content;margin: auto;align-self: center">
                      <input id="password1" class="length" type="text" placeholder="由6~20位字母、数字组成"  style="width: 90%;" >
                  </div>
              </div>
          </div>
          <div style="width: 99%;height: auto;display: flex;margin:auto">
              <div style="width: 20%;height: 50px;display: flex"><div style="width: fit-content;height:fit-content;margin: auto;align-self: center">再次输入修改后的密码:</div></div>
              <div style="width: 80%;height: 50px;display: flex">
                  <div style="width: 100%;height: fit-content;margin: auto;align-self: center">
                      <input id="password2" class="length" type="text" placeholder="由6~20位字母、数字组成"  style="width: 90%;" >
                  </div>
              </div>
          </div>

      <div style="width: 90%;height: auto;text-align: center;margin: 50px auto auto;">
          <button id="submit" style="width: 100px;height: 30px;border-radius: 15px;">确定修改</button>
      </div>
  </div>

   

  </div>
  </body>
  <script type="text/javascript" src="js/axios-0.18.0.js"></script>
  <script type="text/javascript" src="js/personalPasswordManage.js"></script>
</html>
