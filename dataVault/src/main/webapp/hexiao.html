<!DOCTYPE html>

    <meta charset="UTF-8">
    <title>物料库存管理系统</title>
    <style>
        .container {
            max-width: 90%;
            margin: 20px auto;
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        .month-filter {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }
        .month-input {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            width: 180px;
        }
        .summary {
            display: flex;
            gap: 30px;
            margin-bottom: 25px;
            padding: 15px 20px;
            background: #f8f9fa;
            border-radius: 8px;
            flex-wrap: wrap;
        }
        .summary-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 20px;
            border-radius: 6px;
            font-size: 16px;
        }
        /* 会计专业配色 */
        #total-previous { color: #2c3e50; font-weight: 600; }
        #total-income { color: #27ae60; font-weight: 600; }
        #total-expense { color: #c0392b; font-weight: 600; }
        #total-balance { color: #2980b9; font-weight: 600; }

        .data-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin-top: 10px;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            overflow: hidden;
        }
        .data-table th,
        .data-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
            position: relative;
        }
        .text-right { text-align: right; }

        /* 调整列边框 */
        th:nth-child(3),
        td:nth-child(3) {
            border-right: 1px solid #dee2e6;
        }

        /* 主列组样式 */
        .column-group {
            position: relative;
            background: #f0f2f5 !important;
        }
        .column-group::before,
        .column-group::after {
            content: "";
            position: absolute;
            top: 25%;
            bottom: 25%;
            width: 1px;
            background: #dee2e6;
        }
        .column-group::before { left: -1px; }
        .column-group::after { right: -1px; }

        /* 金额列分隔线 */
        .sub-divider::after {
            content: "";
            position: absolute;
            right: 0;
            top: 25%;
            bottom: 25%;
            width: 1px;
            background: #dee2e6;
        }
        td:last-child::after { display: none; }

        /* 表格颜色分类 */
        .previous-qty { color: #6c757d; }
        .previous-amt { color: #6c757d; }
        .income-qty { color: #4ecdc4; }
        .income-amt { color: #4ecdc4; }
        .expense-qty { color: #ff6b6b; }
        .expense-amt { color: #ff6b6b; }
        .balance-qty { color: #6c757d; }
        .balance-amt { color: #6c757d; }
    </style>
</head>

<script src="js/axios-0.18.0.js"></script>
<script>

    async function selectNumber(productId,vault,startTime,endTime){
        let s;
        await axios({
            method: "post",
            url:"balance/selectNumber?productId="+productId+"&vault="+vault+"&startTime="+startTime+"&endTime="+endTime+""
        }).then(function (resp){
            s=resp.data;

        })
        return s;
    }

    async function selectLast(productId,vault,startTime){
        let s;
        await axios({
            method: "post",
            url:"balance/selectLast?productId="+productId+"&vault="+vault+"&startTime="+startTime+"",
        }).then(function (resp){

            s=resp.data;

        })
        return s;
    }
    let map={
        startTime:"",
        endTime:"",
    }
    let mouth = document.querySelectorAll(".month-input");
    for (let i = 0; i < mouth.length; i++) {
        mouth[i].onchange = function (){
            let value = mouth[i].value;
            if (i===0){
                map.startTime = value;
            }
            else {
                map.endTime = value;
            }

            if (map.startTime.length>0 && map.endTime.length>0){
                axios({
                    method:"post",
                    url:"balance/selectAllByTime",
                    data:map
                }).then( async function (resp){
                    let datas= resp.data;
                    let formdata=""
                    for (let j = 0; j < datas.length; j++) {
                        //查询产品信息 以及数量
                        let s = await selectNumber(datas[j].product_id,datas[j].vault,map.startTime,map.endTime);
                        let s1 = await selectLast(datas[j].product_id,datas[j].vault,map.startTime);
                        let today;
                        let todayNumber;
                        if (s1===null){
                           today = 0;
                           todayNumber = 0;
                        }
                        else {
                            today = s1.today;
                            todayNumber =s1.todayNumber;
                        }

                        formdata+=' <tr>\n' +
                            '            <td style="border-right:1px solid #dee2e6">'+datas[j].name+'</td>\n' +
                            '            <td style="border-right:1px solid #dee2e6">'+datas[j].material_number+'</td>\n' +
                            '            <td style="border-right:1px solid #dee2e6">'+datas[j].unit+'</td>\n' +
                            '            <td class="text-right previous-qty">'+todayNumber+'</td>\n' +
                            '            <td class="text-right previous-amt sub-divider">￥'+today+'</td>\n' +
                            '            <td class="text-right income-qty">'+datas[j].todayInNumber+'</td>\n' +
                            '            <td class="text-right income-amt sub-divider">￥'+datas[j].todayIn+'</td>\n' +
                            '            <td class="text-right expense-qty">'+datas[j].todayOutNumber+'</td>\n' +
                            '            <td class="text-right expense-amt sub-divider">￥'+datas[j].todayOut+'</td>\n' +
                            '            <td class="text-right balance-qty">'+s.todayNumber+'</td>\n' +
                            '            <td class="text-right balance-amt">￥'+s.today+'</td>\n' +
                            '        </tr>'
                    }

                    document.getElementById("material-list").innerHTML=formdata;
                    height();
                })
            }

        }
    }

    document.getElementById("newBalance").onclick=function (){
        axios({
            method:"post",
            url:"balance/newBalance"
        }).then(function (resp){
            if (resp.data==="success"){
                alert("成功生成!");
                location.reload();
            }
            else {
                alert("生成失败！")
            }
        })
    }
    function height(){

        let iframe = window.parent.document.getElementById("iframepage");
        if (iframe){
            let num= window.parent.innerHeight;
            if (Number(num)>Number(60)){
                let s = Number(num)-Number(60)
                iframe.style.height=s+"px";
            }

        }


    }

    height();
</script>
