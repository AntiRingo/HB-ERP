</head>

    html{

        font-family: 宋体,serif;

    input{
        height:30px;
        border-radius: 15px;

    button{

    }

<body>
<div style="display: flex;width: 100%;height: auto">
    <div class="right" style="display: block;margin: auto">
        <div class="sticky" style="width: 95%;">
            <div style="width: 100%;height: auto;padding: 1px;border: #9eb6d8 solid 1px">
                <div style="width: 100%;height: auto;display: flex;text-align: center;color: white;line-height: 25px">
                    <div style="width:80%;background-color:#9eb6d8;margin: auto  ;height: 25px;"><b>基础编码管理</b></div>
                    <div style="width:19.5%;background-color:#9eb6d8;margin: auto  ;height: 25px;"><button id="add">添加分类编码规则</button></div>
                </div>

                <div style="width: 99%;height: auto;padding: 1px;border: #9eb6d8 solid 1px;margin:10px auto auto auto;overflow-y: scroll">
                    <div style="width: 100%;height: auto;display: flex;text-align: center;color: white;position: sticky;top: 0">
                        <div style="width: 80%;margin: auto;background-color: #9eb6d8; border:white solid 1px" ><b>分类等级</b></div>
                        <div style="width: 20%;margin: auto;background-color: #9eb6d8; border:white solid 1px" ><b>操作</b></div>
                    </div>
                    <div id="content" style="width: 100%;height:auto;margin: auto;max-height:500px;">
<!--                                                    <div style="width: 100%;height: auto;display: flex;text-align: center;">-->
<!--                                                        <div style="width: 30%;margin: auto;  border:white solid 1px" ><b>用户名</b></div>-->
<!--                                                        <div style="width: 20%;margin: auto;  border:white solid 1px" ><b>姓名</b></div>-->
<!--                                                        <div style="width: 10%;margin: auto;  border:white solid 1px" ><b>年龄</b></div>-->
<!--                                                        <div style="width: 15%;margin: auto;  border:white solid 1px" ><b>所属部门</b></div>-->
<!--                                                        <div style="width: 25%;margin: auto;  border:white solid 1px"    ><b>操作</b></div>-->
<!--                                                    </div>-->


                    </div>

                </div>

            </div>
        </div>
    </div>
</div>

<div class="window">

    <div class="window-content">

        <div class="window-content-close">×</div>

        <div id="codeView" class="aa" style="width:750px ;height: auto;max-height: 88%; margin: 5px auto auto;background-color: white;padding-bottom: 5px;">
            <div style="width: 100%;height: auto;display: flex;margin: auto;position: sticky;top: 0">
                <div style="width: 100%;height: 29px;background-color: #698CC3;margin-top: 1px;margin-left: 1px;
     line-height: 29px;text-align: center;color: white;"><b>添加编码规则</b></div>

            </div>

            <div class="aa" id="formdata" style="width:99% ;height: auto;margin: 4px auto auto;background-color: #f8f8f8;">
                <div style="width:100% ;height: auto;display: flex;">

                    <div  style="width: 19.5%;height: 50px; border-right: 1px solid #d6e0ef;border-bottom: 1px solid #d6e0ef;text-align: center;display: flex;">
                    <div style="width: fit-content;height: auto;align-self: center;margin: auto">
                      编码长度：
                    </div>
                </div>
                    <div  style="width:80% ;height:50px;border-bottom: 1px solid #d6e0ef;">
                        &nbsp;<input style="width: 90%;height: 30px;margin-top: 8px;" type="text" name="" id="length" value=""> &nbsp;<b>*</b>
                    </div>
                </div>

                <div style="width:100% ;height: auto;display: flex;">

                    <div  style="width: 19.5%;height: 50px; border-right: 1px solid #d6e0ef;border-bottom: 1px solid #d6e0ef;text-align: center;display: flex;">
                        <div style="width: fit-content;height: auto;align-self: center;margin: auto">
                            所需的内容：
                        </div>
                    </div>
                    <div  style="width:80% ;height:50px;border-bottom: 1px solid #d6e0ef;">
                        &nbsp;<input style="width: 90%;height: 30px;margin-top: 8px;" type="text" name="" id="description" value=""> &nbsp;<b>*</b>
                    </div>
                </div>
                <div style="width:100% ;height: auto;display: flex;">

                    <div  style="width: 19.5%;height: 50px; border-right: 1px solid #d6e0ef;border-bottom: 1px solid #d6e0ef;text-align: center;display: flex;">
                        <div style="width: fit-content;height: auto;align-self: center;margin: auto">
                            去除的内容：
                        </div>
                    </div>
                    <div  style="width:80% ;height:50px;border-bottom: 1px solid #d6e0ef;">
                        &nbsp;<input style="width: 90%;height: 30px;margin-top: 8px;" type="text" name="" id="remove" value=""> &nbsp;<b>*</b>
                    </div>
                </div>


            </div>

            <div style="width: 100%;height: auto;text-align: center"><button id="submit" style="padding: 5px 10px;margin: 10px auto 5px auto">提交规则</button></div>
        </div>


    </div>

</div>
</body>
<script type="text/javascript" src="js/axios-0.18.0.js"></script>
<script type="text/javascript">
    function height(){
        //设置iframe高度

        let iframe = window.parent.document.getElementById("iframepage");
        iframe.style.height=window.parent.innerHeight+"px";

    }
    height();


    // 在用户点击其他地方时，关闭弹窗
    let wd = document.querySelector(".window");
    window.onclick = function(event) {
        if (event.target === wd) {
            wd.style.display = "none";
        }
    }

    //点击close也可以关闭弹窗
    document.querySelector(".window-content-close").onclick=function (){
        wd.style.display="none";
    }


    document.getElementById("add").onclick=function (){
        //打开窗口
        document.querySelector(".window").style.display="block";
    }



</script>
</html>
