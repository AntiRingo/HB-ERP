<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF坐标标记工具</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
      padding: 20px;
      color: #333;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }

    header {
      background: linear-gradient(90deg, #4b6cb7 0%, #182848 100%);
      color: white;
      padding: 25px 30px;
      text-align: center;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    .subtitle {
      font-size: 1.1rem;
      opacity: 0.9;
      font-weight: 300;
    }

    .content {
      display: flex;
      flex-wrap: wrap;
      padding: 30px;
    }

    .control-panel {
      flex: 0 0 300px;
      padding: 20px;
      background: #f8f9ff;
      border-radius: 10px;
      margin-right: 20px;
      height: calc(100vh - 200px);
      overflow-y: auto;
    }

    .pdf-viewer-container {
      flex: 1;
      min-width: 400px;
      background: #f0f2f5;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      height: calc(100vh - 200px);
      display: flex;
      flex-direction: column;
    }

    .pdf-viewer-header {
      padding: 10px 15px;
      background: #e9ecef;
      border-bottom: 1px solid #dee2e6;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .zoom-controls {
      display: flex;
      gap: 10px;
    }

    .zoom-btn {
      padding: 5px 10px;
      background: #3498db;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .pdf-viewer {
      flex: 1;
      overflow: auto;
      position: relative;
    }

    h2 {
      color: #2c3e50;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 2px solid #eaeaea;
    }

    .input-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #555;
    }

    input, button {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
      transition: all 0.3s;
    }

    input:focus {
      outline: none;
      border-color: #3498db;
      box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
    }

    button {
      background: linear-gradient(90deg, #3498db 0%, #1a5f8e 100%);
      color: white;
      border: none;
      font-weight: 600;
      cursor: pointer;
      margin-top: 5px;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(52, 152, 219, 0.4);
    }

    button.secondary {
      background: linear-gradient(90deg, #6c757d 0%, #495057 100%);
    }

    button.success {
      background: linear-gradient(90deg, #28a745 0%, #1e7e34 100%);
    }

    button.danger {
      background: linear-gradient(90deg, #dc3545 0%, #bd2130 100%);
    }

    .result-box {
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
      margin-bottom: 20px;
    }

    .result-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #2c3e50;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
    }

    .result-title i {
      margin-right: 10px;
      font-size: 1.3rem;
    }

    .result-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: #3498db;
      text-align: center;
      padding: 10px;
      background: #f0f7ff;
      border-radius: 8px;
      margin: 10px 0;
    }

    .result-description {
      color: #666;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    #pdfCanvas {
      display: block;
      margin: 0 auto;
      cursor: crosshair;
      border: 1px solid #ddd;
      background-color: #fff;
    }

    .coordinate-display {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(255, 255, 255, 0.8);
      padding: 8px 15px;
      border-radius: 5px;
      font-size: 0.9rem;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    .origin-marker {
      position: absolute;
      width: 12px;
      height: 12px;
      background: #e74c3c;
      border: 2px solid white;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 0 2px #e74c3c;
      pointer-events: none;
    }

    .point-marker {
      position: absolute;
      width: 10px;
      height: 10px;
      background: #3498db;
      border: 2px solid white;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 0 2px #3498db;
      pointer-events: none;
      transition: all 0.3s;
    }

    .point-marker.highlighted {
      width: 15px;
      height: 15px;
      background: #ff5722;
      box-shadow: 0 0 0 3px #ff5722, 0 0 10px rgba(255, 87, 34, 0.7);
      z-index: 10;
    }

    .point-label {
      position: absolute;
      background: rgba(52, 152, 219, 0.8);
      color: white;
      padding: 2px 8px;
      border-radius: 3px;
      font-size: 0.8rem;
      transform: translate(10px, -50%);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .point-marker.highlighted + .point-label {
      opacity: 1;
      background: rgba(255, 87, 34, 0.9);
    }

    .instructions {
      margin-top: 20px;
      padding: 15px;
      background: #e9f7fe;
      border-radius: 8px;
      border-left: 4px solid #3498db;
    }

    .instructions h3 {
      margin-bottom: 10px;
      color: #2c3e50;
    }

    .instructions ol {
      padding-left: 20px;
    }

    .instructions li {
      margin-bottom: 8px;
    }

    .status-bar {
      padding: 10px;
      background: #f8d7da;
      color: #721c24;
      border-radius: 5px;
      margin-top: 10px;
      display: none;
    }

    .unit-selector {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    .unit-btn {
      flex: 1;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 5px;
      background: #f8f9fa;
      cursor: pointer;
      text-align: center;
      font-size: 0.9rem;
    }

    .unit-btn.active {
      background: #3498db;
      color: white;
      border-color: #3498db;
    }

    .highlight-controls {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .highlight-btn {
      flex: 1;
      padding: 8px;
      background: #ff9800;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      text-align: center;
    }

    @media (max-width: 768px) {
      .content {
        flex-direction: column;
      }

      .control-panel {
        margin-right: 0;
        margin-bottom: 20px;
        height: auto;
      }

      .pdf-viewer-container {
        height: 500px;
      }
    }
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>PDF坐标标记工具</h1>
    <p class="subtitle">设置原点、高亮显示坐标点</p>
  </header>

  <div class="content">
    <div class="control-panel">
      <h2>控制面板</h2>

      <div class="input-group">
        <label for="pdfFile">选择PDF文件</label>
        <input type="file" id="pdfFile" accept=".pdf">
      </div>

      <div class="input-group">
        <label for="pdfPassword">PDF密码 (可选)</label>
        <input type="password" id="pdfPassword" placeholder="输入PDF密码">
      </div>

      <button id="loadPdfBtn">加载PDF</button>

      <div class="result-box">
        <div class="result-title">
          <i>📍</i> 原点设置
        </div>
        <div class="unit-selector">
          <div class="unit-btn active" data-unit="mm">毫米 (mm)</div>
        </div>
        <div class="input-group">
          <label for="scaleFactor">比例尺 (毫米/像素)</label>
          <input type="number" id="scaleFactor" placeholder="输入比例尺" step="0.0001">
        </div>
        <button id="setOriginBtn" class="secondary">设置原点位置</button>
        <div class="result-description">
          在PDF上点击设置原点位置
        </div>
      </div>

      <div class="result-box">
        <div class="result-title">
          <i>📏</i> 坐标点操作
        </div>
        <div class="highlight-controls">
          <button class="highlight-btn" id="highlightAllBtn">高亮所有点</button>
          <button class="highlight-btn" id="clearHighlightsBtn">清除高亮</button>
        </div>
        <div class="result-description">
          点击按钮高亮显示所有坐标点
        </div>
      </div>

      <div class="instructions">
        <h3>使用说明</h3>
        <ol>
          <li>加载PDF文件（需要密码则输入）</li>
          <li>输入比例尺（毫米/像素）</li>
          <li>在PDF上点击设置原点位置</li>
          <li>点击"高亮所有点"按钮显示所有坐标点</li>
        </ol>
      </div>

      <div class="status-bar" id="statusBar">
        状态信息将显示在这里
      </div>
    </div>

    <div class="pdf-viewer-container">
      <div class="pdf-viewer-header">
        <div class="zoom-controls">
          <button class="zoom-btn" id="zoomInBtn">放大</button>
          <button class="zoom-btn" id="zoomOutBtn">缩小</button>
          <button class="zoom-btn" id="resetZoomBtn">重置</button>
        </div>
        <div id="pageInfo">第 <span id="currentPage">1</span> 页 / 共 <span id="totalPages">1</span> 页</div>
      </div>
      <div class="pdf-viewer" id="pdfViewer">
        <canvas id="pdfCanvas"></canvas>
        <div class="coordinate-display">
          <span id="coordinateInfo">X: 0, Y: 0</span>
        </div>
      </div>
    </div>
  </div>
</div>

  // 初始化
  function init() {
    canvasContext = pdfCanvas.getContext('2d');

    // 事件监听器
    loadPdfBtn.addEventListener('click', loadPDF);
    setOriginBtn.addEventListener('click', enableSetOriginMode);
    highlightAllBtn.addEventListener('click', highlightAllPoints);
    clearHighlightsBtn.addEventListener('click', clearHighlights);
    zoomInBtn.addEventListener('click', zoomIn);
    zoomOutBtn.addEventListener('click', zoomOut);
    resetZoomBtn.addEventListener('click', resetZoom);

    // 初始状态
    updateStatus('请加载PDF文件开始使用');
  }

  // 加载PDF文件
  function loadPDF() {
    const file = pdfFileInput.files[0];
    if (!file) {
      updateStatus('请选择PDF文件', 'error');
      return;
    }

    const password = pdfPasswordInput.value;
    const fileReader = new FileReader();

    fileReader.onload = function() {
      const typedarray = new Uint8Array(this.result);

      // 加载PDF文档
      pdfjsLib.getDocument({
        data: typedarray,
        password: password
      }).promise.then(function(pdf) {
        pdfDoc = pdf;
        totalPagesEl.textContent = pdfDoc.numPages;
        renderPage(pageNum);
      }).catch(function(error) {
        if (error.name === 'PasswordException') {
          updateStatus('需要密码才能打开此PDF', 'error');
        } else {
          updateStatus('加载PDF失败: ' + error.message, 'error');
        }
      });
    };

    fileReader.readAsArrayBuffer(file);
  }

  // 渲染PDF页面
  function renderPage(num) {
    pageRendering = true;
    currentPageEl.textContent = num;

    pdfDoc.getPage(num).then(function(page) {
      currentViewport = page.getViewport({ scale: scale });
      pdfCanvas.height = currentViewport.height;
      pdfCanvas.width = currentViewport.width;

      const renderContext = {
        canvasContext: canvasContext,
        viewport: currentViewport
      };

      const renderTask = page.render(renderContext);

      renderTask.promise.then(function() {
        pageRendering = false;
        if (pageNumPending !== null) {
          renderPage(pageNumPending);
          pageNumPending = null;
        }

        // 清除之前的标记
        clearMarkers();
        // 重新渲染所有标记
        renderAllMarkers();
        updateStatus('PDF加载成功，请设置原点');
      });
    });
  }

  // 放大
  function zoomIn() {
    if (scale < 3) {
      scale += 0.1;
      queueRenderPage(pageNum);
    }
  }

  // 缩小
  function zoomOut() {
    if (scale > 0.5) {
      scale -= 0.1;
      queueRenderPage(pageNum);
    }
  }

  // 重置缩放
  function resetZoom() {
    scale = 1.0;
    queueRenderPage(pageNum);
  }

  // 排队渲染页面
  function queueRenderPage(num) {
    if (pageRendering) {
      pageNumPending = num;
    } else {
      renderPage(num);
    }
  }

  // 设置原点模式
  function enableSetOriginMode() {
    if (!pdfDoc) {
      updateStatus('请先加载PDF文件', 'error');
      return;
    }

    if (!scaleFactorInput.value) {
      updateStatus('请输入比例尺', 'error');
      return;
    }

    currentScaleFactor = parseFloat(scaleFactorInput.value);
    if (isNaN(currentScaleFactor) || currentScaleFactor <= 0) {
      updateStatus('请输入有效的比例尺', 'error');
      return;
    }

    pdfCanvas.style.cursor = 'crosshair';
    pdfCanvas.onclick = setOrigin;
    updateStatus('请在PDF上点击设置原点位置');
  }

  // 设置原点
  function setOrigin(event) {
    const rect = pdfCanvas.getBoundingClientRect();
    const x = event.clientX - rect.left;
    const y = event.clientY - rect.top;

    originPoint = { x, y };

    // 创建原点标记
    const marker = document.createElement('div');
    marker.className = 'origin-marker';
    marker.style.left = `${x}px`;
    marker.style.top = `${y}px`;
    marker.setAttribute('data-type', 'origin');
    marker.setAttribute('data-id', 'origin');
    pdfViewer.appendChild(marker);

    // 存储标记
    markers.push({
      id: 'origin',
      type: 'origin',
      element: marker,
      position: { x, y }
    });

    pdfCanvas.style.cursor = 'default';
    pdfCanvas.onclick = null;

    updateStatus('原点已设置，可以高亮显示坐标点');
  }

  // 高亮所有点
  function highlightAllPoints() {
    if (!originPoint) {
      updateStatus('请先设置原点', 'error');
      return;
    }

    if (!currentScaleFactor) {
      updateStatus('请先设置比例尺', 'error');
      return;
    }

    // 清除之前的点
    clearHighlights();

    // 创建所有点标记
    coordinateData.forEach(point => {
      const x_mm = parseFloat(point.x.replace('mm', ''));
      const y_mm = parseFloat(point.y.replace('mm', ''));

      // 修复y轴方向问题：减去y值而不是加上
      const pixelX = originPoint.x + x_mm / currentScaleFactor;
      const pixelY = originPoint.y - y_mm / currentScaleFactor;

      // 创建点标记
      const marker = document.createElement('div');
      marker.className = 'point-marker highlighted';
      marker.style.left = `${pixelX}px`;
      marker.style.top = `${pixelY}px`;
      marker.setAttribute('data-type', 'point');
      marker.setAttribute('data-id', `point-${point.Designator || Math.random()}`);
      pdfViewer.appendChild(marker);

      // 创建点标签
      if (point.Designator) {
        const label = document.createElement('div');
        label.className = 'point-label';
        label.textContent = point.Designator;
        label.style.left = `${pixelX}px`;
        label.style.top = `${pixelY}px`;
        label.setAttribute('data-id', `label-${point.Designator || Math.random()}`);
        pdfViewer.appendChild(label);
      }

      // 存储标记
      markers.push({
        id: `point-${point.Designator || Math.random()}`,
        type: 'point',
        element: marker,
        position: { x: pixelX, y: pixelY },
        data: point
      });
    });

    updateStatus(`已高亮显示 ${coordinateData.length} 个坐标点`);
  }

  // 清除高亮
  function clearHighlights() {
    // 只清除点和标签，保留原点
    const points = markers.filter(m => m.type === 'point');
    points.forEach(point => {
      point.element.remove();
      // 移除对应的标签
      const labels = pdfViewer.querySelectorAll(`[data-id="label-${point.id.split('-')[1]}"]`);
      labels.forEach(label => label.remove());
    });

    // 从标记数组中移除点
    markers = markers.filter(m => m.type !== 'point');

    updateStatus('已清除所有高亮点');
  }

  // 清除所有标记
  function clearMarkers() {
    markers.forEach(marker => marker.element.remove());
    markers = [];
  }

  // 重新渲染所有标记（在缩放后调用）
  function renderAllMarkers() {
    if (!originPoint || !currentScaleFactor || markers.length === 0) return;

    // 重新计算所有标记的位置
    markers.forEach(marker => {
      if (marker.type === 'origin') {
        // 原点位置保持不变
        marker.element.style.left = `${marker.position.x}px`;
        marker.element.style.top = `${marker.position.y}px`;
      } else if (marker.type === 'point') {
        // 重新计算点的位置
        const x_mm = parseFloat(marker.data.x.replace('mm', ''));
        const y_mm = parseFloat(marker.data.y.replace('mm', ''));

        const pixelX = originPoint.x + x_mm / currentScaleFactor;
        const pixelY = originPoint.y - y_mm / currentScaleFactor;

        marker.element.style.left = `${pixelX}px`;
        marker.element.style.top = `${pixelY}px`;

        // 更新标签位置
        const label = pdfViewer.querySelector(`[data-id="label-${marker.id.split('-')[1]}"]`);
        if (label) {
          label.style.left = `${pixelX}px`;
          label.style.top = `${pixelY}px`;
        }
      }
    });
  }

  // 处理鼠标移动
  function handleMouseMove(event) {
    if (!originPoint || !currentScaleFactor) return;

    const rect = pdfCanvas.getBoundingClientRect();
    const x = event.clientX - rect.left;
    const y = event.clientY - rect.top;

    // 计算实际坐标（毫米）
    const dx = x - originPoint.x;
    const dy = y - originPoint.y;

    const realX = dx * currentScaleFactor;
    const realY = -dy * currentScaleFactor; // 修复y轴方向问题

    coordinateInfo.textContent = `X: ${realX.toFixed(2)}mm, Y: ${realY.toFixed(2)}mm`;
  }

  // 更新状态信息
  function updateStatus(message, type = 'info') {
    statusBar.style.display = 'block';
    statusBar.textContent = message;

    if (type === 'error') {
      statusBar.style.background = '#f8d7da';
      statusBar.style.color = '#721c24';
    } else {
      statusBar.style.background = '#d4edda';
      statusBar.style.color = '#155724';
    }
  }

  // 初始化应用
  init();
</script>
