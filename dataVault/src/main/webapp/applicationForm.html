<script type="text/javascript" src="js/axios-0.18.0.js"></script>

<script>
    // 全局变量：存储当前要退货的物料信息
    let currentReturnMaterial = null;

    //查询物料信息的分类名称
    async function getSortName(productId, vault) {
        const res = await axios.get("sort/selectByProduct", {
            params: {productId: productId, vault:vault }
        });
        return res.data[0].name;
    }

    //获取BOM表名称
    async function bomTitleName(id) {
        let name = "";
        await axios({
            method: "post",
            url: "finBomTitle/selectById",
            data: id
        }).then(function (resp){
            let data=resp.data;

            if (id!==0){
                name= '('+data.title+')';
            }


        })
        return name;
    }
    let wdSmall = document.querySelector(".window-small");
    //点击显示物料的详细信息
    function productAttribute(datas){
// 1. 监听父元素（例如document或特定容器）
        document.getElementById("content1").addEventListener('click', function(event) {
            // 2. 获取实际被点击的元素
            const target = event.target;

            // 3. 判断是否包含目标类名（支持多层嵌套）
            const yourElement = target.closest('.meterialNumber');

            // 4. 如果找到带目标类名的元素
            if (yourElement) {
                // 5. 获取数据（data-*属性或自定义数据）
                const data = yourElement.innerText; // 获取物料号

                axios({
                    method:"post",
                    url:"product/selectByMaterialNumber",
                    data:data
                }).then(function (resp){
                    let maDatas = resp.data;
                    if (maDatas.length>0){
                        wdSmall.style.display="block";
                        //根据物料id和仓库来查询该物料的详细信息
                        axios({
                            method:"post",
                            url:"product/selectProductWhenAddBom?id="+maDatas[0].id+"&vault="+maDatas[0].vault+""
                        }).then(function (resp)
                        {
                            let productAttribute=resp.data;
                            if (productAttribute.length>0){
                                let formdata="";

                                for (let j = 0; j < productAttribute.length; j++) {
                                    formdata+='<div  class="PN">'+productAttribute[j].attributeName+'</div>\n' +
                                        '            <div CLASS="PNI"><label>\n' +
                                        '                <input disabled value= '+productAttribute[j].content+' >\n' +
                                        '            </label></div>'
                                }
                                document.getElementById("PAttContent").innerHTML=formdata;
                                document.getElementById("pName").value=productAttribute[0].name;
                                document.getElementById("pMaterialNumber").value=productAttribute[0].material_number;
                                document.getElementById("pDescription").value=productAttribute[0].description;
                            }
                            else {
                                alert("未查询到数据请联系相关人员！")
                            }
                        })
                    }
                    else {
                        alert("未查询到数据请联系相关人员！")
                    }

                })


                // 6. 执行操作（例如发起请求）
                // doSomethingWith(data);
            }
        });

    }
    //点击close也可以关闭弹窗
    document.querySelector(".window-small-content-close").onclick=function (){
        wdSmall.style.display="none";
    }
    //禁止页面进行拖动，在移动端使用，签字完成后要移除此监听方法，要不然会导致无法滑动侧边栏
    var banRemove=function (e) {
        e.preventDefault();
    }

    //将图片转化为base64格式
    async function getBase64(file) {
        return new Promise(function (resolve, reject) {
            const reader = new FileReader()
            let imgResult = ''
            reader.readAsDataURL(file)
            reader.onload = function () {
                imgResult = reader.result
            }
            reader.onerror = function (error) {
                reject(error)
            }
            reader.onloadend = function () {
                resolve(imgResult)
            }
        })
    }

    function canvas(){
        // 获取画布
        var test = document.getElementById("myCanvas");

        test.height=Number(test.parentElement.offsetHeight) * 0.99;
        test.width=Number(test.parentElement.offsetWidth) * 0.99;

        // 检验支持性
        if(test.getContext){
            // 获取画笔
            var ctx = test.getContext("2d");
        }
        // 为画布绑定鼠标按下事件
        test.onmousedown = function(event){
            // 设置事件兼容
            event = event || window.event;
            //获取鼠标偏移量
            let offsetLeft = test.getBoundingClientRect().left;// 计算左边偏移量
            let offsetTop  = test.getBoundingClientRect().top;// 计算顶部偏移量

            var X = event.clientX - offsetLeft;
            var Y = event.clientY - offsetTop;



            // 清空路径容器
            ctx.beginPath();
            // 画笔抬起
            ctx.moveTo(X,Y);
            // 绑定鼠标移动事件
            document.onmousemove = function(event){
                event = event || window.event;
                let offsetLeft = test.getBoundingClientRect().left;// 计算左边偏移量
                let offsetTop = test.getBoundingClientRect().top;// 计算顶部偏移量

                // var X = event.clientX - offsetLeft;
                // var Y = event.clientY - offsetTop;
                // 获取鼠标移动偏移量
                var proX = event.clientX - offsetLeft;
                var proY = event.clientY - offsetTop;
                // 压栈
                ctx.save();
                // 设置样式
                ctx.strokeStyle = "skyblue";
                // 划线
                ctx.lineTo(proX,proY);
                ctx.stroke();
                ctx.restore();
            };
            // 为画布绑定鼠标抬起事件
            document.onmouseup = function(event){
                event = event || window.event;
                // 取消鼠标移动事件
                document.onmousemove = null;
                // 取消鼠标抬起事件
                document.onmouseup = null;
            };
            // // 设置下载
            // document.getElementById("saveSign").onclick=function(){
            //     let link = document.createElement('a');
            //     link.href = test.toDataURL('image/png');
            //     link.download = "sign.png";
            //     link.click();
            // }

            //设置清空画布
            document.getElementById("clearSign").onclick=function(){
                var cxt=document.getElementById("myCanvas").getContext("2d");
                cxt.clearRect(0,0,test.width,test.height);


            }


            return false;
        };

        window.addEventListener("paste", async function (event) {
            var items = event.clipboardData.items;
            if (items) {
                if (items[0].type.indexOf("image") > -1) {
                    var file = items[0].getAsFile();
                    const baseResult = await getBase64(file)

                    const img = new Image();
                    img.src = baseResult;

                    // let sendData = new FormData();
                    // sendData.append("file", file);
                    // console.log(sendData)
                    img.onload= function (){

                        ctx.drawImage(img,0,0)
                    }



                }
            }
        });


    }

    function canvasPhone(){
        //阻止页面拖动
        document.body.addEventListener('touchmove', banRemove
            , { passive: false });

        var canvas = document.getElementById("myCanvas");
        canvas.height=Number(canvas.parentElement.offsetHeight) * 0.99;
        canvas.width=Number(canvas.parentElement.offsetWidth) * 0.99;
        var ctx = canvas.getContext("2d");


//页面样式
//           canvas.width = window.screen.width - 42;//左边距20，右边为对齐左边留20，边框左右各1
//           canvas.height = window.screen.height - 130;//顶边距20，底边距20，边框左右各1，按钮组68，按钮组底边距20

        // var l = canvas.offsetLeft;
        // var t = canvas.offsetTop;

        let l = canvas.getBoundingClientRect().left;// 计算左边偏移量
        let t = canvas.getBoundingClientRect().top;// 计算顶部偏移量

        // alert(l)
        // alert(t)


        canvas.ontouchstart = function (e) {
            ctx.beginPath();
            ctx.moveTo(e.touches[0].pageX - l, e.touches[0].pageY - t);
        }

        canvas.ontouchmove = function (e) {
            ctx.lineTo(e.touches[0].pageX - l, e.touches[0].pageY - t);
            ctx.stroke();
        }

        canvas.ontouchend = function (e) {
            ctx.closePath();
        }
        //设置清空画布
        document.getElementById("clearSign").onclick=function(){
            var cxt=document.getElementById("myCanvas").getContext("2d");
            cxt.clearRect(0,0, canvas.width, canvas.height);

        }
    }

    //通知取货
    function pick(datas){
        //获取通知取货按钮
        let pick = document.querySelectorAll(".pickUp");

    function dealWith(data,i){
        //如果申请单的状态是待处理才可以
        //查询申请单状态
        axios({
            method:"post",
            url:"applicationForm/selectById",
            data:data[i].id
        }).then(function (resp){
            let form=resp.data;
            if (form[0].completeStatus===5 || form[0].completeStatus===3 ){


                document.getElementById("deal-with").style.display="";
                document.getElementById("deal-with").disabled = false;

                //获取区分是否取货的按钮
                let taked = document.querySelectorAll(".taked");
                let sta=false;
                for (let j = 0; j < taked.length; j++) {
                    taked[j].onclick=function (){
                        if (taked[j].checked===true){
                            //被选中了，判断是不是第一个
                            for (let k = 0; k < taked.length; k++) {
                                if (k!==j){
                                    //判断除了刚才选中的以外是否还有已选中的，如果没有的话就更新申请单状态：正在处理
                                    if (taked[k].checked===true){
                                        sta=true;
                                        break;
                                    }

                                }
                            }

                            if (sta===false){
                                let status = document.querySelectorAll(".completeStatus");
                                //更新申请单状态为取货中
                                axios({
                                    method:"post",
                                    url:"applicationForm/updateStatus?status="+0+"",
                                    data:data[i].id
                                }).then(function (resp){
                                    if (resp.data!=="success"){
                                        alert("系统错误，请联系相关人员！")
                                    }
                                    else {
                                        status[i].style.color="red";
                                        if(Number(sort)===1){
                                            //出库
                                            status[i].innerHTML="取货中"
                                        }
                                        else if (Number(sort)===0){
                                            //入库
                                            status[i].innerHTML="验货中"
                                        }


                                    }
                                })
                            }
                        }
                    }
                }

                //禁用取货按钮和数量框
                for (let j = 0; j < taked.length; j++) {
                    taked[j].disabled=true;
                }
                //获取输入数量的框
                let waitNumber = document.querySelectorAll(".waitNumber");
                for (let j = 0; j < waitNumber.length; j++) {
                    waitNumber[j].disabled=true;
                }
                //禁用一键填写和提交按钮
                document.getElementById("writeAll").disabled=true;
                document.getElementById("submit").disabled=true;

                //解禁
                document.getElementById("deal-with").onclick=function (){
                    //禁用取货按钮和数量框
                    for (let j = 0; j < taked.length; j++) {
                        taked[j].disabled=false;
                    }
                    //获取输入数量的框
                    let waitNumber = document.querySelectorAll(".waitNumber");
                    for (let j = 0; j < waitNumber.length; j++) {
                        waitNumber[j].disabled=false;
                    }
                    //禁用一键填写和提交按钮
                    document.getElementById("writeAll").disabled=false;
                    document.getElementById("submit").disabled=false;
                }
            }
            else {
                document.getElementById("deal-with").style.display="none";
                let taked = document.querySelectorAll(".taked");
                let appNumber = document.querySelectorAll(".appNumber");
                let actualNumber = document.querySelectorAll(".actualNumber");
                let waitNumber = document.querySelectorAll(".waitNumber");




                if (form[0].completeStatus ===1){

                    for (let j = 0; j < taked.length; j++) {
                        taked[j].disabled=true;
                        appNumber[j].disabled=true;
                        actualNumber[j].disabled=true;
                        waitNumber[j].disabled=true;
                    }
                    document.getElementById("writeAll").disabled = true;
                    document.getElementById("submit").disabled = true;
                    document.getElementById("deal-with").disabled = true;
                }
                else {
                    let m = 0;
                    for (let j = 0; j < appNumber.length; j++) {
                        if (Number(appNumber[j].innerHTML) <= Number(actualNumber[j].innerHTML)) {
                            waitNumber[j].disabled = true;

                        }

                    }
                    if (Number(m) === Number(appNumber.length)) {

                        document.getElementById("writeAll").disabled = true;

                        document.getElementById("deal-with").disabled = true;
                    } else {

                        document.getElementById("writeAll").disabled = false;

                        document.getElementById("deal-with").disabled = false;
                    }
                }

                for (let j = 0; j < contentData.length; j++) {

                    let vault1 = contentData[j].vault;
                    let appNumber1 = contentData[j].app_number;

                        console.log(sjNumber,value1)

                    }
                }

                if (Number(number)<Number(sjNumber)){
