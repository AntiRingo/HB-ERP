<script type="text/javascript" src="js/axios-0.18.0.js"></script>
<script>


    //接收上个页面传来的数据

    // 接收前端传来的parentId
    function getHref(){
        var url = decodeURI(location.search);
        var theRequest = new Object();
        if (url.indexOf("?") !== -1) {
            var str = url.substr(1);
            strs = str.split("&");
            for(var i = 0; i < strs.length; i ++) {
                theRequest[strs[i].split("=")[0]] = unescape(strs[i].split("=")[1]);
            }
        }
        return theRequest;
    }
    let productId = getHref().finId;//接收上个页面传来的物料id，使用此id查询BOM表标题
    let userId=getHref().userId;

    async function isAuthor(bomTitleId) {
        //验证当前用户是否有权限
        let b;
        await axios({
            method: "post",
            url: "finBomTitle/selectIsAuthor",
            data: bomTitleId
        }).then(function (resp){
            b=resp.data;
        })
        return b;
    }

    //验证当前用户是否有查看权限
    async function ifLook(bomTitleId) {
        let b;
        await axios({
            method: "post",
            url: "bomPurview/selectHavePurview",
            data: bomTitleId
        }).then(function (resp) {
            b = resp.data;
        })
        return b;
    }


    //查询权限
    async function userFunction(userId){
        let data;
        await axios({
            method:"post",
            url:"userFunction/selectUserFunctionTwoByUserId",
            data:userId
        }).then(function (resp){
            data= resp.data;
        })
        return data;
    }


    //增改BOM表权限
    async function addAndUpdateBomQx(){
        let promise = userFunction(userId);
        let promiseBoolean=false;
        await promise.then( async function (resp) {

            for (let j = 0; j < resp.length; j++) {
                if (resp[j].function_two_id === 58 && resp[j].open_status === 1) {
                    promiseBoolean = true;

                    break;
                }
            }

        })
        return promiseBoolean;
    }

    //删除BOM表权限
    async function deleteBomQx(){
        let promise = userFunction(userId);
        let promiseBoolean=false;
        await promise.then( async function (resp) {

            for (let j = 0; j < resp.length; j++) {
                if (resp[j].function_two_id === 59 && resp[j].open_status === 1) {
                    promiseBoolean = true;

                    break;
                }
            }

        })
        return promiseBoolean;
    }


    //查询已有的BOM表版本列表
    axios({
        method:"post",
        url:"finBomTitle/selectBomTitleAndProduct",
        data:productId
    }).then(function (resp){
        let datas=resp.data;
        if (datas.length>0){
            // document.getElementById("add").disabled=true;
            let formdata="";
            for (let i = 0; i < datas.length; i++) {
                formdata+='<div style="width: 100%;height: auto;display: flex;text-align: center;">\n' +
                    '                                                        <div style="width: 24.5%;margin: auto; border: white solid 1px"><b>'+datas[i].title+'</b></div>\n' +
                    '                                                        <div style="width: 50%;margin: auto  ; border: white solid 1px"><b>'+datas[i].description+'</b></div>\n' +
                    '                                                        <div style="width: 25%;margin: auto;   border: white solid 1px"><a class="updateBomTitle" href="javascript:void(0)">修改</a>&nbsp;<a class="deleteBomTitle"  href="javascript:void(0)">删除</a>&nbsp;<a class="bomContent"  href="javascript:void(0)">BOM表</a></div>\n' +
                    '                                                    </div>';
            }
            document.getElementById("content").innerHTML=formdata;
            //删除功能
            let deletes = document.querySelectorAll(".deleteBomTitle");
            for (let i = 0; i < deletes.length; i++) {
                deletes[i].onclick=async function () {
                    //查询是否是作者
                    let newVar = await isAuthor(datas[i].id);
                    if (newVar){
                        //判断是否有删除BOM表的权限
                        let b = await deleteBomQx();
                        if (b===false){
                            alert("您暂未获得删除BOM表的权限！")
                        }
                        else {
                            if (window.confirm("您确定要删除这个BOM表吗？")) {
                                axios({
                                    method: "post",
                                    url: "finBomTitle/delete",
                                    data: datas[i].id
                                }).then(function (resp) {
                                    let datas = resp.data;
                                    if (datas === "success") {
                                        alert("删除成功！");
                                        location.reload();
                                    } else {
                                        alert("删除失败，请联系相关人员！")
                                    }
                                })
                                return true;
                            } else {
                                return false;
                            }
                        }
                    }
                    else {
                        alert("您没有权限！")
                    }



                }
            }

            //修改功能
            let update = document.querySelectorAll(".updateBomTitle");
            for (let i = 0; i < update.length; i++) {
                update[i].onclick=async function () {
                    //查询是否是作者
                    let newVar = await isAuthor(datas[i].id);

                    if (newVar){
                        //判断是否有修改BOM表的权限
                        let b = await addAndUpdateBomQx();
                        if (b===false){
                            alert("您暂未获得操作BOM表的权限！")
                        }
                        else {

                            document.querySelector(".window").style.display = "block";
                            document.getElementById("updateBlock").style.display = "block";
                            document.getElementById("addBlock").style.display = "none";
                            //查询数据进行回显
                            axios({
                                method: "post",
                                url: "finBomTitle/selectById",
                                data: datas[i].id
                            }).then(function (resp) {
                                let datas = resp.data;
                                document.getElementById("updateTitle").value = datas.title;
                                document.getElementById("updateDescription").value = datas.description;
                            })

                            document.getElementById("update").onclick = function () {
                                //获取数据
                                let updateFormdata = {
                                    id: "",
                                    finProductId: "",
                                    title: "",
                                    description: ""

                                }
                                updateFormdata.id = datas[i].id;
                                updateFormdata.finProductId = datas[i].finProductId;
                                updateFormdata.title = document.getElementById("updateTitle").value.trim();
                                updateFormdata.description = document.getElementById("updateDescription").value.trim();
                                //判断是否为空

                                if (updateFormdata.title.length === 0 || updateFormdata.description.length === 0) {
                                    alert("您有数据未填写完整！")
                                } else {
                                    if (window.confirm("您确定要更新此版本信息吗？")) {
                                        axios({
                                            method: "post",
                                            url: "finBomTitle/update",
                                            data: updateFormdata
                                        }).then(function (resp) {
                                            let datas = resp.data;
                                            if (datas === "success") {
                                                alert("更新成功！");
                                                location.reload();
                                            } else {
                                                alert("更新失败，请联系相关人员！")
                                            }
                                        })
                                        return true;
                                    } else {
                                        return false;
                                    }

                                }
                            }
                        }
                    }
                    else {
                        alert("您没有权限！")
                    }



                }
            }

            //跳转到BOM表内容
            //打开BOM表相关信息
            let boms = document.querySelectorAll(".bomContent");
            for (let i = 0; i < boms.length; i++) {
                boms[i].onclick=async function () {
                    let newVar = await ifLook(datas[i].id);
                    if (newVar==="success"){
                        //查询是否有权限
                            window.open("addbom.html?finId=" + datas[i].finProductId + "&vault=" + 1 + "&bomTitleId=" + datas[i].id + "");

                    }
                    else {
                        alert("您没有权限！")
                    }


                }

            }



        }
        else {
            document.getElementById("content").innerHTML='<div style="width: 100%;height: auto;text-align: center;color: red;">暂未添加BOM表信息！</div>';
        }



    })


    //根据id查询物料名称
    axios({
        method:"post",
        url:"finProduct/selectById",
        data:productId
    }).then(function (resp){
        let datas=resp.data;
        document.getElementById("name").value=datas[0].finProductName;
        document.getElementById("updateName").value=datas[0].finProductName;
        document.getElementById("nameProduct").innerHTML=datas[0].finProductName;
    })

    //添加信息新BOM表标题信息
    document.getElementById("add").onclick=async function () {
        //检测是否已经存在BOM表了，如果已经存在就提示
        let b = await addAndUpdateBomQx();
        if (b){
            document.querySelector(".window").style.display = "block";
            document.getElementById("updateBlock").style.display = "none";
        }
        else {
            alert("您未获得权限！")
        }


    }

    //关闭窗口
    document.querySelector(".window-content-close").onclick=function (){
        document.querySelector(".window").style.display="none";
    }

    //提交BOM表标题信息
    document.getElementById("submit").onclick=async function () {

        let b = await addAndUpdateBomQx();
        if (b){
            //收集数据
            let formdata = {
                id: "",
                finProductId: "",
                title: "",
                description: ""
            }

            formdata.finProductId = productId;
            formdata.title = document.getElementById("title").value.trim();
            formdata.description = document.getElementById("description").value.trim();

            //验证数据是否为空
            if (formdata.title.length === 0 || formdata.description.length === 0) {
                alert("您有数据未填写完整！")
            } else {

                if (window.confirm("您确定要提交信息吗？")) {


                    //提交标题信息
                    axios({
                        method: "post",
                        url: "finBomTitle/addBomTitle",
                        data: formdata
                    }).then(function (resp) {
                        let datas = resp.data;
                        if (datas === "success") {
                            alert("新建BOM表版本成功！");
                            location.reload();
                        } else {
                            alert("新建BOM表版本失败，请联系相关人员！")
                        }
                    })
                    return true;
                } else {
                    return false;
                }
            }
        }
        else {
            alert("您暂未获得权限！")
        }

    }

</script>
