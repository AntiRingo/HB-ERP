<script>

    //获取权限信息
    //查询权限
    let userId = parent.document.getElementById("userId").value;
    async function userFunction(userId){
        let data;
        await axios({
            method:"post",
            url:"userFunction/selectUserFunctionTwoByUserId",
            data:userId
        }).then(function (resp){
            data= resp.data;
        })
        return data;
    }
    //添加公共属性权限
    async function addPublicQx(){
        let promise = userFunction(userId);
        let promiseBoolean=false;
        await promise.then( async function (resp) {

            for (let j = 0; j < resp.length; j++) {
                if (resp[j].function_two_id === 22 && resp[j].open_status === 1) {
                    promiseBoolean = true;

                    break;
                }
            }

        })
        return promiseBoolean;
    }
    //修改公共属性权限
    async function updatePublicQx(){
        let promise = userFunction(userId);
        let promiseBoolean=false;
        await promise.then( async function (resp) {

            for (let j = 0; j < resp.length; j++) {
                if (resp[j].function_two_id === 23 && resp[j].open_status === 1) {
                    promiseBoolean = true;

                    break;
                }
            }

        })
        return promiseBoolean;
    }
    //删除公共属性权限
    async function deletePublicQx(){
        let promise = userFunction(userId);
        let promiseBoolean=false;
        await promise.then( async function (resp) {

            for (let j = 0; j < resp.length; j++) {
                if (resp[j].function_two_id === 24 && resp[j].open_status === 1) {
                    promiseBoolean = true;

                    break;
                }
            }

        })
        return promiseBoolean;
    }



    function height(){
        if (window.parent.document.getElementById("iframepage")){
            let iframe = window.parent.document.getElementById("iframepage");
            iframe.style.height=window.parent.innerHeight+"px";
        }

    }
    height();


    //给修改唯一值绑定方法
    function ifUnique(nameId){
        let upUniqueChange = document.querySelectorAll(".type2");
        upUniqueChange[0].onchange=function (){
            //查询该属性是否
            axios({
                method:"post",
                url:"attribute/ifUnique",
                data:nameId
            }).then(function (resp){
                let datas=resp.data;
                if (datas===true){
                    //重复，不能开启该功能
                    upUniqueChange[0].checked=false;
                    upUniqueChange[1].checked=true;
                    alert("该属性存在重复项，不能开启该功能！")
                }
            })
        }
    }

    // 在用户点击其他地方时，关闭弹窗
    let wd = document.querySelector(".window");
    window.onclick = function(event) {
        if (event.target === wd) {
            wd.style.display = "none";
        }
    }

    //点击close也可以关闭弹窗
    document.querySelector(".window-content-close").onclick=function (){
        wd.style.display="none";
    }


    document.getElementById("add").onclick=function (){
        let booleanPromise = addPublicQx();
        booleanPromise.then(function (resp){
            if (resp===true){
                wd.style.display="block";
                document.getElementById("addAttribute").style.display="";
                document.getElementById("updateAttribute").style.display="none";
                let uniqueButton = document.querySelectorAll(".type1");
                uniqueButton[1].checked=true;
                let displayButton = document.querySelectorAll(".type3");
                displayButton[1].checked=true;
            }
            else {
                alert("您暂未获得添加权限！")
            }
        })



    }


    //查询公共属性

        method:"post",
        url:"attribute/selectPublic"
    }).then(async function (resp){
        let datas=resp.data;

        if (datas.length>0){
            for (let i = 0; i < datas.length; i++) {

                }).then(function (resp) {

                            break;

                            '                <div style="width: 30%; border:white solid 1px" ><b>'+datas[i].unit+'</b></div>\n' +

                            '\n' +
                            '            </div>'
                    }
                    else {

                        formdata+='<div style="width: 100%;height: auto;display: flex;text-align: center;color: black">\n' +
                            '                <div style="width: 35%; border:white solid 1px" ><b>'+datas[i].name+'</b></div>\n' +
                            '                <div style="width: 30%; border:white solid 1px" ><b>'+datas[i].unit+'</b></div>\n' +
                            '                <div style="width:35%;  border:white solid 1px" ><a style="white-space: nowrap" class="updateAttribute" href="javascript:void(0)">修改</a>' +
                            '&nbsp;<a style="white-space: nowrap" class="deleteAttribute"  href="javascript:void(0)">删除</a>' +
                            '&nbsp;<a style="white-space: nowrap" class="attributeValue"  href="attributeValue.html?attNameId=' + datas[i].id + '&userId='+userId+'&sortId='+0+'&level='+0+'&public='+1+'">编码表</a></div>\n' +
                            '\n' +
                            '            </div>'
                    }
                })
            }


            document.getElementById("content").innerHTML=formdata;




         //    //查询是否有物料，有物料的话禁用删除和修改
         // await   axios({
         //        method:"post",
         //        url:"product/selectAll"
         //    }).then(function (resp){
         //        if (resp.data.length===0){
         //            for (let i = 0; i < datas.length; i++) {
         //                formdata+='<div style="width: 100%;height: auto;display: flex;text-align: center;color: black">\n' +
         //                    '                <div style="width: 35%; border:white solid 1px" ><b>'+datas[i].name+'</b></div>\n' +
         //                    '                <div style="width: 30%; border:white solid 1px" ><b>'+datas[i].unit+'</b></div>\n' +
         //                    '                <div style="width:35%;  border:white solid 1px" ><a style="white-space: nowrap" class="updateAttribute" href="javascript:void(0)">修改</a>&nbsp;<a style="white-space: nowrap" class="deleteAttribute"  href="javascript:void(0)">删除</a>&nbsp;</div>\n' +

         //                    '                <div style="width: 35%; border:white solid 1px" ><b>'+datas[i].name+'</b></div>\n' +
         //                    '                <div style="width: 30%; border:white solid 1px" ><b>'+datas[i].unit+'</b></div>\n' +

         //                    '\n' +
         //                    '            </div>'
         //            }
         //        }
         //    })
         //    document.getElementById("content").innerHTML=formdata;

            formdata+='<div style="width: 100%;height: auto;text-align: center;color: red;">还未添加公共属性！</div>';
            document.getElementById("content").innerHTML=formdata;
        }


        //删除
        let deletes = document.querySelectorAll(".deleteAttribute");
        for (let i = 0; i < deletes.length; i++) {
            deletes[i].onclick=function (){
                let booleanPromise = deletePublicQx();
                booleanPromise.then(function (resp){
                    if (resp===true){
                        if (window.confirm("您确定要删除这条公共属性吗?")){
                            axios({
                                method:"post",
                                url:"attribute/deleteAttributeNameById",
                                data:datas[i].id
                            }).then(function (resp){
                                if (resp.data==="success"){
                                    alert("删除成功！");
                                    location.reload();
                                }else {
                                    alert("删除失败，请联系相关人员!")
                                }
                            })
                            return true;
                        }else {
                            return false;
                        }
                    }
                    else {
                        alert("您暂未获得删除权限！")
                    }
                })

            }
        }

        //更新
        let update = document.querySelectorAll(".updateAttribute");
        for (let i = 0; i < update.length; i++) {

                                } else {

                                }

                                            id: datas[0].id,
                                            name: "",
                                            unit: "",
                                        }

                                        formdata.name = document.getElementById("updateName").value;
                                        formdata.unit = document.getElementById("updateUnit").value;


                                        //向上查找所有的父级分类
                                        let upSort = [];
                                        let upAttributeName = [];
                                        let upAttributeNameCompare = true;
                                        let downAttributeName = [];
                                        let downAttributeNameCompare = true;
                                        let basicName = [];
                                        let basicNameCompare = true;


                                        function upSelect(a1, a2) {

                                            if (a2 > 0) {

                                                axios({
                                                    method: "post",
                                                    url: "sort/selectOfSort",
                                                    data: a1
                                                }).then(function (resp) {
                                                    var datas = resp.data;
                                                    upSort = datas.concat(upSort);
                                                    a2--;
                                                    upSelect(datas[0].parentId, a2)
                                                })
                                            } else if (a2 === 0) {
                                                //先判断是否与基本属性重复
