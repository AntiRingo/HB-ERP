<script>

    // 紧急情况转换函数
    // 紧急情况转换函数（带颜色）
    function getRobotText(robot) {
        if (!robot) return '<span style="color:#27ae60">无</span>';
        switch (Number(robot)) {
            case 1:
                return '<span style="color:#27ae60">普通 - 正常处理</span>'; // 绿色
            case 2:
                return '<span style="color:#f39c12">紧急 - 尽快处理</span>'; // 橙色
            case 3:
                return '<span style="color:#e74c3c">非常紧急 - 立即处理</span>'; // 红色
            default:
                return '<span style="color:#27ae60">无</span>';
        }
    }

    //获取BOM表名称
    async function bomTitleName(id) {
        let name = "";
        await axios({
            method: "post",
            url: "finBomTitle/selectById",
            data: id
        }).then(function (resp){
            let data=resp.data;

            if (id!==0){
                name= '('+data.title+')';
            }


        })
        return name;
    }
    //接收从物料页面传来的id，然后通过id获取数据
    function getHref(){
        var url = decodeURI(location.search);
        var theRequest = new Object();
        if (url.indexOf("?") !== -1) {
            var str = url.substr(1);
            strs = str.split("&");
            for(var i = 0; i < strs.length; i ++) {
                theRequest[strs[i].split("=")[0]] = unescape(strs[i].split("=")[1]);
            }
        }
        return theRequest;
    }
    //用法  var 自己变量名字 = getHref().要获取的参数名字
    var sort = getHref().sort


    let wdSmall = document.querySelector(".window-small");
    let wdSmallOne = document.querySelector(".window-small-one");

    //点击显示物料的详细信息
    function productAttribute(datas){

        let checkP = document.querySelectorAll(".checkP");

        for (let i = 0; i < datas.length; i++) {
            checkP[i].onclick=function (){
                wdSmall.style.display="block";
                //根据物料id和仓库来查询该物料的详细信息
                axios({
                    method:"post",
                    url:"product/selectProductWhenAddBom?id="+datas[i].product_id+"&vault="+datas[i].vault+""
                }).then(function (resp){
                    let productAttribute=resp.data;
                    if (productAttribute.length>0){
                        let formdata="";

                        for (let j = 0; j < productAttribute.length; j++) {
                            formdata+='<div  class="PN">'+productAttribute[j].attributeName+'</div>\n' +
                                '            <div CLASS="PNI"><label>\n' +
                                '                <input disabled value= '+productAttribute[j].content+' >\n' +
                                '            </label></div>'
                        }
                        document.getElementById("PAttContent").innerHTML=formdata;
                        document.getElementById("pName").value=productAttribute[0].name;
                        document.getElementById("pMaterialNumber").value=productAttribute[0].material_number;
                    }
                    else {
                        alert("未查询到数据请联系相关人员！")
                    }
                })

            }

        }
    }

    //点击查看审核流程
    function shLc(data,appFormId){
        wdSmallOne.style.display="block";
        let status = document.querySelector(".shStatus");


        axios({
            method:"post",
            url:"applicationForm/selectPriceAndCount",
            data:data
        }).then(async function (resp)
        {
            let datas = resp.data;
            for (let i = 0; i < datas.length; i++) {

                let minister = datas[i].minister//部长是否筛选

                if ( Number(datas[i].id)===Number(appFormId) ){
                    //查询申申请人部门
                    await axios({
                        method:"post",
                        url:"user/selectDepartById",
                        data:data[i].userId
                    }).then(function (resp){
                        //不需要总经理审核
                        if (Number(minister) === 0) {
                            status.innerHTML = '<div>'+resp.data[0].departmentName+':<span class="wsh">未审核</span></div><div class="lc"></div>'
                        } else if (Number(minister) === 1) {
                            status.innerHTML = '<div>'+resp.data[0].departmentName+':<span class="tg">通过</span></div><div class="lc"></div>'
                        } else if (Number(minister) === 2) {
                            status.innerHTML = '<div>'+resp.data[0].departmentName+':<span class="wtg">未通过</span></div><div style="color: red;font-weight: bolder;margin: 10px auto" >未通过原因:<span>'+data[i].refuse+'</span></div><div class="lc"></div>'


                        }

                    })




                    //查询审核流程
                    await axios({
                        method: "post",
                        url: "applicationForm/selectLc",
                        data: datas[i].id
                    }).then(function (resp)
                    {
                        let lcDatas=resp.data;
                        let lc = document.querySelector(".lc")
                        for (let j = 0; j < lcDatas.length; j++) {

                            if (Number(lcDatas[j].result)===0){
                                lc.innerHTML+="<div>"+lcDatas[j].departmentName+":<span class=\"wsh\">未审核</span></div>"
                            }
                            else if (Number(lcDatas[j].result)===1){
                                lc.innerHTML+="<div>"+lcDatas[j].departmentName+":<span class=\"tg\">通过</span></div>"
                            }
                            else if (Number(lcDatas[j].result)===2){
                                lc.innerHTML+="<div>"+lcDatas[j].departmentName+":<span class=\"wtg\">未通过</span></div>"
                                lc.innerHTML+="<div style='color: red;font-weight: bolder;margin: 10px auto' >未通过原因:<span>"+data[i].refuse+"</span></div>"

                            }




                        }


                    })
                }

            }
        })


    }

    function fDate( t1, format = "YYYY-MM-DD HH:II "){
        let minutes = t1.getMinutes();
        if (minutes<10){
            const config = {
                YYYY:t1.getFullYear(),
                MM:t1.getMonth()+1,
                DD:t1.getDate(),
                HH:t1.getHours(),
                II:"0"+t1.getMinutes(),
                // SS:t1.getSeconds(),
            };
            for( const key in config){

                format = format.replace(key,config[key])


            }
            return format;
        }
        else {
            const config = {
                YYYY:t1.getFullYear(),
                MM:t1.getMonth()+1,
                DD:t1.getDate(),
                HH:t1.getHours(),
                II:t1.getMinutes(),
                // SS:t1.getSeconds(),
            };
            for( const key in config){

                format = format.replace(key,config[key])


            }
            return format;
        }



    }
