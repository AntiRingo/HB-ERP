<style>
    html{
        width: 100%;
        height: 100%;
        margin: 0;
        padding:0;
        font-family: Arial, sans-serif;
    }
    body{
        margin: 0;
        padding:0;
        color: #222;
    }


h3{
    margin: 0 ;
}

.sortTitle2{
    width: 100%;
    height: 36px;
    background: #f2f3f5; 
    border: 1px solid #d9dde2;
    border-radius: 3px;
    margin: 10px 0 0;
    padding: 0 14px;
    color: #0070bb;
    line-height: 36px;
    box-sizing: border-box;
    display: flex;
    align-items: center;
}
    .sortTitle2 h3{
        font-size: 14px;
        font-weight: 700;
        line-height: 36px;
    }
    .sortTitle2 a{
        color: #0070bb;
        text-decoration: none;
    }
    .sortTitle3{
        width: 100%;
        height: auto;
        margin: 0 0 4px;
        border-bottom: none;
        line-height: 1.2;
        font-weight: 700;
        font-size: 14px;
    }
.sortTitle3 a{
    text-decoration: underline dotted;
    text-underline-offset: 4px;
    color: #0070bb;
}
    #levelOne a{
        text-decoration: none;
        color: #111;
    }


    h2 a{
        color: black;
        text-decoration: none;
    }

    .content-wrap{
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 20px 24px;
        box-sizing: border-box;
    }
    .breadcrumb{
        width: 100%;
        margin: 10px 0 6px;
        color: #6b7280;
        font-size: 13px;
    }
    .breadcrumb-sep{
        margin: 0 6px;
        color: #a3aab5;
    }
    .page-head{
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        margin: 4px 0 10px;
    }
    .page-title{
        font-size: 24px;
        font-weight: 700;
        color: #111;
    }
    .page-count{
        font-size: 13px;
        color: #111;
        font-weight: 700;
    }
    .level-one{
        padding-top: 6px;
    }
    .level-one-title{
        font-size: 22px;
        font-weight: 700;
        margin: 8px 0 4px;
    }
    .level-one-title a{
        color: #111;
        text-decoration: none;
    }
    .level-one-title a:hover{
        text-decoration: none;
    }
    .level-one-meta{
        margin: 0 0 6px;
        color: #444;
        font-size: 13px;
        font-weight: 700;
    }
    .level-two-section{
        margin: 0 0 8px;
    }
    .third-grid{
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px 24px;
        padding: 14px 14px 6px;
        border-left: 1px solid #e6e8eb;
        border-right: 1px solid #e6e8eb;
        border-bottom: 1px solid #e6e8eb;
        box-sizing: border-box;
        background: #fff;
    }
    @media (max-width: 1100px) {
        .third-grid{
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }
    }
    @media (max-width: 720px) {
        .third-grid{
            grid-template-columns: 1fr;
        }
    }
    .third-block{
        min-width: 0;
    }
    .third-wrapper{
        border-left: 1px solid #e6e8eb;
        border-right: 1px solid #e6e8eb;
        border-bottom: 1px solid #e6e8eb;
        padding: 4px 14px 6px;
        box-sizing: border-box;
        background: #fff;
    }
    .third-section{
        padding: 6px 0;
        border-top: 1px solid #e6e8eb;
    }
    .third-section:first-child{
        border-top: none;
    }
    .four-columns{
        margin: 0;
        padding-left: 16px;
        list-style: disc;
        columns: 3;
        column-gap: 28px;
    }
    @media (max-width: 1100px) {
        .four-columns{
            columns: 2;
        }
    }
    @media (max-width: 720px) {
        .four-columns{
            columns: 1;
        }
    }
    .four-columns .four-item{
        break-inside: avoid;
    }
    .four-list{
        margin: 0;
        padding-left: 18px;
        list-style: disc;
    }
    .four-item{
        margin: 4px 0;
        font-size: 13px;
        line-height: 1.25;
    }
    .four-item a{
        color: #0070bb;
        text-decoration: none;
        display: inline-block;
        padding: 2px 4px;
        border-radius: 3px;
    }
    .four-item a:hover{
        background: rgba(0, 112, 187, 0.08);
        text-decoration: underline;
    }
</style>
<body>

<script type="text/javascript" src="js/axios-0.18.0.js"></script>
<script src="js/nav.js"></script>
<script src="js/model.js"></script>
<script>


    function height(){

        let iframe = window.parent.document.getElementById("iframepage");
        if (iframe){
            // let offsetHeight = document.body.clientHeight;

            iframe.style.height=96+"vh";

            // let num= window.parent.innerHeight;
            // if (Number(num)>Number(60)){
            //     let s = Number(num)-Number(60)
            //     iframe.style.height=s+"px";
            // }

        }


    }


    //查询所有一级分类
    let totalCount = 0;
    axios({
        method:"post",
        url:"sort/selectOne"
    }).then(async function (resp){
        let datas=resp.data;
        let ss1="";
        for (let i = 0; i < datas.length; i++) {
            ss1+= '    <div class="level-one" id="levelOne'+datas[i].id+'">\n' +
                '        <div class="level-one-title"><a href="productResult.html?id='+datas[i].id+'&level='+datas[i].level+'">'+datas[i].name+'</a></div>\n' +
                '        <div class="level-one-meta">结果总数：<span id="number'+datas[i].id+'"></span></div>\n' +
                '        <div id="allsortName'+datas[i].id+'"></div>\n' +
                '    </div>'

        }
        document.getElementById("allall").innerHTML=ss1;
        //查询二级分类
        for (let i = 0; i < datas.length; i++) {
          await  axios({
                method:"post",
                url:"sort/selectOtherLevel",
                data:datas[i].id
            }).then(async function (resp){
                let datasTwo = resp.data;
                let ss="";
              for (let j = 0; j < datasTwo.length; j++) {
                  ss+=' <div class="level-two-section">\n' +
                      '    <div class="sortTitle2">\n' +
                      '        <h3><a href="productResult.html?id='+datasTwo[j].id+'&level='+datasTwo[j].level+'">'+datasTwo[j].name+'</a></h3>\n' +
                      '    </div>\n' +
                      '    <div id="parentIdTwo'+datasTwo[j].id+'" class="third-wrapper"></div>\n' +
                      '</div>\n'
              }
              document.getElementById("allsortName"+datas[i].id+"").innerHTML=ss;

              //查询三级分类
              for (let j = 0; j < datasTwo.length; j++) {
                  await axios({
                      method:"post",
                      url:"sort/selectOtherLevel",
                      data:datasTwo[j].id
                  }).then(async function (resp){
                      let dataThree=resp.data;
                      let three="";
                      for (let k = 0; k < dataThree.length; k++) {
                          three+=' <div class="third-section">\n' +
                              '    <div class="sortTitle3"><a href="productResult.html?id='+dataThree[k].id+'&level='+dataThree[k].level+'">'+dataThree[k].name+'</a></div>\n' +
                              '    <ul class="four-columns" id="parentIdThree'+dataThree[k].id+'"></ul>\n' +
                              '</div>\n'
                      }
                      document.getElementById("parentIdTwo"+datasTwo[j].id+"").innerHTML=three;
                      //查询四级分类
                      for (let k = 0; k < dataThree.length; k++) {
                          await axios({
                              method:"post",
                              url:"sort/selectOtherLevel",
                              data:dataThree[k].id
                          }).then(async function (resp){
                              let dataFour=resp.data;
                              let four="";
                              for (let l = 0; l < dataFour.length; l++) {
                                  four+='<li class="four-item"><a href="productResult.html?id='+dataFour[l].id+'&level='+dataFour[l].level+'">'+dataFour[l].name+'</a></li>'
                              }
                              document.getElementById("parentIdThree"+dataThree[k].id+"").innerHTML=four;



                          })
                      }

                  })
              }
          })

            //查询总数
            axios({
                method:"post",
                url:"sort/selectAllDown",
                data:datas[i].id
            }).then( async function (resp){
                if (resp.data.length>0){
                    let n=0;
                    for (let j = 0; j < resp.data.length; j++) {
                        await   axios({
                            method:"post",
                            url:"sort/selectNumber",
                            data:resp.data[j].id_list
                        }).then(function (resp){
                            let m=resp.data;
                            n=Number(m)+Number(n);
                        })
                    }
                    await   axios({
                        method:"post",
                        url:"sort/selectNumber",
                        data:datas[i].id
                    }).then(function (resp){
                        let m=resp.data;
                        n=Number(m)+Number(n);
                    })
                    document.getElementById("number"+datas[i].id +"").innerHTML=n;
                    totalCount = Number(totalCount) + Number(n);
                    let totalEl = document.getElementById("totalCount");
                    if (totalEl) totalEl.innerHTML = totalCount;



                }else {
                    axios({
                        method:"post",
                        url:"sort/selectNumber",
                        data:datas[i].id
                    }).then(function (resp){
                        document.getElementById("number"+datas[i].id +"").innerHTML=resp.data;
                        totalCount = Number(totalCount) + Number(resp.data);
                        let totalEl = document.getElementById("totalCount");
                        if (totalEl) totalEl.innerHTML = totalCount;
                    })
                }
            })
        }
        height();
    })



    //搜索功能
    document.getElementById("search").onclick=function (){
        //检查搜索条件是否为空
        //获取搜索框中的条件
        let value = document.getElementById("searchContent").value;
        const encodedValue = encodeURIComponent(value); // 输出 "abc%25",输出对应的编码
        //获取分类筛选条件
        let value1 = document.getElementById("allSort").value;
        let sortVault = document.getElementById("sortVault").innerHTML;
        let sortName = encodeURIComponent(document.getElementById("sortName").textContent.trim());
        if (value.length>0){
            location.href="productResult.html?str="+encodedValue+"&sortId="+value1+"&level="+4+"&sortVault="+sortVault+"&sortName="+sortName+"";
        }else {
            alert("请输入查询关键字！")
        }


    }
</script>
<script src="js/searchSort.js"></script>
