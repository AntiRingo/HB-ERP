<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>公告管理系统</title>
  <link rel="stylesheet" href="css/all.min.css">
  <style>
    :root {
      --primary-color: #3498db;
      --secondary-color: #2c3e50;
      --accent-color: #e74c3c;
      --light-color: #ecf0f1;
      --dark-color: #34495e;
      --success-color: #27ae60;
      --warning-color: #f39c12;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
      line-height: 1.6;
      color: #333;
      background-color: #f5f7fa;
      display: flex;
      min-height: 100vh;
      overflow: hidden;
    }

    /* 侧边栏样式 */
    .sidebar {
      width: 280px;
      background: linear-gradient(135deg, var(--secondary-color) 0%, var(--dark-color) 100%);
      color: white;
      padding: 20px;
      box-shadow: 5px 0 15px rgba(0, 0, 0, 0.1);
      position: relative;
      z-index: 10;
      transition: all 0.3s ease;
    }

    .logo {
      display: flex;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .logo-icon {
      background-color: var(--primary-color);
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 12px;
    }

    .logo-text {
      font-size: 1.5rem;
      font-weight: 600;
    }

    .menu-item {
      display: flex;
      align-items: center;
      padding: 15px 18px;
      margin: 8px 0;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .menu-item:hover, .menu-item.active {
      background: rgba(255, 255, 255, 0.1);
    }

    .menu-item i {
      margin-right: 12px;
      font-size: 1.2rem;
      width: 24px;
      text-align: center;
    }

    .stats {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .stat {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
    }

    /* 主内容区样式 */
    .main-content {
      flex: 1;
      padding: 25px;
      overflow: auto;
      position: relative;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .search-box {
      position: relative;
      width: 350px;
    }

    .search-box input {
      width: 100%;
      padding: 15px 15px 15px 45px;
      border-radius: 50px;
      border: 1px solid #ddd;
      font-size: 1rem;
      transition: all 0.3s;
    }

    .search-box input:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.3);
    }

    .search-box i {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: #888;
    }

    .actions {
      display: flex;
      gap: 15px;
    }

    .btn {
      padding: 12px 24px;
      background: var(--primary-color);
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s;
    }

    .btn:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }

    .btn-new {
      background: linear-gradient(to right, var(--success-color), #2ecc71);
      box-shadow: 0 4px 12px rgba(46, 204, 113, 0.3);
    }

    .btn-filter {
      background: white;
      color: var(--dark-color);
      border: 1px solid #ddd;
    }

    .btn-filter:hover {
      border-color: var(--primary-color);
      color: var(--primary-color);
    }

    .notification-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      margin-top: 20px;
      overflow-y: auto;
      height: 80vh;
    }

    .notification-card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
      transition: all 0.3s;
      position: relative;
      min-height: 250px;
    }

    .notification-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    }

    .card-priority {
      height: 4px;
    }

    .priority-high {
      background-color: var(--accent-color);
    }

    .priority-medium {
      background-color: var(--warning-color);
    }

    .priority-low {
      background-color: var(--success-color);
    }

    .card-content {
      padding: 20px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
    }

    .card-date {
      color: #888;
      font-size: 0.9rem;
    }

    .card-title {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 10px;
      color: var(--secondary-color);
    }

    .card-excerpt {
      color: #666;
      margin-bottom: 20px;
      line-height: 1.6;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      background-color: var(--light-color);
      border-top: 1px solid #eee;
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
    }

    .card-department {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      color: var(--dark-color);
      font-weight: 500;
    }

    .card-actions {
      display: flex;
      gap: 12px;
    }

    .action-btn {
      background: white;
      border: 1px solid #ddd;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s;
    }

    .action-btn:hover {
      background: var(--primary-color);
      color: white;
      border-color: var(--primary-color);
    }

    /* 详情弹窗样式 */
    .detail-overlay, .create-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s;
    }

    .detail-overlay.active, .create-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .detail-container, .create-container {
      background: white;
      width: 90%;
      max-width: 850px;
      max-height: 90vh;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.3);
      transform: scale(0.9);
      transition: transform 0.4s;
      display: flex;
      flex-direction: column;
    }

    .detail-overlay.active .detail-container,
    .create-overlay.active .create-container {
      transform: scale(1);
    }

    .detail-header {
      background: linear-gradient(90deg, var(--secondary-color) 0%, var(--dark-color) 100%);
      color: white;
      padding: 25px;
      position: relative;
    }

    .close-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.2);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s;
    }

    .close-btn:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: rotate(90deg);
    }

    .detail-title {
      font-size: 1.8rem;
      margin-bottom: 10px;
    }

    .detail-subtitle {
      display: flex;
      justify-content: space-between;
      margin-top: 15px;
    }

    .detail-date, .detail-department {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .detail-content {
      padding: 30px;
      overflow-y: auto;
      flex: 1;
    }

    .detail-text {
      line-height: 1.8;
      font-size: 1.1rem;
      color: #333;
    }

    .detail-text p {
      margin-bottom: 20px;
    }

    .detail-footer {
      padding: 20px 30px;
      background-color: var(--light-color);
      border-top: 1px solid #ddd;
      display: flex;
      justify-content: flex-end;
    }

    .btn-download {
      background: var(--primary-color);
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.3s;
      box-shadow: 0 4px 12px rgba(52, 152, 219, 0.3);
    }

    .btn-download:hover {
      background: #2980b9;
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(52, 152, 219, 0.4);
    }

    /* 新建公告弹窗样式 */
    .create-header {
      background: linear-gradient(90deg, var(--success-color), #2ecc71);
      color: white;
      padding: 25px;
      position: relative;
    }

    .create-content {
      padding: 30px;
      overflow-y: auto;
      flex: 1;
    }

    .form-group {
      margin-bottom: 25px;
    }

    .form-label {
      display: block;
      margin-bottom: 10px;
      font-weight: 600;
      color: var(--dark-color);
    }

    .form-input {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
      transition: all 0.3s;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.3);
    }

    .form-select {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
      background-color: white;
    }

    .priority-group {
      display: flex;
      gap: 15px;
    }

    .priority-option {
      flex: 1;
      text-align: center;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .priority-option.active {
      background-color: var(--light-color);
      border-color: var(--primary-color);
    }

    .priority-option i {
      display: block;
      font-size: 2rem;
      margin-bottom: 10px;
    }

    .priority-high-option.active i {
      color: var(--accent-color);
    }

    .priority-medium-option.active i {
      color: var(--warning-color);
    }

    .priority-low-option.active i {
      color: var(--success-color);
    }

    textarea.form-input {
      height: 150px;
      resize: vertical;
    }

    /* 文件上传区域 */
    .upload-container {
      border: 2px dashed #ddd;
      border-radius: 10px;
      padding: 25px;
      text-align: center;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
    }

    .upload-icon {
      font-size: 3rem;
      color: var(--primary-color);
      margin-bottom: 15px;
    }

    .upload-text {
      margin-bottom: 15px;
    }

    .file-input {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    .file-list {
      border: 1px solid #eee;
      border-radius: 8px;
      padding: 15px;
      margin-top: 20px;
      max-height: 200px;
      overflow-y: auto;
    }

    .file-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      border-bottom: 1px solid #eee;
    }

    .file-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .file-icon {
      font-size: 1.5rem;
      color: #888;
    }

    .file-name {
      font-size: 0.9rem;
    }

    .file-size {
      font-size: 0.8rem;
      color: #777;
    }

    .file-actions {
      display: flex;
      gap: 5px;
    }

    .file-delete {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #f8f9fa;
      border: 1px solid #ddd;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #777;
      transition: all 0.3s;
    }

    .file-delete:hover {
      background: var(--accent-color);
      color: white;
    }

    .file-limit {
      font-size: 0.8rem;
      color: #777;
      margin-top: 10px;
    }

    .error-message {
      color: var(--accent-color);
      font-size: 0.9rem;
      margin-top: 5px;
      display: none;
    }

    .form-footer {
      padding: 20px 30px;
      background-color: var(--light-color);
      border-top: 1px solid #ddd;
      display: flex;
      justify-content: space-between;
    }

    .btn-cancel {
      background: white;
      color: var(--dark-color);
      border: 1px solid #ddd;
      padding: 12px 28px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
    }

    .btn-cancel:hover {
      background: #f8f9fa;
      border-color: #bbb;
    }

    .btn-save {
      background: linear-gradient(to right, var(--success-color), #2ecc71);
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.3s;
      box-shadow: 0 4px 12px rgba(46, 204, 113, 0.3);
    }

    .btn-save:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }

    /* 附件列表样式 */
    .attachments-container {
      margin-top: 30px;
      border-top: 1px solid #eee;
      padding-top: 20px;
      display: none;
    }

    .attachments-title {
      font-size: 1.2rem;
      margin-bottom: 15px;
      color: var(--secondary-color);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .attachment-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      background-color: #f9f9f9;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .attachment-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .attachment-name {
      font-size: 0.9rem;
    }

    .attachment-download {
      background: var(--primary-color);
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 5px;
      text-decoration: none;
    }

    .attachment-download:hover {
      background: #2980b9;
    }

    /* 响应式设计 */
    @media (max-width: 992px) {
      .notification-grid {
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      }

      .search-box {
        width: 280px;
      }
    }

    @media (max-width: 768px) {
      body {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        padding: 15px;
      }

      .menu {
        display: flex;
        overflow-x: auto;
        padding-bottom: 10px;
      }

      .menu-item {
        white-space: nowrap;
      }

      .main-content {
        padding: 20px;
      }

      .header {
        flex-direction: column;
        gap: 15px;
        align-items: flex-start;
      }

      .search-box {
        width: 100%;
      }

      .actions {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
<!-- 侧边导航 -->

<!-- 新建公告弹窗 -->
<div class="create-overlay" id="createOverlay">
  <div class="create-container">
    <div class="create-header">
      <div class="close-btn" onclick="closeCreateModal()">
        <i class="fas fa-times"></i>
      </div>
      <h2 class="detail-title">新建公告</h2>
    </div>
    <div class="create-content">
      <div class="form-group">
        <label class="form-label">公告标题</label>
        <input type="text" class="form-input" id="annTitle" placeholder="请输入公告标题">
        <div class="error-message" id="titleError">请填写公告标题</div>
      </div>

      <div class="form-group">
        <label class="form-label">发布部门</label>
        <select class="form-select" id="annDepartment">
          <option value="">请选择发布部门</option>
          <option>行政管理部</option>

  function downloadFile(button) {

    const encodedFile = button.dataset.file;
    const fileData = JSON.parse(decodeURIComponent(encodedFile));
// 已知文件地址（如后端返回的下载 URL）
    const fileUrl = fileData.url;

// 使用 fetch 获取文件流
    fetch(fileUrl)
            .then(response => {
              // 检查响应是否成功（状态码 200-299）
              if (!response.ok) {
                throw new Error(`文件下载失败，状态码：${response.status}`);
              }
              // 读取响应的二进制内容（ArrayBuffer）
              return response.arrayBuffer();
            })
            .then(arrayBuffer => {
              // 将 ArrayBuffer 转换为 Uint8Array（buffer 属性即 ArrayBuffer）
              const uint8Array = new Uint8Array(arrayBuffer);
              const contentBuffer = uint8Array.buffer; // 这就是你要的 buffer

              // 验证：打印 buffer 长度（应等于文件大小）
              console.log('文件内容 buffer 长度：', contentBuffer.byteLength);

              // 后续操作（如生成 Blob 或 File 对象）

              const objectUrl = URL.createObjectURL(blob);
              // ...（触发下载或其他逻辑）
              const anchor = document.createElement('a');
              anchor.href = objectUrl;
              anchor.download = fileData.name;
              anchor.click();
              URL.revokeObjectURL(objectUrl);
            })
            .catch(error => {
              console.error('读取文件失败:', error);
            });

     // 处理上传的文件
     function handleFiles(files) {
       for (var i = 0; i < files.length; i++) {
         var file = files[i];

         // 检查文件大小 (最大2MB)
         if (file.size > 2 * 1024 * 1024) {
           showFileError("文件过大，请上传小于2MB的文件");
           continue;
         }

         // 检查文件数量 (最多3个)
         if (uploadedFiles.length >= 3) {
           showFileError("最多只能上传3个文件");
           continue;
         }

         // 检查文件类型
         var fileType = getFileType(file);
         if (!isValidFileType(fileType)) {
           showFileError("不支持此文件类型");
           continue;
         }

         // 将文件添加到上传列表
         uploadedFiles.push({
           id: Date.now() + i, // 生成唯一ID
           name: file.name,
           size: formatFileSize(file.size),
           type: fileType,
           file: file
         });
       }


       updateFileList();
     }

     // 格式化文件大小
     function formatFileSize(bytes) {
       if (bytes < 1024) {
         return bytes + 'B';
       } else if (bytes < 1024 * 1024) {
         return (bytes / 1024).toFixed(1) + 'KB';
       } else {
         return (bytes / (1024 * 1024)).toFixed(1) + 'MB';
       }
     }

     // 获取文件类型
     function getFileType(file) {
       if (file.type.startsWith('image/')) return 'image';
       if (file.name.endsWith('.pdf')) return 'pdf';
       if (file.name.endsWith('.doc') || file.name.endsWith('.docx')) return 'word';
       if (file.name.endsWith('.xls') || file.name.endsWith('.xlsx')) return 'excel';
       if (file.name.endsWith('.txt')) return 'text';
       return 'other';
     }

     // 验证文件类型是否有效
     function isValidFileType(type) {
       return type !== 'other';
     }

                        </div>
                        <div>
                            <div class="file-name">${file.name}</div>
                            <div class="file-size">${file.size}</div>
                        </div>
                    </div>
                    <div class="file-actions">
                        <div class="file-delete" onclick="removeFile(${i})">
                            <i class="fas fa-times"></i>
                        </div>
                    </div>
                `;

         fileList.appendChild(fileItem);
       }
     }

     // 移除文件
     function removeFile(index) {
       uploadedFiles.splice(index, 1);
       updateFileList();
     }

     // 显示文件错误消息
     function showFileError(message) {
       var error = document.getElementById('fileError');
       error.textContent = message;
       error.style.display = 'block';
     }

     // 重置文件上传区域
     function resetFileUpload() {
       uploadedFiles = [];
       document.getElementById('fileInput').value = '';
       updateFileList();
     }

     // 选择优先级
     function selectPriority(priority) {
       // 移除所有激活状态
       var priorities = document.querySelectorAll('.priority-option');
       for (var i = 0; i < priorities.length; i++) {
         priorities[i].classList.remove('active');
       }

       // 设置选中的优先级
       if (priority === 'high') {
         document.querySelector('.priority-high-option').classList.add('active');
       } else if (priority === 'medium') {
         document.querySelector('.priority-medium-option').classList.add('active');
       } else if (priority === 'low') {
         document.querySelector('.priority-low-option').classList.add('active');
       }

       // 设置隐藏域的值
       document.getElementById('annPriority').value = priority;
     }

     // 保存公告
     function saveAnnouncement() {
       // 获取表单值
       var title = document.getElementById('annTitle').value.trim();
       var department = document.getElementById('annDepartment').value;
       var content = document.getElementById('annContent').value.trim();
       var priority = document.getElementById('annPriority').value;

       // 验证表单
       var isValid = true;

       if (!title) {
         document.getElementById('titleError').style.display = 'block';
         isValid = false;
       } else {
         document.getElementById('titleError').style.display = 'none';
       }

       if (!department) {
         document.getElementById('departmentError').style.display = 'block';
         isValid = false;
       } else {
         document.getElementById('departmentError').style.display = 'none';
       }

       if (!content) {
         document.getElementById('contentError').style.display = 'block';
         isValid = false;
       } else {
         document.getElementById('contentError').style.display = 'none';
       }

       if (!priority) {
         document.getElementById('priorityError').style.display = 'block';
         isValid = false;
       } else {
         document.getElementById('priorityError').style.display = 'none';
       }

       // 验证附件数量是否超过限制
       if (uploadedFiles.length > 3) {
         document.getElementById('fileError').textContent = "最多只能上传3个文件";
         document.getElementById('fileError').style.display = 'block';
         isValid = false;
       }

       if (!isValid) {
         return;
       }







       // 创建FormData对象
       var formData = new FormData();
       formData.append('title', title);
       formData.append('department',department);
       formData.append('content', content);
       formData.append('priority',priority)
       // 添加文件
       for (var i = 0; i < uploadedFiles.length; i++) {
         formData.append('files', uploadedFiles[i].file);
       }



       // 使用axios发送POST请求
       axios({
         method: "post",
         url: "publicUploadServlet",
         data: formData,
         headers: {
           'Content-Type': 'multipart/form-data '
         }
       }).then(function (resp){
         if (resp.data==="success"){
           alert("添加成功！");
           location.reload();
         }
         else {
           alert("添加失败，请联系相关人员！")
         }
       })

     }

     // 下载公告
     function downloadNotice() {
       var title = document.getElementById('detailTitle').textContent;
       var content = document.getElementById('detailText').textContent;

       downloadContent(title, content);
     }

     // 下载特定公告
     function downloadAnnouncement(id) {
       // 防止事件冒泡
       event.stopPropagation();

       for (var i = 0; i < announcements.length; i++) {

         if (announcements[i].publicNotice.id === id) {

           downloadContent(announcements[i].publicNotice.title, announcements[i].publicNotice.content);
           return;
         }
       }
     }



     // 下载内容到文件
     function downloadContent(title, content) {
       // 创建 Blob 对象
       var blob = new Blob([content], { type: 'text/plain' });

       // 创建下载链接
       var url = window.URL.createObjectURL(blob);
       var a = document.createElement('a');
       a.href = url;
       a.download = title + '.txt';

       // 添加到页面并点击
       document.body.appendChild(a);
       a.click();

       // 清理
       setTimeout(function() {
         document.body.removeChild(a);
         window.URL.revokeObjectURL(url);
       }, 100);
     }


     // 页面加载完成后初始化
     // document.addEventListener('DOMContentLoaded', await initialize());
 initialize()







</script>
