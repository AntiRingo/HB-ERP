<script src="js/axios-0.18.0.js"></script>

<script>


  //接收从物料页面传来的id，然后通过id获取数据
  function getHref(){
    var url = decodeURI(location.search);
    var theRequest = new Object();
    if (url.indexOf("?") !== -1) {
      var str = url.substr(1);
      strs = str.split("&");
      for(var i = 0; i < strs.length; i ++) {
        theRequest[strs[i].split("=")[0]] = unescape(strs[i].split("=")[1]);
      }
    }
    return theRequest;
  }
  //用法  var 自己变量名字 = getHref().要获取的参数名字
  var parentId=getHref().parentId;

  //根据parentId获取level
  axios({
    method: "post",
    url: "sort/selectLevel",
    data:parentId,
  }).then(function (resp){
    let level= Number(resp.data)+Number(1);

    //查询编码规则是否存在
    axios({
      method:"post",
      url:"code/ifCode",
      data:level
    }).then(function (resp){
      if (resp.data===true){
        //存在
        axios({
          method:"post",
          url:"code/selectCode",
          data:level
        }).then(async function (resp){
          let datas=resp.data;
          let data1='';
          let datas2='';
          let result="";
          let description="";
          let remove="";
          if (datas[0].description.length>0){
            result= datas[0].description.split(",");
            description=datas[0].description;
          }
          else {
            // await  axios({
            //   method:"post",
            //   url:"code/selectCode",
            //   data:0
            // }).then(function (resp){
            //   result= resp.data[0].description.split(",");
            //   description=resp.data[0].description;
            // })
          }


          for (let i = 0; i < result.length; i++) {
            data1+=result[i]
          }
          let result2="";
          if (datas[0].remove.length>0){
            result2=  datas[0].remove.split(",");
            remove=datas[0].remove;
          }
          else {
            // await  axios({
            //   method:"post",
            //   url:"code/selectCode",
            //   data:0
            // }).then(function (resp){
            //   result2= resp.data[0].remove.split(",");
            //   remove=resp.data[0].remove;
            // })
          }

          for (let i = 0; i < result2.length; i++) {
            datas2+=result2[i]
          }
          if (remove.length>0){
            document.getElementById("codeRule").innerHTML='长度为：'+datas[0].length+';范围是在'+description+'之间;不能包含'+remove+''
          }else {
            document.getElementById("codeRule").innerHTML='长度为：'+datas[0].length+';范围是在'+description+'之间;'
          }
          reg= new RegExp('^['+data1+']{'+datas[0].length+'}$');
          reg1= new RegExp('['+datas2+']');
          let ban=""
          for (let i = 0; i < datas[0].length; i++) {
            ban+='0'
          }
          //生成符合随机正则表达式的随机数
          document.getElementById("produceCode").onclick=function (){
            var regex = new RegExp(reg);

            // 生成符合正则表达式的随机字符串
            function produceCode(){
              var randomString = new RandExp(regex).gen();
              //判断是否符合第二个正则
              let b = reg1.test(randomString);
              if (b===false){
                //判断是否为系统默认禁用编码
                if (Number(ban)===Number(randomString)){
                  produceCode();
                }else {
                  document.getElementById("code").value=randomString;
                }

              }
              else {
                produceCode();
              }

            }

            produceCode();
          }



        })
      }else {
        //不存在
        document.getElementById("codeRule").innerHTML="编码规则不存在，请先创建编码规则！"
        document.getElementById("produceCode").onclick=function (){
          alert("请先创建编码规则！")
        }
      }
    })
  })


  //添加分类数据
  document.getElementById("submit").onclick=function (){
    //检测是否为空
    let value1 = document.getElementById("name").value;
    let value2 = document.getElementById("code").value;
    if (value1.length===0||value2.length===0){
      alert("有必填项未填写！")
    }else {
      //判断分类名是否重复
      axios({
        method:"post",
        url:"sort/selectNameAdd",
        data:value1
      }).then(function (resp){
        if (resp.data===false){
          if (window.confirm("您确定要添加分类吗？")){
            let data={
              id:"",
              parentId:parentId,
              name:"",
              level:"",
              describe:"",
              code:""

            }
            //获取level
            axios({
              method: "post",
              url: "sort/selectLevel",
              data:parentId,
            }).then(function (resp){

              data.level= Number(resp.data)+Number(1);

              //查询编码规则是否存在
              axios({
                method:"post",
                url:"code/ifCode",
                data:data.level
              }).then(function (resp){
                if (resp.data===true){
                  //编码规则存在
                  //根据level查询规则
                  axios({
                    method:"post",
                    url:"code/selectCode",
                    data:data.level
                  }).then(async function (resp) {
                    let datas=resp.data;
                    let data1='';
                    let datas2='';
                    let result="";
                    let description="";
                    let remove="";
                    if (datas[0].description.length>0){
                      result= datas[0].description.split(",");
                      description=datas[0].description;
                    }
                    else {
                      await  axios({
                        method:"post",
                        url:"code/selectCode",
                        data:0
                      }).then(function (resp){
                        result= resp.data[0].description.split(",");
                        description=resp.data[0].description;
                      })
                    }


                    for (let i = 0; i < result.length; i++) {
                      data1+=result[i]
                    }
                    let result2="";
                    if (datas[0].remove.split(",").length>0){
                      result2=  datas[0].remove.split(",");
                      remove=datas[0].remove;
                    }
                    else {
                      await  axios({
                        method:"post",
                        url:"code/selectCode",
                        data:0
                      }).then(function (resp){
                        result2= resp.data[0].remove.split(",");
                        remove=resp.data[0].remove;
                      })
                    }

                    for (let i = 0; i < result2.length; i++) {
                      datas2+=result2[i]
                    }

                    reg= new RegExp('^['+data1+']{'+datas[0].length+'}$');
                    reg1= new RegExp('['+datas2+']');
                    //得到长度，判断是否与相同长度的0相同
                    let ban=""
                    for (let i = 0; i < datas[0].length; i++) {
                      ban+='0'
                    }

                    data.name= document.getElementById("name").value;
                    data.describe=document.getElementById("describe").value;
                    data.code=document.getElementById("code").value;
                    // console.log(data)
                    //判断code是否符合条件
                    let value = data.code;
                    //判断长度和包含哪些
                    let b = reg.test(value);
                    if (b===true){
                      //符合第一个和第二个条件，判断第三个条件
                      if (datas[0].remove){

                        //判断是否有第三个条件，有的话
                        let b1 = reg1.test(value);
                        if (b1===false){
                          if (Number(ban)===Number(value)){
                            alert(""+ban+"为系统默认的编码，不可以使用！")
                          }else {
                            //不包含，执行下面的操作
                            //判断编码是否重复
                            if (Number(data.level)===Number(1)){
                              axios({
                                method:"post",
                                url:"sort/ifCodeExistAddFromTwoTable?code="+value+"&level="+data.level+"&parentId="+parentId+"",

                              }).then(function (resp){
                                //证明不重复可以执行修改操作
                                if (resp.data===false){
                                  //调用axios
                                  axios({
                                    method: "post",
                                    url:"sort/addSort",
                                    data:data
                                  }).then(function (resp){
                                    if (resp.data==="success"){
                                      alert("添加成功！");
                                      // history.back();
                                    }else {
                                      alert("添加失败，请联系相关人员！")
                                    }
                                  })
                                }else {
                                  //重复
                                  alert("该编码已被使用！")
                                }
                              })
                            }
                            else {
                              axios({
                                method:"post",
                                url:"sort/ifCodeExistAdd?code="+value+"&level="+data.level+"&parentId="+parentId+"",

                              }).then(function (resp){
                                //证明不重复可以执行修改操作
                                if (resp.data===false){
                                  //调用axios
                                  axios({
                                    method: "post",
                                    url:"sort/addSort",
                                    data:data
                                  }).then(function (resp){
                                    if (resp.data==="success"){
                                      alert("添加成功！");
                                      // history.back();
                                    }else {
                                      alert("添加失败，请联系相关人员！")
                                    }
                                  })
                                }else {
                                  //重复
                                  alert("该编码已被使用！")
                                }
                              })
                            }

                          }


                        }else {
                          //包含，提示编码不符合要求
                          alert("编码不符合编码规则！")
                        }
                      }else {
                        //没有去除条件
                        //判断编码是否重复
                        if (Number(ban)===Number(value)){
                          alert(""+ban+"为系统默认的编码，不可以使用！")
                        }else {
                          if (Number(data.level)===Number(1)){
                            axios({
                              method:"post",
                              url:"sort/ifCodeExistAddFromTwoTable?code="+value+"&level="+data.level+"&parentId="+parentId+"",
                              data:value
                            }).then(function (resp){
                              //证明不重复可以执行修改操作
                              if (resp.data===false){
                                //调用axios
                                axios({
                                  method: "post",
                                  url:"sort/addSort",
                                  data:data
                                }).then(function (resp){
                                  if (resp.data==="success"){
                                    alert("添加成功！");
                                    location.href='sort.html?nextId='+parentId+''
                                  }else {
                                    alert("添加失败，请联系相关人员！")
                                  }
                                })
                              }else {
                                //重复
                                alert("该编码已被使用！")
                              }
                            })
                          }
                          else {
                            axios({
                              method:"post",
                              url:"sort/ifCodeExistAdd?code="+value+"&level="+data.level+"&parentId="+parentId+"",
                              data:value
                            }).then(function (resp){
                              //证明不重复可以执行修改操作
                              if (resp.data===false){
                                //调用axios
                                axios({
                                  method: "post",
                                  url:"sort/addSort",
                                  data:data
                                }).then(function (resp){
                                  if (resp.data==="success"){
                                    alert("添加成功！");
                                    location.href='sort.html?nextId='+parentId+''
                                  }else {
                                    alert("添加失败，请联系相关人员！")
                                  }
                                })
                              }else {
                                //重复
                                alert("该编码已被使用！")
                              }
                            })
                          }

                        }


                      }
                    }else {

                      alert("编码不符合编码规则！")
                    }





                  })

                }else {
                  alert("编码规则不存在，请先添加"+data.level+"级分类的编码规则！");
                  // 在用户点击其他地方时，关闭弹窗
                  let wd = document.querySelector(".window");
                  window.onclick = function(event) {
                    if (event.target === wd) {
                      wd.style.display = "none";
                    }
                  }

                  //点击close也可以关闭弹窗
                  document.querySelector(".window-content-close").onclick=function (){
                    wd.style.display="none";
                  }



                  //打开窗口
                  document.querySelector(".window").style.display="block";
                  //设置默认规则
                  document.getElementById("length").value=2;
                  document.getElementById("description").value="0-9,A-Z,a-z";

                  document.getElementById("codeAdd").onclick=function (){
                    //判断长度和规则是否为空
                    let value = document.getElementById("length").value;
                    let value3 = document.getElementById("description").value;
                    if (value.length===0||value3.length===0){
                      alert("有必填项未填写！")
                    }else {

                      if (window.confirm("确定要添加这条编码规则吗？")){
                        let formdata={
                          id:"",
                          length:"",
                          description:"",
                          remove:"",
                          level:data.level
                        }

                        formdata.length=document.getElementById("length").value;
                        formdata.description=document.getElementById("description").value;
                        formdata.remove=document.getElementById("remove").value;
                        axios({
                          method:"post",
                          url:"code/addCode",
                          data:formdata
                        }).then(function (resp){
                          if (resp.data==="success"){
                            alert("添加规则成功！");
                            wd.style.display = "none";
                          }else {
                            alert("规则添加失败，请联系相关人员！")
                          }
                        })

                        return true;
                      }else {
                        return false;
                      }
                    }


                  }

                }
              })






            })
            return true;


          }else {
            return false;
          }
        }else {
          alert("该分类名已被使用，请核对后再试！")
        }
      })

    }

  }





  //上传图片
  let uploads = document.querySelectorAll(".uploads");

  for (let i = 0; i < uploads.length; i++) {
    uploads[i].onclick=function (){
      let files = document.getElementById("file"+i+"").files[0];
      let formdata=new FormData();
      formdata.append('file'+i+'',files);

      axios({
        method:"post",
        url:"uploadServlet",
        data:formdata,
        headers: {'Content-Type': 'multipart/form-data'},
      }).then(function (resp){
        document.getElementById("url"+i+"").value=resp.data;
      })
