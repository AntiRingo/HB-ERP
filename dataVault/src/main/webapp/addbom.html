    function move(){
        const list = document.getElementById("bomContent");

        let sourceNode; //当前在拖动的节点
        list.ondragstart = e => {
            setTimeout(() => {
                e.target.classList.add('moving')
            }, 0);
            sourceNode = e.target
            e.dataTransfer.effectAllowed = 'move';
        }
        list.ondragover = e => {
            e.preventDefault()
        }
        list.ondragenter = e => {
            e.preventDefault();
            if (e.target === list || e.target === sourceNode) {
                return
            }
            const children = Array.from(list.children)

            const sourceIndex = children.indexOf(sourceNode)
            const targetIndex = children.indexOf(e.target)
            // console.log(e.target)
            // console.log(sourceIndex,targetIndex)
            if (sourceIndex < targetIndex) {
                list.insertBefore(sourceNode, e.target.nextElementSibling)
            } else {
                list.insertBefore(sourceNode, e.target)
            }
            saveLocation();

        }
        list.ondragend = e => {
            e.target.classList.remove('moving');
            document.getElementById("move").innerHTML='<div class="moveSign"></div>';
            saveLocation();
        }

    }

    async function howMuch(id,sum) {

        //计算该产品中的零件价格数据
        await axios({
            method: "post",
            url: "finBom/selectPriceLj",
            data: id
        }).then(function (resp) {
            sum = Number(resp.data) + Number(sum) ;
        })

        //查询是否存在产品
        await axios({
            method: "post",
            url: "finBom/selectFinFromBom",
            data: id
        }).then(async function (resp) {
            let data = resp.data;
            for (let i = 0; i < data.length; i++) {
                let number = await howMuch(data[i].productId,0);

                sum = Number(sum) + Number(number)*Number(data[i].number)
            }
        })
        return sum;

    }

        function getDeptStatus(dept) {
            const members = dept.members || [];
            if (members.length === 0) return 'none';

            const selectedCount = members.filter(m => m.selected).length;
            if (selectedCount === 0) return 'none';
            if (selectedCount === members.length) return 'all';
            return 'partial';
        }

        function updateDeptStatus(deptId) {
            const dept = departmentData.find(d => d.id === Number(deptId));
            if (!dept) return;

            const status = getDeptStatus(dept);
            const deptCheckbox = document.querySelector(`.user-picker-department-checkbox[data-dept-id="${deptId}"]`);

            if (!deptCheckbox) return;

            switch (status) {
                case 'all':
                    deptCheckbox.checked = true;
                    deptCheckbox.indeterminate = false;
                    break;
                case 'partial':
                    deptCheckbox.checked = false;
                    deptCheckbox.indeterminate = true;
                    break;
                case 'none':
                    deptCheckbox.checked = false;
                    deptCheckbox.indeterminate = false;
                    break;
            }
        }

        renderPickerContent();

        // 获取所有选中的用户

                            id: member.id,
                            name: member.name,
                            dept: dept.name
                        });
                    }
                });
            });
            return selectedUsers;
        }
    })

    // 将二进制数据转为 Blob 并下载
    function saveAsExcelFile(buffer, fileName) {
        const data = new Blob([s2ab(buffer)], { type: "application/octet-stream" });
        const link = document.createElement("a");
        link.href = window.URL.createObjectURL(data);
        link.download = fileName;
        link.click();
    }

    // 将 ArrayBuffer 转为 Binary String
    function s2ab(s) {
        const buf = new ArrayBuffer(s.length);
        const view = new Uint8Array(buf);
        for (let i = 0; i < s.length; i++) view[i] = s.charCodeAt(i) & 0xFF;
        return buf;
    }

                const excelFile = uploadedFiles.find(f =>
                    f.name === excelName &&
                    excelExtensions.some(ext => f.name.toLowerCase().endsWith(ext))
                );
                return excelFile ? excelFile : null;
            }
        };
    }

    initFileManagement();

</script>
