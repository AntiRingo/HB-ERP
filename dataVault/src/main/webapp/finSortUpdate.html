<script>



  //接收从物料页面传来的id，然后通过id获取数据
  function getHref(){
    var url = decodeURI(location.search);
    var theRequest = new Object();
    if (url.indexOf("?") !== -1) {
      var str = url.substr(1);
      strs = str.split("&");
      for(var i = 0; i < strs.length; i ++) {
        theRequest[strs[i].split("=")[0]] = unescape(strs[i].split("=")[1]);
      }
    }
    return theRequest;
  }
  //用法  var 自己变量名字 = getHref().要获取的参数名字
  var id=getHref().id
  var reg=/^[]{}$/  //正则表达式包含什么内容0-9一类的
  var reg1=/[]/g; //正则表达式包含判断是否包含哪些字符
  //获取数据进行数据回显
  axios({
    method:"post",
    url:"finSort/selectSortById",
    data:id
  }).then(function (resp){
    let adatas=resp.data;
  document.getElementById("name").value=adatas[0].finSortName;
  document.getElementById("describe").value=adatas[0].finSortDescription;
  document.getElementById("code").value=adatas[0].finSortCode;
  let parentId = adatas[0].parentId;

  //根据level查询规则
    axios({
      method:"post",
      url:"finCode/selectCode",
      data:adatas[0].finSortLevel
    }).then(async function (resp){
      let datas=resp.data;


      let data1='';
      let datas2='';
      let result="";
      let description="";
      let remove="";
      if (datas[0].description.length>0){
        result= datas[0].description.split(",");
        description=datas[0].description;
      }
      else {
       await axios({
          method:"post",
          url:"finCode/selectCode",
          data:0
        }).then(function (resp){
          result= resp.data[0].description.split(",");
          description=resp.data[0].description;
        })
      }

      for (let i = 0; i < result.length; i++) {
        data1+=result[i]
      }
      let result2="";
      if (datas[0].remove.length>0){
        result2=  datas[0].remove.split(",");
        remove=datas[0].remove;
      }
      else {
        await  axios({
          method:"post",
          url:"finCode/selectCode",
          data:0
        }).then(function (resp){
          result2= resp.data[0].remove.split(",");
          remove=resp.data[0].remove;
        })
      }

      for (let i = 0; i < result2.length; i++) {
        datas2+=result2[i]
      }
      if (remove.length>0){
        document.getElementById("codeRule").innerHTML='长度为：'+datas[0].length+';范围是在'+description+'之间;不能包含'+remove+''
      }else {
        document.getElementById("codeRule").innerHTML='长度为：'+datas[0].length+';范围是在'+description+'之间;'
      }

      reg= new RegExp('^['+data1+']{'+datas[0].length+'}$');
      reg1= new RegExp('['+datas2+']');
      let ban="";
      for (let i = 0; i < datas[0].length; i++) {
        ban+='0'
      }


      //生成符合随机正则表达式的随机数
      document.getElementById("produceCode").onclick=function (){
        var regex = new RegExp(reg);

// 生成符合正则表达式的随机字符串
        function produceCode(){
          var randomString = new RandExp(regex).gen();
          //判断是否符合第二个正则
          let b = reg1.test(randomString);
          if (b===false){
            //判断是否为系统默认禁用编码
            if (Number(ban)===Number(randomString)){
              produceCode();
            }else {
              document.getElementById("code").value=randomString;
            }


          } else {
            produceCode();
          }

        }

        produceCode();
        }




      //更新数据
      document.getElementById("submit").onclick=function (){


        let value1 = document.getElementById("name").value;
        let value2 = document.getElementById("code").value;
        let product=[];
        //判断是否编码进行修改
         if (value2!==adatas[0].finSortCode||value1!==adatas[0].finSortName){
          //查询自己以及自己下面的分类中是否有物料存在。如果存在物料则不允许修改
           axios({
             method:"post",
             url:"finSort/selectAllDown",
             data:id
           }).then(function (resp){
             let cdatas=resp.data;
             let myself={
               id_list:''+id+''
             }
             cdatas.push(myself);//得到了自己以及自己下面所有的分类id，然后查询分类id下面是否有物料
             function f5(g,h){

               if (h>0){
                 axios({
                   method:"post",
                   url:"finProduct/selectAllInSort",
                   data:cdatas[g].id_list
                 }).then(function (resp){
                   let ddatas=resp.data;
                   if (ddatas.length>0){
                     product=ddatas.concat(product);
                     g--;
                     if (g>=0){
                       h--;

                       f5(g,h)
                     }else {
                       h--;
                       f5(0,h)
                     }

                   }else {
                     g--;
                     if (g>=0){
                       h--;

                       f5(g,h)
                     }else {
                       h--;
                       f5(0,h)
                     }
                   }
                 })
               }else if (h===0){
                 //得到product。物料的信息
                 if (product.length>0){
                   //表示分类下有物料,执行添加操作，先添加属性，在物料添加空的属性值
                   if (value2!==adatas[0].finSortCode){
                     alert("检测到分类下有物料信息存在，无法修改分类编码！")
                   }else if (value1!==adatas[0].finSortName){
                     alert("检测到分类下有物料信息存在，无法修改分类名称！")
                   }else if (value2!==adatas[0].finSortCode&&value1!==adatas[0].finSortName){
                     alert("检测到分类下有物料信息存在，无法修改分类名称和编码！")
                   }


                 }
                 else {

                   //表示分类下没有物料
                   //检测是否为空
                   if (value1.length===0||value2.length===0){
                     alert("有必填项未填写！")
                   }
                   else{
                     //检查分类名是否重复
                     axios({
                       method:"post",
                       url:"finSort/selectNameUpdate?id="+id+"",
                       data:value1
                     }).then(function (resp){
                       if (resp.data===false){
                         if (window.confirm("您确定要更新信息吗？")){



                           //判断code是否符合条件
                           let value = document.getElementById("code").value;
                           //判断长度和包含哪些
                           let b = reg.test(value);
                           if (b===true){
                             //判断去除的内容
                             if (datas[0].remove){//如果有去除条件
                               let b1 = reg1.test(value);
                               if (b1===false){

                                 //判断是否与禁用编码重复：0，代表空的
                                 if (Number(value)===Number(ban)){
                                   alert(""+ban+"为系统默认的编码，不可以使用！")
                                 }else {
                                   //不包含，执行下面的操作
                                   //判断编码是否重复
                                   if (Number(datas[0].level)===Number(1)){
                                     axios({
                                       method:"post",
                                       url:"finSort/ifCodeExistFromTwoTable?code="+value+"&level="+datas[0].level+"&id="+id+"&parentId="+parentId+"",
                                       data:value
                                     }).then(function (resp){
                                       if (resp.data===false){
                                         //证明不重复可以执行添加操作
                                         let data={
                                           id:id,
                                           finSortName:"",
                                           finSortDescription:"",
                                           finSortCode:""
                                         }

                                         data.finSortName= document.getElementById("name").value;
                                         data.finSortDescription=document.getElementById("describe").value;
                                         data.finSortCode=value;
                                         //调用axios
                                         axios({
                                           method: "post",
                                           url:"finSort/updateSort",
                                           data:data
                                         }).then(function (resp){
                                           if (resp.data==="success"){
                                             alert("修改成功！")
                                             location.reload();
                                           }else {
                                             alert("修改失败，请联系相关人员！")
                                           }
                                         })

                                       }else {
                                         //重复
                                         alert("该编码已被使用！")
                                       }
                                     })
                                   }
                                   else {
                                     axios({
                                       method:"post",
                                       url:"finSort/ifCodeExist?code="+value+"&level="+datas[0].level+"&id="+id+"&parentId="+parentId+"",
                                       data:value
                                     }).then(function (resp){
                                       if (resp.data===false){
                                         //证明不重复可以执行添加操作
                                         let data={
                                           id:id,
                                           finSortName:"",
                                           finSortDescription:"",
                                           finSortCode:""
                                         }

                                         data.finSortName= document.getElementById("name").value;
                                         data.finSortDescription=document.getElementById("describe").value;
                                         data.finSortCode=value;
                                         //调用axios
                                         axios({
                                           method: "post",
                                           url:"finSort/updateSort",
                                           data:data
                                         }).then(function (resp){
                                           if (resp.data==="success"){
                                             alert("修改成功！")
                                             location.reload();
                                           }else {
                                             alert("修改失败，请联系相关人员！")
                                           }
                                         })

                                       }else {
                                         //重复
                                         alert("该编码已被使用！")
                                       }
                                     })
                                   }


                                 }



                               }
                               else {
                                 //包含，提示编码不符合要求
                                 alert("编码不符合编码规则！")
                               }
                             }else {
                               //没有去除条件
                               //判断编码是否重复
                               if (Number(Number(datas[0].level)===Number(1))){
                                 axios({
                                   method:"post",
                                   url:"sort/ifCodeExistFromTwoTable?code="+value+"&level="+datas[0].level+"&id="+id+"&parentId="+parentId+"",
                                   data:value
                                 }).then(function (resp){
                                   if (Number(value)===Number(ban)){
                                     alert(""+ban+"为系统默认的编码，不可以使用！")
                                   }else {
                                     if (resp.data===false){
                                       //证明不重复可以执行添加操作
                                       let data={
                                         id:id,
                                         finSortName:"",
                                         finSortDescription:"",
                                         finSortCode:""
                                       }

                                       data.finSortName= document.getElementById("name").value;
                                       data.finSortDescription=document.getElementById("describe").value;
                                       data.finSortCode=value;
                                       //调用axios
                                       axios({
                                         method: "post",
                                         url:"finSort/updateSort",
                                         data:data
                                       }).then(function (resp){
                                         if (resp.data==="success"){
                                           alert("修改成功！")
                                           location.reload();
                                         }else {
                                           alert("修改失败，请联系相关人员！")
                                         }
                                       })

                                     }else {
                                       //重复
                                       alert("该编码已被使用！")
                                     }
                                   }
                                 })
                               }
                               else {
                                 axios({
                                   method:"post",
                                   url:"finSort/ifCodeExist?code="+value+"&level="+datas[0].level+"&id="+id+"&parentId="+parentId+"",
                                   data:value
                                 }).then(function (resp){
                                   if (Number(value)===Number(ban)){
                                     alert(""+ban+"为系统默认的编码，不可以使用！")
                                   }else {
                                     if (resp.data===false){
                                       //证明不重复可以执行添加操作
                                       let data={
                                         id:id,
                                         finSortName:"",
                                         finSortDescription:"",
                                         finSortCode:""
                                       }

                                       data.finSortName= document.getElementById("name").value;
                                       data.finSortDescription=document.getElementById("describe").value;
                                       data.finSortCode=value;
                                       //调用axios
                                       axios({
                                         method: "post",
                                         url:"finSort/updateSort",
                                         data:data
                                       }).then(function (resp){
                                         if (resp.data==="success"){
                                           alert("修改成功！")
                                           location.reload();
                                         }else {
                                           alert("修改失败，请联系相关人员！")
                                         }
                                       })

                                     }else {
                                       //重复
                                       alert("该编码已被使用！")
                                     }
                                   }
                                 })
                               }

                             }
                           }else {
                             alert("编码不符合编码规则！")
                           }




                           return true;
                         }else {
                           return false;
                         }
                       }else {
                         alert("该分类名已被使用，请核对后再试！")
                       }
                     })




                   }

                 }

               }

             }

             f5(cdatas.length-1,cdatas.length);

           })
        }
         else {
           //没有修改
        //检测是否为空
         if (value1.length===0||value2.length===0){
         alert("有必填项未填写！")
       }
         else{
    //检查分类名是否重复
    axios({
      method:"post",
      url:"finSort/selectNameUpdate?id="+id+"",
      data:value1
    }).then(function (resp){
      if (resp.data===false){
        if (window.confirm("您确定要更新信息吗？")){


                      //证明不重复可以执行添加操作
                      let data={
                        id:id,
                        finSortName:"",
                        finSortDescription:"",
                      }

                      data.finSortName= document.getElementById("name").value;
                      data.finSortDescription=document.getElementById("describe").value;

                      //调用axios
                      axios({
                        method: "post",
                        url:"finSort/updateSortExceptCode",
                        data:data
                      }).then(function (resp){
                        if (resp.data==="success"){
                          alert("修改成功！")
                          location.reload();
                        }else {
                          alert("修改失败，请联系相关人员！")
                        }
                      })



          return true;
        }else {
          return false;
        }
      }else {
        alert("该分类名已被使用，请核对后再试！")
      }
    })




  }
      }




      }

    })
  })

//根据id查询该分类下是否有物料，如果有不支持分类名称的修改

    }
  }
