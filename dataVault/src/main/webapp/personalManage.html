<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>个人信息管理</title>
    <link href="css/product.css" rel="stylesheet" />
    <script src="js/axios-0.18.0.js"></script>
    <script type="text/javascript" src="js/jquery-1.11.1.min.js"></script>

  </head>
  <style>

html{
    height: 100%;
    font-family: 宋体,serif;
}
      input{
          height:30px;
          border-radius: 15px;
          border: #003366 solid 1px;
          padding-left: 10px;
          padding-right: 10px;
          background-color: aliceblue;
      }
      button{
          cursor: pointer;
          /*border: #003366 solid 1px;*/
      }
      /*button:hover{*/
      /*    color: cornflowerblue;*/
      /*}*/
      /*button:active{*/
      /*    border: cornflowerblue solid 1px;*/
      /*}*/
      .sex{
          width: 30px;
          height: 30px;
          margin-right: 20%;
      }
      .updateSex{
          width: 30px;
          height: 30px;
          margin-right: 20%;
      }
  </style>
  <body>

  <div style="width: 100%;height: auto;">

      <div style="width:90%;margin: 10px auto auto auto">
          <div style="width: fit-content;margin: auto ">个人基本信息管理</div>
      </div>
      <div style="height:auto;width: 90%;margin: auto;padding:  2px">


          <!-- 姓名-->
          <div style="width: 99%;height: auto;display: flex;margin:auto">
              <div style="width: 20%;height: 50px;display: flex"><div style="width: fit-content;height:fit-content;margin: auto;align-self: center">姓名:</div></div>
              <div style="width: 80%;height: 50px;display: flex">
                  <div style="width: 100%;height: fit-content;margin: auto;align-self: center">
                      <input id="name" type="text" style="width: 90%;" >
                  </div>
              </div>
          </div>

          <!--性别-->
          <div style="width: 99%;height: auto;display: flex;margin:auto">
              <div style="width: 20%;height: 50px;display: flex"><div style="width: fit-content;height:fit-content;margin: auto;align-self: center">性别:</div></div>
              <div style="width: 80%;height: 50px;display: flex">
                  <div style="width: 100%;height: fit-content;margin: auto;align-self: center;">
                      <!--          <input id="sex" type="text" style="width: 90%;">-->
                      男 <input type="radio" name="sex" class="sex" > 女  <input type="radio" name="sex" class="sex">
                  </div>
              </div>
          </div>
          <div style="width: 99%;height: auto;display: flex;margin:auto">
              <div style="width: 20%;height: 50px;display: flex"><div style="width: fit-content;height:fit-content;margin: auto;align-self: center">年龄:</div></div>
              <div style="width: 80%;height: 50px;display: flex">
                  <div style="width: 100%;height: fit-content;margin: auto;align-self: center">
                      <input id="age" type="text" style="width: 90%;" oninput="value=value.replace(/^(0+)|[^\d]+/g,'')">
                  </div>
              </div>
          </div>

          <!-- 部门-->
          <div style="width: 99%;height: auto;display: flex;margin:auto">
              <div style="width: 20%;height: 50px;display: flex"><div style="width: fit-content;height:fit-content;margin: auto;align-self: center">部门:</div></div>
              <div style="width: 80%;height: 50px;display: flex">
                  <div style="width: 100%;height: fit-content;margin: auto;align-self: center">
                      <label for="departmentId"></label><input id="departmentId" type="hidden" style="display: none" value="">
                      <label for="departmentSelect"></label>
                      <select id="departmentSelect" style="width:90%" disabled>

                      </select>
                  </div>
              </div>
          </div>

      </div>


      <div style="width: 90%;height: auto;text-align: center;margin: 50px auto auto;">
          <button id="submit" style="width: 100px;height: 30px;border-radius: 15px;">确定修改</button>
      </div>
  </div>

   
  </body>
  <script type="text/javascript" src="js/axios-0.18.0.js"></script>
  <script type="text/javascript" src="js/personalManage.js"></script>
</html>
