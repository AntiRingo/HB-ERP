/* 为手风琴面板设计样式。 默认隐藏 */
.panel {

}

}

input[type="checkbox"] {
    display: none; /* 隐藏原生复选框 */
}

label.checkbox {
    position: relative;
    display: inline-block;
    width: 20px;
    height: 20px;
    margin-right: 10px;
    border: 1px solid #ccc;
    border-radius: 3px;
    cursor: pointer;
}

label.checkbox::before {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 16px;
    height: 16px;
    background-color: #fff;
    border-radius: 2px;
    box-shadow: inset 0 1px 3px rgba(0, 0, 0, .1);
    transition: all .2s;
}

input[type="checkbox"]:checked + label.checkbox::before {
    background-color: #007bff;
    margin-top: -1px;
    margin-left: -1px;
}
/* 全选 */
input[type="checkbox"]:checked + label.checkbox::after {
    content: "\2713";
    position: absolute;
    top: 1px;
    left: 4px;
    font-size: 14px;
    color: #fff;
    line-height: normal;
}

/* 未全选 */
input[type="checkbox"]:indeterminate + label.checkbox::before {
    background-color: #007bff;
    margin-top: -1px;
    margin-left: -1px;
}

input[type="checkbox"]:indeterminate + label.checkbox::after {
    content: "\2212";
    position: absolute;
    top: 1px;
    left: 5px;
    font-size: 14px;
    color: #fff;
    line-height: normal;
}

<script>



    let input1 = document.getElementById("updateExitTime");
    let time1 = null;//time用来控制事件的触发
    input1.addEventListener('input',function(){
        let value=input1.value;
        //防抖语句
        if(time1 !== null){
            clearTimeout(time1);
        }
        time1 = setTimeout(() => {
          //业务实现语句

            if (value>121) this.value=121;if (value<=0) this.value='';if (value<30&&value>0) this.value=30
            //这里的this指向的是input
        },500)
    })


</script>
