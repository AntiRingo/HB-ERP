<script>
    //获取BOM表名称
    async function bomTitleName(id) {
        let name = "";
        await axios({
            method: "post",
            url: "finBomTitle/selectById",
            data: id
        }).then(function (resp){
            let data=resp.data;

            if (id!==0){
                name= '('+data.title+')';
            }


        })
        return name;
    }

    //设置现在的时间
    function fDate1( t1, format = "YYYY-MM-DD HH:II:SS "){
        const config = {
            YYYY:t1.getFullYear(),
            MM:t1.getMonth()+1,
            DD:t1.getDate(),
            HH:t1.getHours(),
            II:t1.getMinutes(),
            SS:t1.getSeconds(),
        };

        for( const key in config){

            format = format.replace(key,config[key])


        }
        return format;
    }

    //打开页面后先删除一次已经过期的临时账号
    axios({
        method: "post",
        url:"temporaryUser/deleteByTime",
        data:fDate1(new Date())
    })

    function height(){

        let iframe = window.parent.document.getElementById("iframepage");
        if (iframe){
            let num= window.parent.innerHeight;
            if (Number(num)>Number(60)){
                let s = Number(num)-Number(60)
                iframe.style.height=s+"px";
            }

        }


    }
    height();

    var eye = document.getElementById("eye");
    var pwd = document.getElementById("password");
    var flag = 0;
    eye.onclick = function() {
        // 点击一次之后，flag一定要变化
        if (flag === 0) {
            pwd.type = "text";
            eye.src = "./images/open.png";
            flag = 1; //赋值操作
        } else {
            pwd.type = "password";
            eye.src = "./images/close.png";
            flag = 0;
        }
    }

    function displaySh(){
        //显示审核页面
        document.getElementById("agent").style.display="flex";

        //查询需要待审核的申请单

        let wdSmall = document.querySelector(".window-small");
        //点击显示物料的详细信息
        function productAttribute(datas){

            let checkP = document.querySelectorAll(".checkP");

            for (let i = 0; i < datas.length; i++) {
                checkP[i].onclick=function (){
                    wdSmall.style.display="block";
                    //根据物料id和仓库来查询该物料的详细信息
                    axios({
                        method:"post",
                        url:"product/selectProductWhenAddBom?id="+datas[i].product_id+"&vault="+datas[i].vault+""
                    }).then(function (resp){
                        let productAttribute=resp.data;
                        if (productAttribute.length>0){
                            let formdata="";

                            for (let j = 0; j < productAttribute.length; j++) {
                                formdata+='<div  class="PN">'+productAttribute[j].attributeName+'</div>\n' +
                                    '            <div CLASS="PNI"><label>\n' +
                                    '                <input disabled value= '+productAttribute[j].content+' >\n' +
                                    '            </label></div>'
                            }
                            document.getElementById("PAttContent").innerHTML=formdata;
                            document.getElementById("pName").value=productAttribute[0].name;
                            document.getElementById("pMaterialNumber").value=productAttribute[0].material_number;
                        }
                        else {
                            alert("未查询到数据请联系相关人员！")
                        }
                    })

                }

            }
        }
        //点击close也可以关闭弹窗
        document.querySelector(".window-small-content-close").onclick=function (){
            wdSmall.style.display="none";
        }

        //获取权限信息
        //查询权限
        let userId = parent.document.getElementById("userId").value;


        height();

        //设置现在的时间
        function fDate( t1, format = "YYYY-MM-DD HH:II "){
            let minutes = t1.getMinutes();
            if (minutes<10){
                const config = {
                    YYYY:t1.getFullYear(),
                    MM:t1.getMonth()+1,
                    DD:t1.getDate(),
                    HH:t1.getHours(),
                    II:"0"+t1.getMinutes(),
                    // SS:t1.getSeconds(),
                };
                for( const key in config){

                    format = format.replace(key,config[key])


                }
                return format;
            }
            else {
                const config = {
                    YYYY:t1.getFullYear(),
                    MM:t1.getMonth()+1,
                    DD:t1.getDate(),
                    HH:t1.getHours(),
                    II:t1.getMinutes(),
                    // SS:t1.getSeconds(),
                };
                for( const key in config){

                    format = format.replace(key,config[key])


                }
                return format;
            }



        }

        //设置现在的时间
        function fDate1( t1, format = "YYYY-MM-DD HH:II:SS "){
            const config = {
                YYYY:t1.getFullYear(),
                MM:t1.getMonth()+1,
                DD:t1.getDate(),
                HH:t1.getHours(),
                II:t1.getMinutes(),
                SS:t1.getSeconds(),
            };

            for( const key in config){

            return format;

        // 在用户点击其他地方时，关闭弹窗
        let wd = document.querySelector(".window");
        let wdSmallOne = document.querySelector(".window-small-one");
        window.onclick = function(event) {
            if (event.target === wd) {
                wd.style.display = "none";
            }
        }

        //点击close也可以关闭弹窗
        document.querySelector(".window-content-close").onclick=function (){
            wd.style.display="none";
        }

        document.querySelector(".window-small-content-close-one").onclick=function (){
            wdSmallOne.style.display="none";
        }
        //点击查看审核流程
        function shLc(data,appFormId){
            wdSmallOne.style.display="block";
            let status = document.querySelector(".shStatus");


            axios({
                method:"post",
                url:"applicationForm/selectPriceAndCount",
                data:data
            }).then(async function (resp)
            {
                let datas = resp.data;
                for (let i = 0; i < datas.length; i++) {

                    let minister = datas[i].minister//部长是否筛选
                    if ( Number(datas[i].id)===Number(appFormId) ){


                            //不需要总经理审核
                            if (Number(minister) === 0) {
                                status.innerHTML = '<div>部长:<span class="wsh">未审核</span></div><div class="lc"></div>'
                            } else if (Number(minister) === 1) {
